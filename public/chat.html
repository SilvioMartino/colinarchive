<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    interactive-widget=resizes-content is the key iOS/Android fix.
    It tells the browser: when the virtual keyboard opens, shrink the
    layout viewport instead of overlapping it. This means our flex
    layout naturally compresses the message list — no JS needed.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Chat | Colin Archive</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg:#121212; --bg-2:#181818; --bg-3:#1d1d1d;
      --surface:#202020; --surface-2:#252525; --surface-3:#2c2c2c;
      --fg:#f1f1f1; --fg-2:#dbdbdb; --muted:#bbbbbb; --soft:#9b9b9b;
      --border:#313131; --border-soft:#3b3b3b;
      --blue:#61d7cf; --blue-soft:rgba(97,215,207,0.12);
      --violet:#c69dff; --violet-soft:rgba(198,157,255,0.12);
      --green:#60d978; --red:#ff7575; --amber:#ffc96a;
      --shadow:0 16px 44px rgba(0,0,0,0.28);
      --shadow-soft:0 8px 22px rgba(0,0,0,0.18);
      --serif:'Crimson Text',Georgia,serif;
      --mono:'IBM Plex Mono','Courier New',monospace;
      --hand:'Caveat',cursive;
      --header-h:62px;   /* was 76px — tighter, more message space */
      --sidebar-w:320px;
      --ease:cubic-bezier(.22,1,.36,1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }

    body {
      font-family: var(--serif);
      /*
        Use 100dvh so the layout always matches the actual visible viewport.
        Do NOT use 100vh — on mobile it ignores the browser chrome height.
        Do NOT set overflow:hidden on body — it breaks native scroll and
        makes some browsers behave erratically with the keyboard.
      */
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at top right, rgba(97,215,207,0.035), transparent 28%),
        linear-gradient(to bottom, #161616, #111111);
      -webkit-text-size-adjust: 100%;
      text-rendering: optimizeLegibility;
    }

    button, input, textarea { font: inherit; color: inherit; }
    /* Suppress the blue/grey tap flash on every interactive element on mobile */
    *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }

    /*
      The entire app is a single flex column.
      header is fixed height, body grows to fill remaining space.
      This is what allows the keyboard to compress the message list
      without any JS — the flex layout does it automatically.
    */
    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .shell-header {
      flex-shrink: 0;
      min-height: var(--header-h);
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);
      align-items: center;
      gap: 0.85rem;
      padding: 0 0.9rem;
      padding-left: max(0.9rem, calc(0.9rem + env(safe-area-inset-left, 0px)));
      padding-right: max(0.9rem, calc(0.9rem + env(safe-area-inset-right, 0px)));
      padding-top: max(0.55rem, calc(0.55rem + env(safe-area-inset-top, 0px)));
      padding-bottom: 0.55rem;
      border-bottom: 1px solid var(--border);
      background: rgba(22,22,22,0.96);
      backdrop-filter: blur(10px);
      z-index: 30;
    }

    .header-left { display:flex; align-items:center; gap:0.65rem; min-width:0; }
    .logo { font-family:var(--mono); font-size:0.79rem; letter-spacing:0.12em; text-transform:uppercase; font-weight:500; white-space:nowrap; color:var(--fg); }

    .mobile-inbox-btn, .reply-bar-close, .icon-btn {
      width:42px; height:42px; border-radius:999px; border:1px solid var(--border);
      background:var(--surface); color:var(--fg-2);
      display:inline-flex; align-items:center; justify-content:center;
      cursor:pointer; transition:background .16s,border-color .16s,color .16s;
    }
    .mobile-inbox-btn:hover, .reply-bar-close:hover, .icon-btn:hover {
      background:var(--surface-2); border-color:#464646; color:var(--fg);
    }
    .mobile-inbox-btn { display:none; position:relative; flex-shrink:0; }
    .mobile-inbox-dot {
      position:absolute; top:7px; right:7px; width:8px; height:8px;
      border-radius:50%; background:var(--red); box-shadow:0 0 0 2px rgba(22,22,22,0.96); display:none;
    }
    .mobile-inbox-btn.has-unread .mobile-inbox-dot { display:block; }

    .header-room { min-width:0; text-align:center; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:0.18rem; }
    .header-room-title {
      font-family:var(--hand); font-size:1.12rem; color:var(--blue); line-height:1.05;
      max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .18s;
    }
    .shell-header.mode-private .header-room-title { color:#e0ceff; }
    .header-room-subtitle {
      font-family:var(--mono); font-size:0.65rem; letter-spacing:0.05em; text-transform:uppercase;
      color:var(--soft); line-height:1.2; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .header-room-subtitle.typing { color:var(--blue); }
    .shell-header.mode-private .header-room-subtitle.typing { color:#dcc6ff; }
    .header-right { display:flex; justify-content:flex-end; align-items:center; min-width:0; }

    .back-btn {
      display:inline-flex; align-items:center; gap:0.5rem; padding:0 1rem; min-height:42px;
      border-radius:999px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.045);
      color:var(--fg-2); font-family:var(--mono); font-size:0.74rem; letter-spacing:0.06em; text-transform:uppercase;
      cursor:pointer; white-space:nowrap; transition:background .16s,border-color .16s,color .16s;
    }
    .back-btn:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.16); color:var(--fg); }

    /* ── App body: sidebar + chat ── */
    .app-body {
      flex: 1;
      min-height: 0;      /* critical — allows flex child to shrink below content size */
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0,1fr);
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar, .mobile-sidebar {
      background: rgba(18,18,18,0.98);
      display: flex;
      flex-direction: column;
      min-height: 0;
      backdrop-filter: blur(12px);
    }
    .sidebar { border-right: 1px solid var(--border); }

    .sidebar-top {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: rgba(22,22,22,0.6);
    }
    .sidebar-title-row { display:flex; align-items:center; justify-content:space-between; gap:0.75rem; margin-bottom:0.85rem; }
    .sidebar-title, .presence-summary, .sidebar-section-label { font-family:var(--mono); text-transform:uppercase; letter-spacing:0.06em; }
    .sidebar-title { font-size:0.72rem; color:rgba(255,255,255,0.5); }
    .presence-summary { font-size:0.68rem; color:var(--green); white-space:nowrap; }

    .sidebar-search {
      width:100%; border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--fg);
      border-radius:12px; padding:0.72rem 0.9rem; outline:none;
      font-family:var(--mono); font-size:0.8rem;
      transition:border-color .16s,background .16s;
    }
    .sidebar-search::placeholder { color:rgba(255,255,255,0.22); }
    .sidebar-search:focus { border-color:rgba(97,215,207,0.45); background:rgba(255,255,255,0.04); }

    .sidebar-body { min-height:0; overflow:auto; padding:0.6rem 0.7rem 0.8rem; }
    .sidebar-body::-webkit-scrollbar, .message-list::-webkit-scrollbar { width:4px; }
    .sidebar-body::-webkit-scrollbar-thumb, .message-list::-webkit-scrollbar-thumb { background:#333; border-radius:999px; }
    .sidebar-body::-webkit-scrollbar-track, .message-list::-webkit-scrollbar-track { background:transparent; }

    .sidebar-section-label { font-size:0.62rem; color:rgba(255,255,255,0.2); padding:0 0.3rem; margin:0.2rem 0 0.55rem; }
    .user-list { display:flex; flex-direction:column; gap:0.2rem; }
    .user-item {
      width:100%; display:flex; align-items:center; gap:0.75rem; text-align:left;
      padding:0.7rem 0.75rem; border-radius:14px; border:1px solid transparent;
      background:transparent; cursor:pointer; color:inherit;
      transition:background .15s,border-color .15s,transform .12s;
    }
    .user-item:hover { background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.05); transform:translateX(2px); }
    /* Active item: violet ring to match private room colour */
    .user-item.active {
      background:rgba(198,157,255,0.08);
      border-color:rgba(198,157,255,0.25);
    }

    .user-avatar-wrap { position:relative; width:38px; height:38px; flex-shrink:0; }
    .user-avatar, .message-avatar {
      width:100%; height:100%; display:flex; align-items:center; justify-content:center;
      border-radius:50%; border:1px solid var(--border-soft);
      background:linear-gradient(135deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));
      color:var(--fg); user-select:none;
    }
    .user-avatar { font-family:var(--hand); font-size:1.05rem; }
    /* Active avatar gets violet ring */
    .user-item.active .user-avatar { border-color:rgba(198,157,255,0.5); }

    .presence-dot {
      position:absolute; right:-1px; bottom:-1px; width:10px; height:10px;
      border-radius:50%; border:2px solid rgba(18,18,18,0.98); background:#3a3a3a;
      transition:background .2s;
    }
    .presence-dot.online { background:var(--green); }

    .sidebar-user-main { min-width:0; flex:1; }
    .sidebar-user-top { display:flex; align-items:baseline; justify-content:space-between; gap:0.5rem; margin-bottom:0.18rem; }
    /* Name is dominant, preview is secondary, time is barely there */
    .sidebar-user-name { font-family:var(--mono); font-size:0.8rem; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
    .sidebar-user-time { font-family:var(--mono); font-size:0.64rem; color:rgba(255,255,255,0.28); white-space:nowrap; flex-shrink:0; }
    .sidebar-user-sub { display:block; font-family:var(--mono); font-size:0.7rem; color:rgba(255,255,255,0.38); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.25; }
    .sidebar-user-sub.has-unread { color:#eefdfc; font-weight:500; }
    .sidebar-user-sub.is-typing { color:var(--blue); }
    .unread-badge {
      flex-shrink:0; min-width:1.25rem; height:1.25rem; padding:0 0.34rem; border-radius:999px;
      background:var(--red); color:white; display:inline-flex; align-items:center; justify-content:center;
      font-family:var(--mono); font-size:0.65rem;
    }

    /* ── Chat shell ── */
    .chat-shell {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;   /* contain the chat — scroll happens inside message-list only */
    }

    .chat-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: transparent;
      position: relative;
      transition: background 0.4s ease;
    }

    /* Public room: cool dark teal-tinted atmosphere */
    .chat-main.is-public {
      background:
        radial-gradient(ellipse at 20% 0%, rgba(97,215,207,0.06) 0%, transparent 48%),
        radial-gradient(ellipse at 80% 100%, rgba(97,215,207,0.03) 0%, transparent 40%);
    }

    /* Private room: warm violet cocoon */
    .chat-main.is-private {
      background:
        radial-gradient(ellipse at top right, rgba(198,157,255,0.1) 0%, transparent 50%),
        radial-gradient(ellipse at bottom left, rgba(198,157,255,0.05) 0%, transparent 44%);
    }

    /* Watermark: large faint word centred behind messages */
    .chat-main::before {
      content: attr(data-room-label);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--hand);
      font-size: clamp(4rem, 18vw, 9rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(97,215,207,0.035);  /* default teal for public */
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      z-index: 0;
      transition: color 0.4s ease, opacity 0.4s ease;
    }
    .chat-main.is-private::before {
      color: rgba(198,157,255,0.04);
    }

    /* Make sure message content always sits above watermark */
    .message-list { position: relative; z-index: 1; }

    /* ── Message list ── */
    .message-list {
      /*
        flex:1 + min-height:0 is the magic combination.
        When the keyboard opens and the viewport shrinks, this element
        compresses naturally — no JS measurement needed at all.
      */
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.1rem clamp(1rem, 3vw, 2rem) 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.78rem;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: auto;
    }

    /* Forces touch-scroll to register even when content is short */
    .message-list::after { content:''; display:block; min-height:1px; }

    .day-divider {
      align-self:center; padding:0.3rem 0.7rem; border-radius:999px;
      border:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.035);
      color:var(--muted); font-family:var(--mono); font-size:0.7rem; letter-spacing:0.04em; text-transform:uppercase;
    }

    /* ── Message rows ── */
    .message-row {
      width:100%; max-width:900px; display:flex; align-items:flex-start; gap:0.72rem; position:relative;
      animation: msgIn 180ms var(--ease) both;
    }
    @keyframes msgIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

    .message-row.own { align-self:flex-end; flex-direction:row-reverse; }
    .message-avatar { width:36px; height:36px; flex-shrink:0; font-family:var(--hand); font-size:0.95rem; }
    .message-stack { min-width:0; max-width:min(100%,760px); display:flex; flex-direction:column; gap:0.28rem; }

    .message-bubble {
      position:relative;
      /* Gradient gives depth — darker top fades to lighter bottom like a physical surface */
      background: linear-gradient(to bottom, rgba(255,255,255,0.055), rgba(255,255,255,0.032));
      border:1px solid rgba(255,255,255,0.07);
      border-left:3px solid rgba(97,215,207,0.55); border-radius:16px;
      padding:0.68rem 0.9rem 0.62rem; box-shadow:var(--shadow-soft); user-select:text;
      cursor:pointer; transition:background .14s,border-color .14s,box-shadow .14s,transform .1s;
    }
    .message-bubble:hover { box-shadow:0 0 0 1px rgba(97,215,207,0.15),var(--shadow-soft); }
    .message-bubble:active { transform:scale(0.985); }
    .message-row.own .message-bubble {
      border-left-color:rgba(198,157,255,0.65);
      background:linear-gradient(to bottom, rgba(198,157,255,0.09), rgba(198,157,255,0.05));
    }
    .message-bubble.menu-open { box-shadow:0 0 0 2px rgba(97,215,207,0.2),var(--shadow-soft); }
    .message-row.failed .message-bubble { border-left-color:rgba(255,117,117,0.75); background:rgba(255,117,117,0.05); }

    /* Private mode: no avatar, rounder bubbles */
    .chat-main.is-private .message-row { max-width:100%; gap:0; }
    .chat-main.is-private .message-avatar { display:none; }
    .chat-main.is-private .message-stack { max-width:min(100%,72%); }
    .chat-main.is-private .message-bubble {
      border-left:none; border-radius:20px; padding:0.72rem 0.95rem 0.68rem;
      background:linear-gradient(to bottom, rgba(255,255,255,0.065), rgba(255,255,255,0.04));
    }
    .chat-main.is-private .message-row.own .message-bubble {
      background:linear-gradient(to bottom, rgba(198,157,255,0.18), rgba(198,157,255,0.11));
      border-color:rgba(198,157,255,0.18);
    }
    .chat-main.is-private .message-row:not(.own) .message-bubble { background:linear-gradient(to bottom,rgba(255,255,255,0.065),rgba(255,255,255,0.04)); border-color:rgba(255,255,255,0.07); }
    .chat-main.is-private .message-header { display:none; }
    .chat-main.is-private .message-row.failed .message-bubble { border-left-color:transparent; border-color:rgba(255,117,117,0.22); background:rgba(255,117,117,0.06); }

    /* ── Message grouping — PRIVATE ONLY ──────────────────────────────────────
       Grouping only applies in private chat where it's visually clean.
       In public chat names + avatars make grouping confusing, so it's disabled.
    ──────────────────────────────────────────────────────────────────────── */
    .chat-main.is-private .message-row.msg-group-mid,
    .chat-main.is-private .message-row.msg-group-last { margin-top:-0.38rem; }

    .chat-main.is-private .message-row.msg-group-mid .message-avatar,
    .chat-main.is-private .message-row.msg-group-last .message-avatar { opacity:0; pointer-events:none; }

    .chat-main.is-private .message-row.msg-group-mid:not(.own) .message-bubble { border-top-left-radius:7px; }
    .chat-main.is-private .message-row.msg-group-last:not(.own) .message-bubble { border-top-left-radius:7px; }
    .chat-main.is-private .message-row.own.msg-group-mid .message-bubble { border-top-right-radius:7px; }
    .chat-main.is-private .message-row.own.msg-group-last .message-bubble { border-top-right-radius:7px; }
    .chat-main.is-private .message-row.msg-group-mid .message-time { display:none; }

    /* Reply stub */
    .reply-stub { display:flex; align-items:flex-start; gap:0.5rem; background:rgba(255,255,255,0.03); border-radius:10px; padding:0.36rem 0.48rem; margin-bottom:0.45rem; cursor:pointer; }
    .reply-stub-line { width:3px; align-self:stretch; border-radius:999px; background:rgba(97,215,207,0.72); flex-shrink:0; }
    .message-row.own .reply-stub-line { background:rgba(198,157,255,0.8); }
    .reply-stub-name { font-family:var(--mono); font-size:0.68rem; color:var(--blue); line-height:1.15; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:0.08rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .message-row.own .reply-stub-name { color:#dfcbff; }
    .reply-stub-text { font-size:0.84rem; color:var(--muted); line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .message-header { display:flex; align-items:flex-start; justify-content:space-between; gap:0.75rem; margin-bottom:0.18rem; }
    .message-name { font-family:var(--hand); font-size:1rem; color:var(--fg); font-weight:600; line-height:1; }
    .message-time { font-family:var(--mono); font-size:0.72rem; color:var(--soft); white-space:nowrap; flex-shrink:0; margin-top:2px; }
    .message-text { font-size:1rem; line-height:1.55; color:var(--fg-2); white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; }
    .message-text.deleted { color:var(--muted); font-style:italic; }

    .message-status {
      min-height:0.95rem; display:flex; align-items:center; justify-content:flex-end;
      padding:0 0.15rem; font-family:var(--mono); font-size:0.64rem; color:rgba(255,255,255,0.45);
      letter-spacing:0.03em; text-transform:lowercase;
    }
    .message-status.hidden-status { display:none; }
    .message-status.failed { color:var(--red); }
    .message-status.seen { color:rgba(97,215,207,0.78); }
    .message-status.delivered { color:rgba(255,255,255,0.45); }

    /* Reactions */
    .reactions { display:flex; flex-wrap:wrap; gap:0.32rem; min-height:0; }
    .reaction-chip {
      display:inline-flex; align-items:center; gap:0.28rem; min-height:28px;
      padding:0.18rem 0.52rem; border-radius:999px; border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.045); cursor:pointer; font-size:0.82rem; line-height:1;
      transition:background .14s,border-color .14s;
    }
    .reaction-chip:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.14); }
    .reaction-chip.mine { background:var(--blue-soft); border-color:rgba(97,215,207,0.28); }
    .reaction-chip .count { font-family:var(--mono); font-size:0.68rem; color:var(--muted); }

    /* System/empty — no border, text floats in space */
    .system-row { align-self:center; width:100%; max-width:760px; }
    .system-card { padding:2.5rem 1rem; text-align:center; background:transparent; color:var(--muted); }
    .empty-icon { font-size:1.8rem; margin-bottom:0.75rem; opacity:0.6; display:block; }
    .empty-title { font-family:var(--mono); font-size:0.78rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.35); margin-bottom:0.6rem; }
    .empty-hint { font-size:1rem; line-height:1.65; color:rgba(255,255,255,0.22); max-width:36ch; margin:0 auto; }

    /* Typing indicator */
    .typing-row { align-self:flex-start; }
    .typing-bubble {
      display:inline-flex; align-items:center; gap:0.55rem; border-radius:14px;
      border:1px solid rgba(255,255,255,0.06); border-left:3px solid rgba(97,215,207,0.45);
      background:rgba(255,255,255,0.04); padding:0.56rem 0.85rem;
    }
    .typing-label { font-family:var(--mono); font-size:0.74rem; color:var(--muted); }
    .typing-dots { display:inline-flex; align-items:center; gap:4px; }
    .typing-dots span { width:6px; height:6px; border-radius:50%; background:var(--blue); opacity:0.75; animation:typingPulse 1s ease-in-out infinite; }
    .typing-dots span:nth-child(2){ animation-delay:.16s; }
    .typing-dots span:nth-child(3){ animation-delay:.32s; }
    @keyframes typingPulse { 0%,100%{transform:translateY(0);opacity:0.35} 45%{transform:translateY(-3px);opacity:1} }

    /* Jump highlight for reply scroll */
    .jump-highlight .message-bubble { box-shadow:0 0 0 2px rgba(97,215,207,0.26),var(--shadow-soft); }

    /* Swipe-to-reply: the stack slides horizontally, snaps back */
    .message-stack {
      touch-action: pan-y;   /* allow vertical scroll; horizontal is intercepted by JS */
      will-change: transform;
    }
    /* Reply arrow that appears as you swipe */
    .swipe-arrow {
      position:absolute; top:50%; transform:translateY(-50%) scale(0.7);
      width:32px; height:32px; border-radius:50%;
      background:rgba(97,215,207,0.15); border:1px solid rgba(97,215,207,0.3);
      display:flex; align-items:center; justify-content:center;
      font-size:0.95rem; opacity:0; transition:opacity .1s, transform .1s;
      pointer-events:none;
    }
    .message-row.own .swipe-arrow { right:calc(100% + 10px); }
    .message-row:not(.own) .swipe-arrow { left:calc(100% + 10px); }
    .message-row.swiping .swipe-arrow { opacity:1; transform:translateY(-50%) scale(1); }

    /* Own messages slide in from the right */
    @keyframes msgInOwn {
      from { opacity:0; transform:translateY(8px) translateX(12px); }
      to   { opacity:1; transform:translateY(0) translateX(0); }
    }
    .message-row.own { animation: msgInOwn 200ms var(--ease) both; }

    /* Unread scroll pill */
    .unread-pill {
      position:absolute; bottom:calc(100% + 0.6rem); left:50%; transform:translateX(-50%);
      background:rgba(28,28,28,0.92); border:1px solid var(--border);
      border-radius:999px; padding:0.36rem 0.85rem;
      font-family:var(--mono); font-size:0.68rem; color:var(--blue);
      cursor:pointer; white-space:nowrap; backdrop-filter:blur(8px);
      box-shadow:var(--shadow-soft); transition:opacity .18s, transform .18s;
      z-index:10;
    }
    .unread-pill:hover { background:rgba(40,40,40,0.96); }

    /* Message time: subtle by default, full on tap */
    .message-time { opacity: 0.55; transition: opacity .15s; }
    .message-row.row-active .message-time { opacity: 1; }

    /* ── Composer ── */
    .composer-wrap {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: rgba(19,19,19,0.98);
      backdrop-filter: blur(10px);
      /*
        padding-bottom handles the home indicator on iPhone.
        We do NOT add extra padding here based on keyboard — the layout
        handles keyboard avoidance at the .app level via 100dvh + flex.
      */
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .reply-bar {
      display:none; align-items:center; gap:0.7rem; padding:0.5rem 0.9rem;
      border-bottom:1px solid rgba(255,255,255,0.05); background:rgba(26,26,26,0.76);
    }
    .reply-bar.active { display:flex; }
    .reply-bar-line { width:2px; align-self:stretch; border-radius:999px; background:rgba(97,215,207,0.42); opacity:0.65; flex-shrink:0; }
    .reply-bar-inner { min-width:0; flex:1; }
    .reply-bar-name { font-family:var(--mono); font-size:0.66rem; color:rgba(97,215,207,0.78); line-height:1.15; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:0.06rem; }
    .reply-bar-text { font-size:0.86rem; color:rgba(255,255,255,0.66); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .composer-inner { padding:0.9rem; }
    .composer-status { min-height:1rem; margin-bottom:0.46rem; padding:0 0.1rem; font-family:var(--mono); font-size:0.72rem; color:var(--soft); }
    .composer-status:empty { display:none; }
    .composer-status.error { color:var(--red); }
    .composer { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:0.65rem; align-items:end; }

    .message-input {
      width:100%; min-height:52px; max-height:160px; resize:none;
      overflow-y:hidden; overflow-x:hidden;
      border:1px solid var(--border); border-radius:16px; background:rgba(255,255,255,0.035);
      color:var(--fg); padding:0.9rem 0.95rem; line-height:1.5; outline:none;
      appearance:none; -webkit-appearance:none;
      transition:border-color .16s,background .16s,box-shadow .16s;
    }
    .message-input:focus {
      border-color:rgba(97,215,207,0.5);
      background:rgba(255,255,255,0.045);
      box-shadow:0 0 0 3px rgba(97,215,207,0.08);
    }
    .message-input::placeholder { color:var(--soft); }

    .send-btn {
      min-width:112px; height:52px; border-radius:999px;
      border:1px solid rgba(97,215,207,0.2); background:rgba(97,215,207,0.06); color:rgba(97,215,207,0.5);
      cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
      gap:0.5rem; padding:0 1.15rem; font-family:var(--mono); font-size:0.76rem;
      letter-spacing:0.08em; text-transform:uppercase;
      transition:background .16s,border-color .16s,color .16s,opacity .16s,transform .1s;
    }
    /* Has content — button lights up */
    .send-btn.has-content {
      border-color:rgba(97,215,207,0.45);
      background:var(--blue-soft);
      color:var(--blue);
    }
    .send-btn.has-content:hover { background:rgba(97,215,207,0.18); border-color:rgba(97,215,207,0.62); color:#a3f1eb; }
    .send-btn:active { transform:scale(0.94); }
    .send-btn:disabled { opacity:0.35; cursor:not-allowed; }

    .helper-line { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:0.5rem 0.1rem 0; color:var(--soft); font-family:var(--mono); font-size:0.72rem; }

    /* ── Popover ── */
    .message-popover {
      position:fixed; z-index:95; min-width:200px; max-width:min(92vw,280px);
      border-radius:20px; border:1px solid rgba(255,255,255,0.08);
      background:rgba(26,26,26,0.97);
      padding:0.5rem; box-shadow:var(--shadow); backdrop-filter:blur(16px);
    }
    .popover-reactions {
      display:flex; justify-content:space-between; gap:0.2rem;
      padding:0.2rem 0.1rem 0.55rem; border-bottom:1px solid rgba(255,255,255,0.06); margin-bottom:0.4rem;
    }
    .popover-emoji {
      flex:1; height:40px; border-radius:12px; border:none; background:transparent;
      cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center;
      transition:background .12s, transform .12s;
    }
    .popover-emoji:hover { background:rgba(255,255,255,0.08); transform:scale(1.18); }
    /* Action pills in a wrapping row — lighter than the old list */
    .popover-actions { display:flex; flex-wrap:wrap; gap:0.32rem; padding:0 0.1rem 0.1rem; }
    .popover-btn {
      flex:1; min-width:0;
      display:inline-flex; align-items:center; justify-content:center; gap:0.4rem;
      border:1px solid rgba(255,255,255,0.08); border-radius:12px;
      background:rgba(255,255,255,0.04); color:var(--fg-2);
      padding:0.62rem 0.6rem; cursor:pointer;
      font-family:var(--mono); font-size:0.67rem; letter-spacing:0.04em; text-transform:uppercase;
      transition:background .13s,border-color .13s,color .13s,transform .1s;
      white-space:nowrap;
    }
    .popover-btn:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.14); color:var(--fg); transform:translateY(-1px); }
    .popover-btn.danger { border-color:rgba(255,117,117,0.18); color:rgba(255,117,117,0.8); }
    .popover-btn.danger:hover { background:rgba(255,117,117,0.1); border-color:rgba(255,117,117,0.35); color:#ffd9d9; transform:translateY(-1px); }
    .popover-btn-icon { font-size:0.9rem; }
    .popover-btn-label { font-family:var(--mono); font-size:0.67rem; letter-spacing:0.04em; text-transform:uppercase; }

    /* ── Mobile sidebar drawer ── */
    .drawer-backdrop {
      display:none; position:fixed; inset:0;
      /* Transparent — the sidebar slides in without darkening the rest.
         Feels native, matches the header's dark surface colour. */
      background: transparent;
      z-index:59;
    }
    .drawer-backdrop.active { display:block; }

    .mobile-sidebar {
      display:none; position:fixed; top:var(--header-h); left:0; bottom:0;
      width:min(90vw,360px); border-right:1px solid var(--border); z-index:60;
      transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow);
    }
    .mobile-sidebar.active { transform:translateX(0); }

    /* ── Modal ── */
    .modal { position:fixed; inset:0; z-index:110; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.78); padding:1rem; }
    .modal.active { display:flex; }
    .modal-content { width:min(440px,100%); background:linear-gradient(to bottom,#1b1b1b,#151515); border:1px solid var(--border); border-radius:20px; padding:1.4rem; box-shadow:var(--shadow); }
    .modal-title { margin:0 0 0.55rem; font-family:var(--mono); font-size:0.84rem; color:var(--blue); text-transform:uppercase; letter-spacing:0.08em; }
    .modal-copy { margin:0 0 1rem; color:var(--muted); line-height:1.5; font-size:1rem; }
    .modal-input { width:100%; border:1px solid var(--border); background:var(--surface); color:var(--fg); border-radius:14px; padding:0.8rem 0.95rem; outline:none; margin-bottom:0.85rem; transition:border-color .16s,background .16s; }
    .modal-input:focus { border-color:rgba(97,215,207,0.55); background:var(--surface-2); }
    .modal-input::placeholder { color:var(--soft); }
    .modal-actions { display:flex; flex-wrap:wrap; gap:0.7rem; margin-top:0.15rem; }
    .modal-btn { border-radius:999px; min-height:44px; padding:0.74rem 1rem; border:1px solid var(--border); background:transparent; color:var(--fg-2); cursor:pointer; font-family:var(--mono); font-size:0.74rem; letter-spacing:0.06em; text-transform:uppercase; transition:background .16s,border-color .16s,color .16s; }
    .modal-btn:hover { background:rgba(255,255,255,0.04); border-color:#474747; color:var(--fg); }
    .modal-btn.primary { background:var(--blue-soft); border-color:rgba(97,215,207,0.32); color:var(--blue); }
    .modal-btn.primary:hover { background:rgba(97,215,207,0.18); border-color:rgba(97,215,207,0.58); color:#a5f1ec; }
    .modal-error { min-height:1rem; margin-top:0.8rem; color:var(--red); font-family:var(--mono); font-size:0.72rem; }

    /* ── Responsive ── */
    @media (max-width: 960px) {
      .app-body { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .mobile-inbox-btn { display: inline-flex; }
      .mobile-sidebar { display: flex; }
      .shell-header { grid-template-columns: auto 1fr auto; }
      .logo { display: none; }
    }

    @media (max-width: 700px) {
      .shell-header { gap: 0.55rem; }
      .header-room-title { font-size: 0.98rem; }
      .header-room-subtitle { font-size: 0.6rem; max-width: 180px; }
      .back-btn { min-width: 42px; padding: 0 0.82rem; font-size: 0.72rem; }
      .message-list { padding: 0.85rem 0.78rem; gap: 0.78rem; }
      .message-row { gap: 0.5rem; }
      .message-avatar { width: 32px; height: 32px; }
      .message-bubble { border-radius: 14px; padding: 0.58rem 0.78rem 0.54rem; }
      .chat-main.is-private .message-stack { max-width: 84%; }
      .chat-main.is-private .message-bubble { border-radius: 18px; }
      .message-name { font-size: 0.92rem; }
      .message-time { font-size: 0.68rem; }
      .message-text { font-size: 0.97rem; line-height: 1.5; }
      .message-status { font-size: 0.62rem; }
      .composer-inner { padding: 0.72rem 0.75rem; }
      .helper-line { display: none; }
      /*
        On mobile, font-size must be ≥16px to prevent iOS from
        auto-zooming the page when the textarea is tapped.
        Auto-zoom is a major cause of the "keyboard bounce" feeling.
      */
      .message-input { min-height: 48px; font-size: 16px; padding: 0.8rem 0.85rem; }
      .send-btn { width: 48px; min-width: 48px; height: 48px; padding: 0; border-radius: 50%; }
      .send-btn .send-label { display: none; }
      .reaction-chip { min-height: 26px; font-size: 0.78rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header id="shellHeader" class="shell-header mode-public">

      if(s<86400) return Math.floor(s/3600)+'h ago';
      const d=Math.floor(s/86400);
      if(d===1) return 'yesterday'; if(d<7) return d+'d ago';
      return dateFmt.format(new Date(iso));
    }
    const msgTime = iso => iso ? timeFmt.format(new Date(iso))+' · '+relTime(iso) : '';
    const sideTime = iso => iso ? relTime(iso) : '';
    const dayKey = iso => { const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
    const sameDay = (a,b) => !!a&&!!b&&dayKey(a)===dayKey(b);
    const convoKey = (type,rid) => type==='public'?'public':'dm:'+rid;
    const curConvoKey = () => convoKey(state.convo.type,state.convo.recipientId);

    const isNearBottom = () => (el.msgList.scrollHeight-el.msgList.scrollTop-el.msgList.clientHeight)<NEAR_BOTTOM;

    function scrollBottom(force=false,smooth=false){
      if(!force&&!state.stickBottom) return;
      el.msgList.scrollTo({top:el.msgList.scrollHeight,behavior:smooth?'smooth':'auto'});
    }

    function scrollToMessage(mid){
      const row=state.rowEls.get(mid); if(!row) return;
      row.scrollIntoView({behavior:'smooth',block:'center'});
      row.classList.remove('jump-highlight');
      void row.offsetWidth;
      row.classList.add('jump-highlight');
      setTimeout(()=>row.classList.remove('jump-highlight'),1200);
    }

    function openSidebar(){
      state.sideOpen=true;
      el.mobSide.classList.add('active'); el.mobSide.setAttribute('aria-hidden','false');
      el.backdrop.hidden=false;
      requestAnimationFrame(()=>el.backdrop.classList.add('active'));
    }
    function closeSidebar(){
      state.sideOpen=false;
      el.mobSide.classList.remove('active'); el.mobSide.setAttribute('aria-hidden','true');
      el.backdrop.classList.remove('active');
      setTimeout(()=>{ if(!state.sideOpen) el.backdrop.hidden=true; },180);
    }

    const setStatus = (msg='',type='') => { el.status.textContent=msg; el.status.className='composer-status'+(type?' '+type:''); };

    function showModal(prefill=''){
      state.modalOpen=true; el.nameErr.textContent='';
      el.gname.value=prefill||state.user.name||'';
      el.modal.classList.add('active'); el.modal.setAttribute('aria-hidden','false');
      if(!isTouch()) requestAnimationFrame(()=>{ el.gname.focus(); el.gname.select(); });
    }
    function hideModal(){ state.modalOpen=false; el.modal.classList.remove('active'); el.modal.setAttribute('aria-hidden','true'); }

    function setReply(msg){
      if(!msg){ state.replyTo=null; el.replyBar.classList.remove('active'); el.replyName.textContent=''; el.replyText.textContent=''; updateInputPlaceholder(); return; }
      haptic(6);
      state.replyTo={id:msg.id, senderName:normName(msg.sender_name||msg.name||'Unknown'), body:msg.is_deleted?'Message deleted':(msg.body||'')};
      el.replyName.textContent='↩ '+state.replyTo.senderName;
      el.replyText.textContent=state.replyTo.body.slice(0,140);
      el.replyBar.classList.add('active');
      updateInputPlaceholder();
      el.input.focus();
    }

    function ensureContact(uid,name){
      if(!uid||uid===state.user.id) return null;
      if(!state.contacts.has(uid)) state.contacts.set(uid,{userId:uid,name:normName(name)||'Unknown',lastMessageAt:null,lastPreview:'',unreadCount:0,online:false,lastSeenAt:null,typing:false,typingTimer:null});
      else if(name){ const c=state.contacts.get(uid); if(!c.name||c.name==='Unknown') c.name=normName(name)||'Unknown'; }
      return state.contacts.get(uid);
    }
    const curContact = () => state.convo.type==='private'?state.contacts.get(state.convo.recipientId)||null:null;

    function updateContactFromMsg(msg){
      if(!msg||msg._convoType!=='private') return;
      const oid=msg.sender_id===state.user.id?msg.recipient_id:msg.sender_id;
      const oname=normName(msg.sender_id===state.user.id?msg.recipient_name:msg.sender_name)||'Unknown';
      const c=ensureContact(oid,oname); if(!c) return;
      c.lastMessageAt=msg.created_at;
      c.lastPreview=msg.is_deleted?'Message deleted':(msg.body||'');
    }

    const isOnline=uid=>{const e=state.presMap.get(uid);return!!e?.last_seen_at&&(Date.now()-new Date(e.last_seen_at).getTime())<PRESENCE_EXPIRE;};

    // Short haptic pulse — silently ignored on desktop/unsupported browsers
    const haptic=(ms=8)=>{ try{ navigator.vibrate?.(ms); }catch{} };

    function refreshPresence(){
      let changed=false;
      state.contacts.forEach(c=>{
        const online=isOnline(c.userId);
        const e=state.presMap.get(c.userId);
        const seenAt=e?.last_seen_at||c.lastSeenAt||null;
        if(c.online!==online||c.lastSeenAt!==seenAt){c.online=online;c.lastSeenAt=seenAt;changed=true;}
      });
      if(changed){renderContacts();updateHeader();}
    }

    async function pingPresence(){
      if(!state.user.name) return;
      await sb.from('chat_presence').upsert({user_id:state.user.id,user_name:state.user.name,last_seen_at:nowIso()},{onConflict:'user_id'}).catch(()=>{});
    }
    function maybePingPresence(force=false){
      const n=Date.now();
      if(!force&&n-state.lastActivityPingAt<ACTIVITY_PING_THROTTLE) return;
      state.lastActivityPingAt=n; pingPresence();
    }

    async function publishTyping(){
      if(state.convo.type!=='private'||!state.convo.recipientId||!state.user.name||!state.subs.typing) return;
      if(Date.now()-state.lastTypingAt<TYPING_THROTTLE) return;
      state.lastTypingAt=Date.now();
      await state.subs.typing.send({type:'broadcast',event:'typing',payload:{user_id:state.user.id,user_name:state.user.name,room_key:dmKey(state.user.id,state.convo.recipientId),last_typed_at:nowIso()}}).catch(()=>{});
    }

    function updateContactTyping(uid,uname,shouldType){
      const c=ensureContact(uid,uname); if(!c) return false;
      const before=c.typing; c.typing=shouldType;
      if(c.typingTimer){clearTimeout(c.typingTimer);c.typingTimer=null;}
      if(shouldType) c.typingTimer=setTimeout(()=>{const cc=state.contacts.get(uid);if(!cc||!cc.typing)return;cc.typing=false;cc.typingTimer=null;renderContacts();updateHeader();renderTypingRow();},TYPING_EXPIRE);
      return before!==c.typing;
    }
    function handleTypingEvent(row){
      if(!row||row.user_id===state.user.id) return;
      if(row.room_key!==dmKey(state.user.id,row.user_id)) return;
      const changed=updateContactTyping(row.user_id,row.user_name,true);
      if(changed){renderContacts();updateHeader();renderTypingRow();}
    }

    const getPubMsgs=()=>state.pubOrder.map(id=>state.pubMap.get(id)).filter(Boolean);
    const getPrivMap=uid=>{if(!state.privMaps.has(uid))state.privMaps.set(uid,new Map());return state.privMaps.get(uid);};
    const getPrivOrder=uid=>{if(!state.privOrders.has(uid))state.privOrders.set(uid,[]);return state.privOrders.get(uid);};
    const getPrivMsgs=uid=>getPrivOrder(uid).map(id=>getPrivMap(uid).get(id)).filter(Boolean);
    const curMsgs=()=>state.convo.type==='public'?getPubMsgs():getPrivMsgs(state.convo.recipientId);

    function storeMsg(ctype,rid,msg){
      msg.id=String(msg.id); msg._convoType=ctype; msg._recipientId=rid;
      if(ctype==='public'){
        if(!state.pubMap.has(msg.id)){state.pubMap.set(msg.id,msg);state.pubOrder.push(msg.id);state.pubOrder.sort((a,b)=>sortByDate(state.pubMap.get(a),state.pubMap.get(b)));}
        else Object.assign(state.pubMap.get(msg.id),msg);
      } else {
        const map=getPrivMap(rid),order=getPrivOrder(rid);
        if(!map.has(msg.id)){map.set(msg.id,msg);order.push(msg.id);order.sort((a,b)=>sortByDate(map.get(a),map.get(b)));}
        else Object.assign(map.get(msg.id),msg);
      }
      const stored=ctype==='public'?state.pubMap.get(msg.id):getPrivMap(rid).get(msg.id);
      state.messageIndex.set(msg.id,{convoKey:convoKey(ctype,rid),message:stored});
      updateContactFromMsg(stored);
      return stored;
    }

    function delMsgFromStore(ctype,rid,id){
      state.rowEls.delete(id);state.messageIndex.delete(id);state.reactions.delete(id);
      if(ctype==='public'){state.pubMap.delete(id);state.pubOrder=state.pubOrder.filter(x=>x!==id);return;}
      const map=getPrivMap(rid),order=getPrivOrder(rid);
      map.delete(id);state.privOrders.set(rid,order.filter(x=>x!==id));
    }

    const findMsgAnywhere=id=>state.messageIndex.get(id)?.message||null;
    const curMsgById=id=>state.convo.type==='public'?state.pubMap.get(id)||null:getPrivMap(state.convo.recipientId).get(id)||null;

    function replaceMsgId(ctype,rid,oldId,newMsg){
      const map=ctype==='public'?state.pubMap:getPrivMap(rid);
      const order=ctype==='public'?state.pubOrder:getPrivOrder(rid);
      const idx=order.indexOf(oldId);if(idx===-1) return newMsg;
      const row=state.rowEls.get(oldId);
      map.delete(oldId);state.messageIndex.delete(oldId);state.rowEls.delete(oldId);
      newMsg._convoType=ctype;newMsg._recipientId=rid;
      map.set(newMsg.id,newMsg);order[idx]=newMsg.id;
      state.messageIndex.set(newMsg.id,{convoKey:convoKey(ctype,rid),message:newMsg});
      if(row){row.dataset.mid=newMsg.id;state.rowEls.set(newMsg.id,row);}
      return newMsg;
    }

    const ensureReactBucket=mid=>{if(!state.reactions.has(mid))state.reactions.set(mid,new Map());return state.reactions.get(mid);};
    function applyReactInsert(mid,emoji,uid){const b=ensureReactBucket(mid);if(!b.has(emoji))b.set(emoji,new Set());b.get(emoji).add(uid);}
    function applyReactDelete(mid,emoji,uid){const b=state.reactions.get(mid);if(!b?.has(emoji))return;b.get(emoji).delete(uid);if(!b.get(emoji).size)b.delete(emoji);if(!b.size)state.reactions.delete(mid);}

    function reactionHtml(mid){
      const b=state.reactions.get(mid); if(!b||!b.size) return '';
      return [...b.entries()].filter(([,u])=>u.size>0).map(([emoji,users])=>{
        const mine=users.has(state.user.id);
        return `<button class="reaction-chip${mine?' mine':''}" type="button" data-reaction-chip="1" data-mid="${esc(mid)}" data-emoji="${esc(emoji)}" aria-label="React ${esc(emoji)} ${users.size}">${esc(emoji)}<span class="count">${users.size}</span></button>`;
      }).join('');
    }

    function msgStatusInfo(msg){
      if(msg._convoType!=='private'||msg.sender_id!==state.user.id) return null;
      if(msg._failed) return{label:'did not send',cls:'failed'};
      if(msg.seen_at) return{label:'seen',cls:'seen'};
      if(msg._optimistic) return null;
      return{label:'delivered',cls:'delivered'};
    }

    function replyStubHtml(msg){
      if(!msg.reply_to_id) return '';
      const orig=findMsgAnywhere(msg.reply_to_id);
      const sname=orig?normName(orig.sender_name||orig.name||'Unknown'):'…';
      const text=orig?(orig.is_deleted?'Message deleted':(orig.body||'')):'Original not found';
      return `<div class="reply-stub" data-scroll-to="${esc(msg.reply_to_id)}" role="button" tabindex="0"><div class="reply-stub-line"></div><div class="reply-stub-main"><div class="reply-stub-name">${esc(sname)}</div><div class="reply-stub-text">${esc(text.slice(0,120))}</div></div></div>`;
    }

    function statusHtml(msg){
      const st=msgStatusInfo(msg); if(!st) return '<div class="message-status hidden-status"></div>';
      return `<div class="message-status ${esc(st.cls)}"><span>${esc(st.label)}</span></div>`;
    }

    // ── Message grouping ───────────────────────────────────────────────────────
    // Two consecutive messages from the same sender within 2 minutes = grouped.
    const GROUP_WINDOW = 2 * 60 * 1000;

    function isSameGroup(a, b){
      if (!a || !b) return false;
      if (a.sender_id !== b.sender_id) return false;
      if (!sameDay(a.created_at, b.created_at)) return false;
      return Math.abs(new Date(b.created_at).getTime() - new Date(a.created_at).getTime()) < GROUP_WINDOW;
    }

    function reapplyAllGroupClasses(){
      const msgs = curMsgs();
      msgs.forEach((msg, i) => {
        const row = state.rowEls.get(msg.id); if (!row) return;
        const p = i > 0 ? msgs[i-1] : null;
        const n = i < msgs.length-1 ? msgs[i+1] : null;
        row.classList.remove('msg-group-mid','msg-group-last');
        if (isSameGroup(p,msg) && isSameGroup(msg,n)) row.classList.add('msg-group-mid');
        else if (isSameGroup(p,msg))                    row.classList.add('msg-group-last');
      });
    }

    // Targeted version — only patches the row at idx and its two neighbours.
    // Used when inserting a single new row to avoid reflowing the whole list.
    function patchGroupClasses(idx, msgs){
      const targets = [idx-1, idx, idx+1].filter(i => i >= 0 && i < msgs.length);
      targets.forEach(i => {
        const msg = msgs[i];
        const row = state.rowEls.get(msg.id); if (!row) return;
        const p = i > 0 ? msgs[i-1] : null;
        const n = i < msgs.length-1 ? msgs[i+1] : null;
        row.classList.remove('msg-group-mid','msg-group-last');
        if (isSameGroup(p,msg) && isSameGroup(msg,n)) row.classList.add('msg-group-mid');
        else if (isSameGroup(p,msg))                    row.classList.add('msg-group-last');
      });
    }

    function buildRow(msg){
      const own=msg.sender_id===state.user.id;
      const name=normName(msg.sender_name||msg.name||'Unknown');
      const row=document.createElement('div');
      row.className='message-row'+(own?' own':'')+(msg._failed?' failed':'');
      row.dataset.mid=msg.id; row.dataset.own=own?'1':'0';
      row.innerHTML=`
        <div class="message-avatar">${esc(initial(name))}</div>
        <div class="message-stack">
          <div class="message-bubble" data-bubble-mid="${esc(msg.id)}" data-uid="${esc(msg.sender_id||'')}" data-name="${esc(name)}" tabindex="0">
            ${replyStubHtml(msg)}
            <div class="message-header"><span class="message-name">${esc(name)}</span><div class="message-time">${esc(msgTime(msg.created_at))}</div></div>
            <div class="message-body-wrap">${msg.is_deleted?'<div class="message-text deleted">This message was deleted.</div>':`<div class="message-text">${esc(msg.body||'')}</div>`}</div>
          </div>
          ${statusHtml(msg)}
          <div class="reactions" data-reactions="${esc(msg.id)}">${reactionHtml(msg.id)}</div>
        </div>`;
      state.rowEls.set(msg.id,row);
      return row;
    }

    function patchRow(msg){
      const row=state.rowEls.get(msg.id); if(!row) return;
      const own=msg.sender_id===state.user.id;
      row.classList.toggle('own',own); row.classList.toggle('failed',!!msg._failed);
      row.dataset.own=own?'1':'0'; row.dataset.mid=msg.id;
      const bubble=row.querySelector('.message-bubble');
      const name=normName(msg.sender_name||msg.name||'Unknown');
      bubble.dataset.bubbleMid=msg.id; bubble.dataset.uid=msg.sender_id||''; bubble.dataset.name=name;
      const av=row.querySelector('.message-avatar'); if(av) av.textContent=initial(name);
      const nm=row.querySelector('.message-name'); if(nm&&nm.textContent!==name) nm.textContent=name;
      const tm=row.querySelector('.message-time'); const nt=msgTime(msg.created_at); if(tm&&tm.textContent!==nt) tm.textContent=nt;
      // Reply stub
      const oldR=bubble.querySelector('.reply-stub'); const newR=replyStubHtml(msg);
      if(newR&&!oldR){bubble.insertAdjacentHTML('afterbegin',newR);}
      else if(!newR&&oldR){oldR.remove();}
      else if(newR&&oldR){const t=document.createElement('div');t.innerHTML=newR.trim();oldR.replaceWith(t.firstElementChild);}
      // Body
      const bw=row.querySelector('.message-body-wrap');
      if(bw){const h=msg.is_deleted?'<div class="message-text deleted">This message was deleted.</div>':`<div class="message-text">${esc(msg.body||'')}</div>`;if(bw.innerHTML!==h)bw.innerHTML=h;}
      // Status
      const se=row.querySelector('.message-status');
      if(se){const t=document.createElement('div');t.innerHTML=statusHtml(msg).trim();se.replaceWith(t.firstElementChild);}
      patchReactRow(msg.id);
    }

    function patchReactRow(mid){
      const c=el.msgList.querySelector(`[data-reactions="${cssEscape(mid)}"]`); if(!c) return;
      c.innerHTML=reactionHtml(mid);
    }

    function renderEmptyState(){
      el.msgList.innerHTML=state.convo.type==='private'
        ?`<div class="system-row"><div class="system-card"><div class="empty-icon">💬</div><div class="empty-title">No messages yet</div><div class="empty-hint">Start the private conversation. Only the two of you can see this.</div></div></div>`
        :`<div class="system-row"><div class="system-card"><div class="empty-icon">🌍</div><div class="empty-title">Public room is quiet</div><div class="empty-hint">Say something — or open a message menu to react, reply, or start a private conversation.</div></div></div>`;
    }

    function rebuildConvo(){
      closePopover(); state.rowEls.clear(); state.dividerEls.clear(); el.msgList.innerHTML='';
      const msgs=curMsgs();
      if(!msgs.length){renderEmptyState();renderTypingRow();return;}
      const frag=document.createDocumentFragment(); let prev=null; const ck=curConvoKey();
      msgs.forEach(msg=>{
        if(!prev||!sameDay(prev.created_at,msg.created_at)){
          const dk=ck+'|'+dayKey(msg.created_at);
          const d=document.createElement('div');d.className='day-divider';d.textContent=dateFmt.format(new Date(msg.created_at));
          state.dividerEls.set(dk,d);frag.appendChild(d);
        }
        frag.appendChild(buildRow(msg));prev=msg;
      });
      el.msgList.appendChild(frag);
      reapplyAllGroupClasses();
      renderTypingRow();scrollBottom(true,false);
      // Mark seen immediately when conversation opens (not just on scroll)
      if(state.convo.type==='private'&&state.convo.recipientId) scheduleMarkSeen(state.convo.recipientId);
      updateUnreadPill();
    }

    function renderTypingRow(){
      const existing=$('typingRow'); const c=curContact();
      const desiredId=(state.convo.type==='private'&&c?.typing)?c.userId:'';
      if(!desiredId){if(existing)existing.remove();state.lastRenderedTypingId='';return;}
      if(existing&&state.lastRenderedTypingId===desiredId) return;
      if(existing) existing.remove();
      const row=document.createElement('div');row.className='typing-row';row.id='typingRow';
      row.innerHTML=`<div class="typing-bubble"><span class="typing-label">${esc(c.name)}</span><span class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></span></div>`;
      el.msgList.appendChild(row);state.lastRenderedTypingId=desiredId;scrollBottom(false,true);
    }

    function maybeInsertRow(msg){
      if(msg._convoType!==state.convo.type) return false;
      if(msg._convoType==='private'&&msg._recipientId!==state.convo.recipientId) return false;
      const msgs=curMsgs(); const idx=msgs.findIndex(m=>m.id===msg.id); if(idx===-1) return false;
      const empty=el.msgList.querySelector('.system-row'); if(empty) empty.remove();
      const beforeMsg=idx>0?msgs[idx-1]:null; const afterMsg=idx<msgs.length-1?msgs[idx+1]:null;
      const ck=curConvoKey(); const dk=ck+'|'+dayKey(msg.created_at);
      let divider=state.dividerEls.get(dk);
      if((!beforeMsg||!sameDay(beforeMsg.created_at,msg.created_at))&&!divider){
        divider=document.createElement('div');divider.className='day-divider';divider.textContent=dateFmt.format(new Date(msg.created_at));state.dividerEls.set(dk,divider);
      }
      const row=buildRow(msg); const beforeRow=afterMsg?state.rowEls.get(afterMsg.id):null;
      if(beforeRow){if(divider&&!divider.isConnected)el.msgList.insertBefore(divider,beforeRow);el.msgList.insertBefore(row,beforeRow);}
      else{const tr=$('typingRow');if(divider&&!divider.isConnected){if(tr)el.msgList.insertBefore(divider,tr);else el.msgList.appendChild(divider);}if(tr)el.msgList.insertBefore(row,tr);else el.msgList.appendChild(row);}
      // Only update group classes on the new row and its immediate neighbours.
      // Calling reapplyAllGroupClasses() would toggle margin-top on every existing
      // row, causing the whole list to reflow and visually shift.
      patchGroupClasses(idx, msgs);
      return true;
    }

    function removeRow(mid){
      const row=state.rowEls.get(mid); if(!row) return;
      closePopover();
      const prev=row.previousElementSibling,next=row.nextElementSibling;
      row.remove();state.rowEls.delete(mid);
      if(prev?.classList.contains('day-divider')&&(!next||next.classList.contains('day-divider')||next.id==='typingRow'))prev.remove();
      if(!el.msgList.querySelector('.message-row')){renderEmptyState();renderTypingRow();}
    }

    function renderContacts(){
      const term=state.searchTerm.toLowerCase();
      const list=[...state.contacts.values()]
        .filter(c=>c.userId!==state.user.id&&(!term||c.name.toLowerCase().includes(term)))
        .sort((a,b)=>(b.lastMessageAt?new Date(b.lastMessageAt):0)-(a.lastMessageAt?new Date(a.lastMessageAt):0));
      const html=list.length?list.map(c=>{
        const active=state.convo.type==='private'&&state.convo.recipientId===c.userId;
        const badge=c.unreadCount>0?`<span class="unread-badge">${c.unreadCount>99?'99+':c.unreadCount}</span>`:'';
        const lastMsg=getPrivMsgs(c.userId).slice(-1)[0];
        const mine=!!lastMsg&&lastMsg.sender_id===state.user.id&&!c.typing;
        const preview=c.typing?'typing…':(c.lastPreview||'');
        const full=mine?'You: '+preview:preview;
        return `<button class="user-item${active?' active':''}" type="button" data-user-item="1" data-uid="${esc(c.userId)}" data-name="${esc(c.name)}">
          <div class="user-avatar-wrap"><div class="user-avatar">${esc(initial(c.name))}</div><span class="presence-dot${c.online?' online':''}"></span></div>
          <div class="sidebar-user-main">
            <div class="sidebar-user-top"><span class="sidebar-user-name">${esc(c.name)}</span><span class="sidebar-user-time">${esc(c.online?'online':sideTime(c.lastMessageAt||c.lastSeenAt))}</span></div>
            <span class="sidebar-user-sub${c.unreadCount>0?' has-unread':''}${c.typing?' is-typing':''}">${esc(full.slice(0,52))}</span>
          </div>${badge}
        </button>`;
      }).join(''):`<div class="system-card" style="border-radius:14px;font-size:0.8rem">No private conversations yet.<br/>Open a message menu to start one.</div>`;
      el.userList.innerHTML=html; el.mobList.innerHTML=html;
      el.inboxBtn.classList.toggle('has-unread',[...state.contacts.values()].some(c=>c.unreadCount>0));
      const n=[...state.contacts.values()].filter(c=>c.online).length;
      const label=n?n+' online':'';
      el.deskPres.textContent=label; el.mobPres.textContent=label;
    }

    function updateHeader(){
      const priv=state.convo.type==='private'; const c=curContact();
      const key=priv?'p|'+(c?.name||'')+'|'+(c?.typing?'1':'0')+'|'+(c?.online?'1':'0')+'|'+(c?.lastSeenAt||''):'public';
      if(key===state.lastHeaderKey) return; state.lastHeaderKey=key;
      el.backBtn.classList.toggle('hidden',!priv);
      el.chatMain.classList.toggle('is-private',priv);
      el.chatMain.classList.toggle('is-public',!priv);
      el.chatMain.dataset.roomLabel = priv ? 'Private' : 'Public';
      el.header.classList.toggle('mode-public',!priv); el.header.classList.toggle('mode-private',priv);
      if(!priv){el.title.textContent='Public room';el.sub.textContent='Everyone can read this room';el.sub.classList.remove('typing');return;}
      el.title.textContent=c?.name||'Private conversation';
      if(c?.typing){el.sub.textContent=c.name+' is typing…';el.sub.classList.add('typing');return;}
      el.sub.classList.remove('typing');
      el.sub.textContent=c?.online?'online now':c?.lastSeenAt?'last seen '+relTime(c.lastSeenAt):'private conversation';
    }

    function closePopover(){
      if(!state.activePopover) return;
      const row=state.rowEls.get(state.activePopover.mid);
      if(row){const b=row.querySelector('.message-bubble');if(b)b.classList.remove('menu-open');}
      state.activePopover.el.remove();state.activePopover=null;state.pendingDelete=null;
    }

    function buildPopoverActions(msg){
      const own=msg.sender_id===state.user.id; const isPriv=msg._convoType==='private';
      const items=[{action:'reply',icon:'↩',label:'Reply'}];
      if(!own&&!isPriv) items.push({action:'dm',icon:'💬',label:'Message privately'});
      if(own&&!msg.is_deleted&&!msg._optimistic){
        // Two-step: first press → confirm state; second press → actual delete
        if(state.pendingDelete===msg.id){
          items.push({action:'delete-confirm',icon:'🗑',label:'Yes, delete it',danger:true});
          items.push({action:'delete-cancel',icon:'✕',label:'Cancel'});
        } else {
          items.push({action:'delete-ask',icon:'🗑',label:'Delete',danger:false});
        }
      }
      if(msg._failed) items.push({action:'retry',icon:'⟳',label:'Retry send'});
      return items;
    }

    function openPopover(msg,anchorEl){
      closePopover();
      haptic(8);
      const row=state.rowEls.get(msg.id);
      if(row){const b=row.querySelector('.message-bubble');if(b)b.classList.add('menu-open');}
      const pop=document.createElement('div');
      pop.className='message-popover'; pop.dataset.mid=msg.id;
      pop.innerHTML=`<div class="popover-reactions">${REACTIONS.map(e=>`<button class="popover-emoji" type="button" data-popover-react="${esc(e)}" aria-label="React ${esc(e)}">${esc(e)}</button>`).join('')}</div>
        <div class="popover-actions">${buildPopoverActions(msg).map(it=>`<button class="popover-btn${it.danger?' danger':''}" type="button" data-popover-action="${esc(it.action)}" data-mid="${esc(msg.id)}"><span class="popover-btn-icon">${esc(it.icon)}</span><span class="popover-btn-label">${esc(it.label)}</span></button>`).join('')}</div>`;
      document.body.appendChild(pop);
      // Position
      const rect=anchorEl.getBoundingClientRect(); const pr=pop.getBoundingClientRect();
      let left=rect.left,top=rect.bottom+8;
      if(left+pr.width>window.innerWidth-10) left=window.innerWidth-pr.width-10;
      if(left<10) left=10;
      if(top+pr.height>window.innerHeight-10) top=rect.top-pr.height-8;
      if(top<10) top=10;
      pop.style.left=left+'px'; pop.style.top=top+'px';
      state.activePopover={mid:msg.id,el:pop};
    }

    async function loadReactions(ids){
      if(!ids.length) return;
      const{data,error}=await sb.from('message_reactions').select('*').in('message_id',ids);
      if(error){console.error(error);return;}
      ids.forEach(id=>state.reactions.delete(id));
      (data||[]).forEach(r=>applyReactInsert(String(r.message_id),r.emoji,r.user_id));
    }

    const normPub=r=>({...r,id:String(r.id),sender_id:r.user_id||r.sender_id||'',sender_name:normName(r.name||r.sender_name||'Unknown'),_optimistic:false,_failed:false});
    const normPriv=r=>({...r,id:String(r.id),sender_name:normName(r.sender_name||'Unknown'),recipient_name:normName(r.recipient_name||'Unknown'),_optimistic:false,_failed:false});

    async function loadPublic(){
      const{data,error}=await sb.from('messages').select('*').eq('room',PUB_ROOM).order('created_at',{ascending:true}).limit(200);
      if(error){console.error(error);return;}
      state.pubMap.clear();state.pubOrder=[];
      (data||[]).forEach(r=>storeMsg('public',null,normPub(r)));
      await loadReactions(state.pubOrder);

    async function loadPrivate(){
      const{data,error}=await sb.from('private_messages').select('*').or(`sender_id.eq.${state.user.id},recipient_id.eq.${state.user.id}`).order('created_at',{ascending:true}).limit(500);
      if(error){console.error(error);return;}
      state.privMaps.clear();state.privOrders.clear();state.contacts.clear();
      (data||[]).forEach(r=>{const m=normPriv(r);const oid=m.sender_id===state.user.id?m.recipient_id:m.sender_id;storeMsg('private',oid,m);});

    function subscribePub(){
      if(state.subs.pub) sb.removeChannel(state.subs.pub);
      state.subs.pub=sb.channel('pub:'+PUB_ROOM)
        .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room=eq.'+PUB_ROOM},payload=>{
          const row=normPub(payload.new); if(state.pubMap.has(row.id)) return;
          const wasNear=isNearBottom(); const msg=storeMsg('public',null,row);
          maybeInsertRow(msg);
          if(state.convo.type==='public'&&(wasNear||msg.sender_id===state.user.id)) scrollBottom(true,true);
        })
        .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},payload=>{
          const row=normPub(payload.new);
          if(!state.pubMap.has(row.id)){maybeInsertRow(storeMsg('public',null,row));return;}
          Object.assign(state.pubMap.get(row.id),row);patchRow(state.pubMap.get(row.id));
        })
        .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},payload=>{
          const id=String(payload.old?.id||''); if(!id||!state.pubMap.has(id)) return;
          delMsgFromStore('public',null,id); if(state.convo.type==='public') removeRow(id);
        })
        .subscribe();
    }

    function mergeIncomingPriv(row){
      const msg=normPriv(row); const oid=msg.sender_id===state.user.id?msg.recipient_id:msg.sender_id;
      const map=getPrivMap(oid); const order=getPrivOrder(oid);
      let final=null;
      if(msg.client_id){
        const optId=[...order].find(mid=>{const x=map.get(mid);return x&&x.client_id===msg.client_id;});
        if(optId&&map.has(optId)) final=replaceMsgId('private',oid,optId,msg);
      }
      if(!final){final=storeMsg('private',oid,msg);}
      else updateContactFromMsg(final);
      return{oid,msg:final};
    }

    function subscribePriv(){
      if(state.subs.privIns) sb.removeChannel(state.subs.privIns);
      if(state.subs.privUpd) sb.removeChannel(state.subs.privUpd);
      state.subs.privIns=sb.channel('privIns:'+state.user.id)
        .on('postgres_changes',{event:'INSERT',schema:'public',table:'private_messages'},payload=>{
          const row=payload.new;
          if(row.sender_id!==state.user.id&&row.recipient_id!==state.user.id) return;
          const wasNear=isNearBottom(); const{oid,msg}=mergeIncomingPriv(row);
          const c=ensureContact(oid,msg.sender_id===state.user.id?msg.recipient_name:msg.sender_name);
          if(msg.sender_id!==state.user.id&&!(state.convo.type==='private'&&state.convo.recipientId===oid)) if(c) c.unreadCount=(c.unreadCount||0)+1;
          if(state.convo.type==='private'&&state.convo.recipientId===oid){
            const existing=state.rowEls.get(msg.id);
            if(existing) patchRow(msg); else maybeInsertRow(msg);
            renderTypingRow();
            if(wasNear||msg.sender_id===state.user.id) scrollBottom(true,true);
            scheduleMarkSeen(oid);
          }
          renderContacts();updateHeader();
        }).subscribe();
      state.subs.privUpd=sb.channel('privUpd:'+state.user.id)
        .on('postgres_changes',{event:'UPDATE',schema:'public',table:'private_messages'},payload=>{
          const row=payload.new;
          if(row.sender_id!==state.user.id&&row.recipient_id!==state.user.id) return;
          const msg=normPriv(row); const oid=msg.sender_id===state.user.id?msg.recipient_id:msg.sender_id;
          const existing=getPrivMap(oid).get(msg.id);
          if(!existing){storeMsg('private',oid,msg);if(state.convo.type==='private'&&state.convo.recipientId===oid)maybeInsertRow(msg);}
          else{Object.assign(existing,msg);patchRow(existing);}
          updateContactFromMsg(getPrivMap(oid).get(msg.id)||msg);
          renderContacts();updateHeader();
        }).subscribe();
    }

        .on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_presence'},p=>{state.presMap.set(p.new.user_id,p.new);refreshPresence();})

        .on('postgres_changes',{event:'DELETE',schema:'public',table:'message_reactions'},payload=>{applyReactDelete(String(payload.old.message_id),payload.old.emoji,payload.old.user_id);patchReactRow(String(payload.old.message_id));})

    function scheduleMarkSeen(uid){
      if(!uid) return;
      clearTimeout(state.pendingSeenDebounce);
      state.pendingSeenDebounce=setTimeout(()=>markSeen(uid),180);
    }

    async function markSeen(uid){
      if(!uid||document.hidden) return;
      if(state.convo.type!=='private'||state.convo.recipientId!==uid||!isNearBottom()) return;
      const unseen=getPrivMsgs(uid).filter(m=>m.sender_id===uid&&!m.seen_at&&!m.is_deleted&&!m._optimistic);
      if(!unseen.length) return;
      const sk=uid+'|'+unseen.map(m=>m.id).join(',');
      if(sk===state.lastSeenKey) return; state.lastSeenKey=sk;
      const seenAt=nowIso(); const ids=unseen.map(m=>m.id);
      const{error}=await sb.from('private_messages').update({seen_at:seenAt}).in('id',ids);
      if(error){console.error(error);state.lastSeenKey='';return;}
      unseen.forEach(m=>{m.seen_at=seenAt;patchRow(m);});
      const c=state.contacts.get(uid); if(c) c.unreadCount=0;
      renderContacts();
    }

      const b=ensureReactBucket(mid); const users=b.get(emoji)||new Set(); const hasMine=users.has(state.user.id);
      if(hasMine){applyReactDelete(mid,emoji,state.user.id);patchReactRow(mid);await sb.from('message_reactions').delete().match({message_id:mid,user_id:state.user.id,emoji}).catch(console.error);}
      else{applyReactInsert(mid,emoji,state.user.id);patchReactRow(mid);await sb.from('message_reactions').upsert({message_id:mid,user_id:state.user.id,emoji,user_name:state.user.name},{onConflict:'message_id,user_id,emoji'}).catch(console.error);}

    async function retryFailed(mid){
      const msg=curMsgById(mid); if(!msg||!msg._failed||msg._convoType!=='private') return;
      const contact=curContact(); if(!contact) return;
      const newCid='retry_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);

      const{error}=await sb.from('private_messages').insert({sender_id:state.user.id,sender_name:state.user.name,recipient_id:contact.userId,recipient_name:contact.name,body:msg.body,client_id:newCid,reply_to_id:msg.reply_to_id||null});

    async function sendMessage(){
      const body=el.input.value.trim(); if(!body) return;
      if(Date.now()-state.lastSendAt<COOLDOWN_MS){setStatus('Slow down a little.','error');return;}
      if(!state.user.name){showModal('');return;}
      const draft=el.input.value; const replyToId=state.replyTo?.id||null;
      setStatus('');setReply(null);el.input.value='';resizeTA();updateCounter();state.lastSendAt=Date.now();
      el.sendBtn.classList.remove('has-content');
      updateInputPlaceholder();
      if(state.convo.type==='public'){
        const{error}=await sb.from('messages').insert({room:PUB_ROOM,body,name:state.user.name,user_id:state.user.id,reply_to_id:replyToId||null});
        if(error){console.error(error);el.input.value=draft;resizeTA();updateCounter();setStatus('Failed to send.','error');}
        else haptic(10);
        el.input.focus();return;
      }
      const contact=curContact();
      if(!contact){el.input.value=draft;resizeTA();updateCounter();setStatus('Missing recipient.','error');return;}
      const tempId='t_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
      const opt={id:tempId,client_id:tempId,sender_id:state.user.id,sender_name:state.user.name,recipient_id:contact.userId,recipient_name:contact.name,body,created_at:nowIso(),seen_at:null,is_deleted:false,reply_to_id:replyToId||null,_optimistic:true,_failed:false};
      const wasNear=isNearBottom(); const stored=storeMsg('private',contact.userId,opt);
      maybeInsertRow(stored);renderContacts();if(wasNear) scrollBottom(true,true);
      haptic(10);
      const{error}=await sb.from('private_messages').insert({sender_id:state.user.id,sender_name:state.user.name,recipient_id:contact.userId,recipient_name:contact.name,body,client_id:tempId,reply_to_id:replyToId||null});
      if(error){console.error(error);stored._optimistic=false;stored._failed=true;patchRow(stored);setStatus('Failed to send.','error');}
      el.input.focus();
    }

    function applyConvo(type,uid,name,pushHistory){
      closePopover();setReply(null);state.lastSeenKey='';
      if(type==='private'){
        if(!uid||uid===state.user.id) return;
        ensureContact(uid,name);
        state.convo={type:'private',recipientId:uid};state.stickBottom=true;
        const c=curContact(); if(c) c.unreadCount=0;
        if(pushHistory) history.pushState({chat:'private',userId:uid,name:name||c?.name||''},'',location.href);
        localStorage.setItem(STORAGE_KEYS.convo,JSON.stringify(state.convo));
        updateHeader();renderContacts();rebuildConvo();scheduleMarkSeen(uid);
      } else {
        state.convo={type:'public',recipientId:null};state.stickBottom=true;
        if(pushHistory) history.pushState({chat:'public'},'',location.href);
        localStorage.removeItem(STORAGE_KEYS.convo);
        updateHeader();renderContacts();rebuildConvo();
      }
      closeSidebar();
    }

    async function restoreConvo(){

        if(saved?.type==='private'&&saved.recipientId&&saved.recipientId!==state.user.id&&state.contacts.has(saved.recipientId)){

    // ── Swipe-to-reply ─────────────────────────────────────────────────────────
    function bindSwipeToReply(){
      let touch={id:null,startX:0,startY:0,row:null,stack:null,own:false,triggered:false};
      const THRESHOLD=60; // px to commit reply
      const MAX_TRANSLATE=72;

      el.msgList.addEventListener('touchstart',e=>{
        if(e.touches.length!==1) return;
        const t=e.touches[0];
        const row=t.target.closest('.message-row');
        if(!row) return;
        const mid=row.querySelector('[data-bubble-mid]')?.dataset?.bubbleMid;
        const msg=mid?curMsgById(mid):null;
        if(!msg||msg.is_deleted) return;
        touch={
          id:t.identifier,
          startX:t.clientX, startY:t.clientY,
          row, stack:row.querySelector('.message-stack'),
          own:row.classList.contains('own'),
          mid, triggered:false
        };
      },{passive:true});

      el.msgList.addEventListener('touchmove',e=>{
        if(!touch.stack) return;
        const t=[...e.touches].find(x=>x.identifier===touch.id);
        if(!t) return;
        const dx=t.clientX-touch.startX;
        const dy=Math.abs(t.clientY-touch.startY);
        // Only intercept if clearly horizontal
        if(dy>Math.abs(dx)*0.8&&Math.abs(dx)<10) return;
        // Own messages swipe left (negative dx), others swipe right (positive dx)
        const relevant=touch.own?(dx<0):(dx>0);
        if(!relevant) return;
        const travel=Math.min(Math.abs(dx),MAX_TRANSLATE);
        const translateX=touch.own?-travel:travel;
        touch.stack.style.transition='none';
        touch.stack.style.transform=`translateX(${translateX}px)`;
        touch.row.classList.toggle('swiping',travel>20);
        // Add swipe arrow if not present
        if(!touch.row.querySelector('.swipe-arrow')){
          const arr=document.createElement('div');arr.className='swipe-arrow';arr.textContent='↩';
          touch.row.style.position='relative';touch.row.appendChild(arr);
        }
        if(travel>=THRESHOLD&&!touch.triggered){
          touch.triggered=true;haptic(12);
        }
      },{passive:true});

      function endSwipe(){
        if(!touch.stack) return;
        touch.stack.style.transition='transform 0.28s var(--ease)';
        touch.stack.style.transform='';
        touch.row.classList.remove('swiping');
        touch.row.querySelector('.swipe-arrow')?.remove();
        if(touch.triggered){
          const msg=curMsgById(touch.mid); if(msg) setReply(msg);
        }
        touch={id:null,startX:0,startY:0,row:null,stack:null,own:false,triggered:false};
      }

      el.msgList.addEventListener('touchend',endSwipe,{passive:true});
      el.msgList.addEventListener('touchcancel',endSwipe,{passive:true});
    }

    // ── Long-press for reaction picker (skips popover) ─────────────────────────
    function bindLongPress(){

    }

    function bindEvents(){
