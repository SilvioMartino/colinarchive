<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Chat | Colin Archive</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --paper:#171717;
      --paper-2:#141414;
      --surface:rgba(255,255,255,0.035);
      --surface-2:rgba(255,255,255,0.055);
      --surface-3:rgba(255,255,255,0.08);
      --fg:#ececec;
      --muted:#aaaaaa;
      --soft:#7f7f7f;
      --border:#2b2b2b;
      --border-soft:rgba(255,255,255,0.06);
      --red:#ff6b6b;
      --blue:#4ecdc4;
      --green:#51cf66;
      --amber:#ffc857;
      --violet:#c084fc;
      --shadow:0 18px 50px rgba(0,0,0,0.25);
      --shadow-soft:0 8px 20px rgba(0,0,0,0.18);
      --serif:'Crimson Text',Georgia,serif;
      --mono:'IBM Plex Mono','Courier New',monospace;
      --hand:'Caveat',cursive;
      --header-h:78px;
      --sidebar-w:300px;
      --ease:cubic-bezier(.22,1,.36,1);
      --composer-offset:0px;
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--paper)}
    body{
      color:var(--fg);
      font-family:var(--serif);
      display:flex;
      flex-direction:column;
      min-height:100dvh;
      overflow:hidden;
      background:
        radial-gradient(circle at top,rgba(78,205,196,0.045),transparent 28%),
        linear-gradient(to bottom,#151515,#111111);
    }

    button,input,textarea{font:inherit}
    a{color:inherit;text-decoration:none}
    .hidden{display:none!important}

    .shell-header{
      min-height:var(--header-h);
      padding:0.85rem 1rem;
      border-bottom:1px solid var(--border);
      background:rgba(23,23,23,0.94);
      backdrop-filter:blur(10px);
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);
      align-items:center;
      gap:0.9rem;
      flex-shrink:0;
      z-index:40;
    }

    .header-left{display:flex;align-items:center;gap:0.6rem;justify-self:start}
    .logo{
      font-family:var(--mono);
      font-size:0.76rem;
      letter-spacing:0.16em;
      text-transform:uppercase;
      font-weight:500;
      white-space:nowrap;
      flex-shrink:0;
    }
    .logo::after{
      content:'|';
      color:var(--red);
      margin-left:2px;
      animation:blink 1s step-end infinite;
    }
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

    .back-btn{
      display:inline-flex;
      align-items:center;
      gap:0.45rem;
      border:1px solid rgba(78,205,196,0.45);
      background:rgba(78,205,196,0.14);
      color:var(--blue);
      border-radius:999px;
      padding:0.58rem 0.95rem;
      cursor:pointer;
      font-family:var(--mono);
      font-size:0.66rem;
      letter-spacing:0.08em;
      text-transform:uppercase;
      white-space:nowrap;
      flex-shrink:0;
      transition:border-color .18s,color .18s,background .18s,transform .18s;
    }
    .back-btn:hover{
      border-color:rgba(78,205,196,0.78);
      color:#88eee5;
      background:rgba(78,205,196,0.2);
      transform:translateY(-1px);
    }

    .header-room{
      min-width:0;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:0.15rem;
      justify-self:center;
    }

    .header-room-title{
      font-family:var(--hand);
      font-size:1.16rem;
      color:var(--blue);
      line-height:1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }

    .header-room-subtitle{
      font-family:var(--mono);
      font-size:0.62rem;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:var(--soft);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
      transition:color .18s;
    }
    .header-room-subtitle.typing{color:var(--blue)}
    .header-right{display:flex;justify-content:flex-end;justify-self:end}

    .app-grid{
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns:var(--sidebar-w) minmax(0,1fr);
      overflow:hidden;
      height:calc(100dvh - var(--header-h));
    }

    .sidebar{
      min-height:0;
      border-right:1px solid var(--border);
      background:rgba(20,20,20,0.9);
      display:flex;
      flex-direction:column;
    }

    .sidebar-top{
      padding:1rem 1rem 0.8rem;
      border-bottom:1px solid var(--border);
      flex-shrink:0;
    }

    .sidebar-title-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:0.6rem;
      margin-bottom:0.75rem;
    }

    .sidebar-title,.presence-summary{
      font-family:var(--mono);
      text-transform:uppercase;
      letter-spacing:0.1em;
    }
    .sidebar-title{font-size:0.68rem;color:var(--muted)}
    .presence-summary{font-size:0.6rem;color:var(--soft)}

    .sidebar-search{
      width:100%;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--fg);
      padding:0.7rem 0.85rem;
      border-radius:999px;
      outline:none;
      font-family:var(--mono);
      font-size:0.75rem;
      transition:border-color .18s,background .18s;
    }
    .sidebar-search:focus{
      border-color:rgba(78,205,196,0.6);
      background:var(--surface-2);
    }
    .sidebar-search::placeholder{color:var(--soft)}

    .sidebar-body{
      min-height:0;
      overflow-y:auto;
      padding:0.8rem;
    }
    .sidebar-body::-webkit-scrollbar,.message-list::-webkit-scrollbar{width:4px}
    .sidebar-body::-webkit-scrollbar-thumb,.message-list::-webkit-scrollbar-thumb{
      background:#343434;
      border-radius:999px;
    }

    .sidebar-section-label{
      font-family:var(--mono);
      font-size:0.62rem;
      letter-spacing:0.1em;
      text-transform:uppercase;
      color:var(--soft);
      margin:0.35rem 0 0.6rem;
      padding:0 0.35rem;
    }

    .user-list{display:flex;flex-direction:column;gap:0.3rem}
    .user-item{
      width:100%;
      border:1px solid transparent;
      background:transparent;
      border-radius:14px;
      padding:0.7rem 0.75rem;
      display:flex;
      align-items:center;
      gap:0.7rem;
      cursor:pointer;
      text-align:left;
      color:inherit;
      transition:background .16s,border-color .16s;
    }
    .user-item:hover{
      background:rgba(255,255,255,0.04);
      border-color:rgba(255,255,255,0.06);
    }
    .user-item.active{
      background:rgba(78,205,196,0.09);
      border-color:rgba(78,205,196,0.3);
    }

    .user-avatar-wrap{
      position:relative;
      width:36px;
      height:36px;
      flex-shrink:0;
    }

    .user-avatar,.message-avatar{
      border-radius:50%;
      border:1px solid var(--border);
      background:linear-gradient(135deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:var(--hand);
      color:var(--fg);
    }
    .user-avatar{width:36px;height:36px;font-size:1.05rem}

    .presence-dot{
      position:absolute;
      right:-1px;
      bottom:-1px;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#3a3a3a;
      border:2px solid rgba(20,20,20,0.98);
      transition:background .2s;
    }
    .presence-dot.online{background:var(--green)}

    .sidebar-user-main{min-width:0;flex:1}
    .sidebar-user-top{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:0.4rem;
      margin-bottom:0.18rem;
    }

    .sidebar-user-name,.sidebar-user-time,.sidebar-user-sub{
      font-family:var(--mono);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .sidebar-user-name{font-size:0.74rem;color:var(--fg)}
    .sidebar-user-time{font-size:0.58rem;color:var(--soft);flex-shrink:0}
    .sidebar-user-sub{display:block;font-size:0.62rem;color:var(--soft)}
    .sidebar-user-sub.has-unread{color:#d7f8f5}
    .sidebar-user-sub.is-typing{color:var(--blue)}

    .unread-badge{
      background:var(--red);
      color:#fff;
      font-size:0.58rem;
      min-width:1.15rem;
      height:1.15rem;
      padding:0 0.3rem;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-family:var(--mono);
      flex-shrink:0;
    }

    .chat-shell{
      min-width:0;
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    .chat-main{
      min-height:0;
      display:flex;
      flex-direction:column;
      flex:1;
      height:100%;
      transition:background .25s;
      position:relative;
    }

    .chat-main.is-private{
      background:
        radial-gradient(ellipse at top right,rgba(192,132,252,0.055) 0%,transparent 55%),
        rgba(0,0,0,0.12);
    }

    .message-list{
      flex:1;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      padding:1rem clamp(0.9rem,3vw,2rem) 0.9rem;
      display:flex;
      flex-direction:column;
      gap:0.82rem;
      scroll-behavior:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      position:relative;
    }
    .message-list::after{content:'';display:block;min-height:1px}

    .day-divider{
      align-self:center;
      font-family:var(--mono);
      font-size:0.6rem;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:var(--soft);
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.04);
      border-radius:999px;
      padding:0.26rem 0.65rem;
      margin:0.1rem 0 0.2rem;
    }

    .message-row{
      display:flex;
      gap:0.72rem;
      align-items:flex-start;
      max-width:880px;
      width:100%;
      animation:msgIn 180ms var(--ease) both;
      position:relative;
    }
    .message-row.own{
      align-self:flex-end;
      flex-direction:row-reverse;
    }

    @keyframes msgIn{
      from{opacity:0;transform:translateY(5px)}
      to{opacity:1;transform:translateY(0)}
    }

    .message-avatar{
      width:36px;
      height:36px;
      font-size:0.95rem;
      flex-shrink:0;
      user-select:none;
    }

    .message-stack{
      min-width:0;
      max-width:min(100%,720px);
      display:flex;
      flex-direction:column;
      gap:0.18rem;
      position:relative;
    }

    .message-bubble{
      position:relative;
      background:rgba(255,255,255,0.035);
      border:1px solid rgba(255,255,255,0.045);
      border-left:2px solid rgba(78,205,196,0.55);
      border-radius:14px;
      padding:0.68rem 0.88rem 0.74rem;
      box-shadow:var(--shadow-soft);
      contain:layout paint;
      cursor:pointer;
      transition:border-color .16s,background .16s;
      will-change:auto;
    }

    .message-row.own .message-bubble{
      border-left-color:rgba(192,132,252,0.68);
      background:rgba(192,132,252,0.045);
    }

    .message-row.pending .message-bubble{
      border-style:solid;
    }
    .message-row.pending .message-bubble::after{
      content:'';
      position:absolute;
      inset:0;
      border-radius:inherit;
      pointer-events:none;
      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(255,255,255,0.03) 25%,
          rgba(255,255,255,0.055) 50%,
          rgba(255,255,255,0.03) 75%,
          transparent 100%
        );
      background-size:200% 100%;
      animation:pendingSheen 1.55s linear infinite;
      opacity:.7;
    }
    @keyframes pendingSheen{
      from{background-position:200% 0}
      to{background-position:-200% 0}
    }

    .message-row.failed .message-bubble{
      border-left-color:rgba(255,107,107,0.82);
      background:rgba(255,107,107,0.05);
    }

    .reply-stub{
      display:flex;
      gap:0.56rem;
      align-items:flex-start;
      background:rgba(255,255,255,0.04);
      border-radius:10px;
      padding:0.45rem 0.58rem;
      margin-bottom:0.5rem;
      cursor:pointer;
      transition:background .15s;
    }
    .reply-stub:hover{background:rgba(255,255,255,0.06)}

    .reply-stub-line{
      width:2px;
      flex-shrink:0;
      align-self:stretch;
      border-radius:999px;
      background:rgba(78,205,196,0.7);
      margin-top:1px;
    }
    .message-row.own .reply-stub-line{background:rgba(192,132,252,0.74)}

    .reply-stub-main{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:0.12rem;
    }

    .reply-stub-name{
      font-family:var(--mono);
      font-size:0.58rem;
      color:var(--blue);
      letter-spacing:0.06em;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .message-row.own .reply-stub-name{color:#d8b5ff}

    .reply-stub-text{
      font-size:0.83rem;
      color:var(--soft);
      line-height:1.35;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .message-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:0.75rem;
      margin-bottom:0.24rem;
    }

    .message-name{
      color:var(--fg);
      font-family:var(--hand);
      font-size:0.98rem;
      font-weight:600;
      line-height:1;
    }

    .message-time{
      font-family:var(--mono);
      font-size:0.6rem;
      color:var(--soft);
      white-space:nowrap;
      flex-shrink:0;
    }

    .message-text{
      font-size:0.98rem;
      line-height:1.55;
      color:#d2d2d2;
      white-space:pre-wrap;
      word-wrap:break-word;
      overflow-wrap:anywhere;
    }

    .message-text.deleted{
      color:var(--soft);
      font-style:italic;
    }

    .bubble-meta{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:0.4rem;
      min-height:0.9rem;
      margin-top:0.35rem;
      font-family:var(--mono);
      font-size:0.57rem;
      letter-spacing:0.05em;
      text-transform:uppercase;
      color:var(--soft);
    }
    .message-row.own .bubble-meta{color:rgba(220,220,220,0.66)}
    .bubble-meta .status-dot{
      width:5px;
      height:5px;
      border-radius:50%;
      background:currentColor;
      opacity:.85;
    }
    .bubble-meta.sending{color:var(--amber)}
    .bubble-meta.seen{color:var(--blue)}
    .bubble-meta.failed{color:var(--red)}
    .bubble-meta.hidden-meta{display:none}

    .reactions{
      display:flex;
      flex-wrap:wrap;
      gap:0.28rem;
      padding:0.12rem 0 0;
      min-height:0;
    }

    .reaction-chip{
      display:inline-flex;
      align-items:center;
      gap:0.22rem;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:999px;
      padding:0.14rem 0.45rem;
      font-size:0.74rem;
      line-height:1;
      cursor:pointer;
      transition:background .14s,border-color .14s,color .14s;
      user-select:none;
      min-height:24px;
    }
    .reaction-chip:hover{
      background:rgba(255,255,255,0.09);
      border-color:rgba(255,255,255,0.14);
    }
    .reaction-chip.mine{
      border-color:rgba(78,205,196,0.34);
      background:rgba(78,205,196,0.1);
    }
    .reaction-chip .count{
      font-family:var(--mono);
      font-size:0.58rem;
      color:var(--muted);
    }

    .system-row{
      align-self:center;
      max-width:720px;
      width:100%;
    }
    .system-card{
      background:transparent;
      border:1px dashed rgba(255,255,255,0.07);
      border-radius:18px;
      text-align:center;
      padding:1.4rem 1rem;
      color:var(--soft);
      font-family:var(--mono);
      font-size:0.68rem;
      letter-spacing:0.05em;
    }
    .empty-icon{font-size:1.3rem;margin-bottom:0.55rem;opacity:0.7}
    .empty-title{
      font-size:0.72rem;
      letter-spacing:0.1em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:0.5rem;
    }
    .empty-hint{
      font-family:var(--serif);
      font-size:0.95rem;
      color:var(--soft);
      line-height:1.6;
      max-width:38ch;
      margin:0 auto;
    }

    .typing-row{align-self:flex-start}
    .typing-bubble{
      display:inline-flex;
      align-items:center;
      gap:0.5rem;
      background:rgba(255,255,255,0.035);
      border:1px solid rgba(255,255,255,0.05);
      border-left:2px solid rgba(78,205,196,0.4);
      border-radius:14px;
      padding:0.55rem 0.88rem;
      animation:msgIn 160ms var(--ease) both;
    }

    .typing-label{font-family:var(--mono);font-size:0.62rem;color:var(--soft)}
    .typing-dots{display:inline-flex;gap:3px;align-items:center}
    .typing-dots span{
      display:block;
      width:5px;
      height:5px;
      border-radius:50%;
      background:var(--blue);
      animation:dotBounce 1.05s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2){animation-delay:.16s}
    .typing-dots span:nth-child(3){animation-delay:.32s}
    @keyframes dotBounce{
      0%,60%,100%{transform:translateY(0);opacity:0.4}
      30%{transform:translateY(-4px);opacity:1}
    }

    .composer-wrap{
      flex-shrink:0;
      width:100%;
      border-top:1px solid var(--border);
      background:rgba(19,19,19,0.95);
      backdrop-filter:blur(10px);
      padding-bottom:calc(var(--composer-offset) + var(--safe-bottom));
      transition:padding-bottom .16s ease;
    }

    .reply-bar{
      display:none;
      align-items:center;
      gap:0.7rem;
      padding:0.55rem 0.9rem;
      border-bottom:1px solid var(--border);
      background:rgba(25,25,25,0.92);
    }
    .reply-bar.active{display:flex}

    .reply-bar-line{
      width:2px;
      align-self:stretch;
      border-radius:999px;
      background:var(--blue);
      flex-shrink:0;
    }
    .reply-bar-inner{min-width:0;flex:1}
    .reply-bar-name{
      font-family:var(--mono);
      font-size:0.6rem;
      color:var(--blue);
      text-transform:uppercase;
      letter-spacing:0.06em;
      margin-bottom:0.1rem;
    }
    .reply-bar-text{
      font-size:0.88rem;
      color:var(--soft);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .reply-bar-close{
      background:none;
      border:none;
      color:var(--soft);
      cursor:pointer;
      font-size:0.9rem;
      flex-shrink:0;
      width:26px;
      height:26px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      transition:color .15s,background .15s;
    }
    .reply-bar-close:hover{
      color:var(--fg);
      background:rgba(255,255,255,0.06);
    }

    .composer-inner{padding:0.8rem 0.9rem 0.9rem}

    .composer-status{
      min-height:0;
      padding:0 0.15rem 0.42rem;
      font-family:var(--mono);
      font-size:0.64rem;
      letter-spacing:0.04em;
      color:var(--soft);
    }
    .composer-status:empty{display:none}
    .composer-status.error{color:var(--red)}

    .composer{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:0.65rem;
      align-items:end;
    }

    .message-input{
      width:100%;
      min-height:54px;
      max-height:140px;
      resize:none;
      overflow-y:hidden;
      overflow-x:hidden;
      scrollbar-width:none;
      border:1px solid var(--border);
      border-radius:16px;

<body>
  <header class="shell-header">
    <div class="header-left">

        class="modal-input"
        type="text"

  <div class="app-grid">

          <div class="sidebar-title">Conversations</div>

      <div class="sidebar-body">

      </div>

  <script>
  (function(){
    'use strict';

    // ── Config ─────────────────────────────────────────────────────────────
    const SB_URL = 'https://lbpkgvmxxcubzbzwoswd.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicGtndm14eGN1Ynpiendvc3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNzM2OTQsImV4cCI6MjA4Njg0OTY5NH0.BaP0JY9v74qJPu9qRYoL1Mn3NWM3I-VB51dczOvxnrI';
