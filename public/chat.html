<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Chat | Colin Archive</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#121212;
      --bg-2:#181818;
      --bg-3:#1d1d1d;
      --surface:#202020;
      --surface-2:#252525;
      --surface-3:#2c2c2c;
      --fg:#f1f1f1;
      --fg-2:#dbdbdb;
      --muted:#bbbbbb;
      --soft:#9b9b9b;
      --border:#313131;
      --border-soft:#3b3b3b;
      --blue:#61d7cf;
      --blue-soft:rgba(97,215,207,0.12);
      --violet:#c69dff;
      --violet-soft:rgba(198,157,255,0.12);
      --green:#60d978;
      --red:#ff7575;
      --amber:#ffc96a;
      --shadow:0 16px 44px rgba(0,0,0,0.28);
      --shadow-soft:0 8px 22px rgba(0,0,0,0.18);
      --serif:'Crimson Text', Georgia, serif;
      --mono:'IBM Plex Mono', 'Courier New', monospace;
      --hand:'Caveat', cursive;
      --header-h:72px;
      --sidebar-w:320px;
      --app-vh:100vh;
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-right:env(safe-area-inset-right, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
      --safe-left:env(safe-area-inset-left, 0px);
      --ease:cubic-bezier(.22,1,.36,1);
    }

    @supports (height: 100dvh){
      :root{ --app-vh:100dvh; }
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      padding:0;
      height:100%;
      background:var(--bg);
      color:var(--fg);
    }

    body{
      font-family:var(--serif);
      background:
        radial-gradient(circle at top right, rgba(97,215,207,0.035), transparent 28%),
        linear-gradient(to bottom, #161616, #111111);
      overflow:hidden;
      -webkit-text-size-adjust:100%;
      text-rendering:optimizeLegibility;
    }

    button,input,textarea{
      font:inherit;
      color:inherit;
    }

    button{
      -webkit-tap-highlight-color:transparent;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .hidden{ display:none !important; }

    .app{
      height:var(--app-vh);
      display:grid;
      grid-template-rows:var(--header-h) minmax(0,1fr);
      overflow:hidden;
    }

    .shell-header{
      min-height:var(--header-h);
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);
      align-items:center;
      gap:0.85rem;
      padding:
        max(0.75rem, var(--safe-top))
        max(0.9rem, calc(0.9rem + var(--safe-right)))
        0.75rem
        max(0.9rem, calc(0.9rem + var(--safe-left)));
      border-bottom:1px solid var(--border);
      background:rgba(18,18,18,0.95);
      flex-shrink:0;
      z-index:30;
      position:relative;
    }

    @supports (backdrop-filter: blur(10px)){
      .shell-header{
        backdrop-filter:blur(10px);
      }
    }

    .header-left{
      display:flex;
      align-items:center;
      gap:0.65rem;
      min-width:0;
    }

    .logo{
      font-family:var(--mono);
      font-size:0.79rem;
      letter-spacing:0.12em;
      text-transform:uppercase;
      font-weight:500;
      white-space:nowrap;
    }

    .mobile-inbox-btn,
    .reply-bar-close,
    .icon-btn{
      width:42px;
      height:42px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--fg-2);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:background .16s ease, border-color .16s ease, color .16s ease;
    }

    .mobile-inbox-btn:focus-visible,
    .reply-bar-close:focus-visible,
    .icon-btn:focus-visible,
    .sidebar-search:focus-visible,
    .message-input:focus-visible,
    .send-btn:focus-visible,
    .back-btn:focus-visible,
    .user-item:focus-visible,
    .popover-btn:focus-visible,
    .popover-emoji:focus-visible,
    .modal-btn:focus-visible,
    .modal-input:focus-visible{
      outline:2px solid rgba(97,215,207,0.65);
      outline-offset:2px;
    }

    .mobile-inbox-btn:hover,
    .reply-bar-close:hover,
    .icon-btn:hover{
      background:var(--surface-2);
      border-color:#464646;
      color:var(--fg);
    }

    .mobile-inbox-btn{
      display:none;
      position:relative;
      flex-shrink:0;
    }

    .mobile-inbox-dot{
      position:absolute;
      top:7px;
      right:7px;
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--red);
      box-shadow:0 0 0 2px rgba(18,18,18,0.95);
      display:none;
    }

    .mobile-inbox-btn.has-unread .mobile-inbox-dot{
      display:block;
    }

    .header-room{
      min-width:0;
      text-align:center;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:0.18rem;
    }

    .header-room-title{
      font-family:var(--hand);
      font-size:1.22rem;
      color:var(--blue);
      line-height:1.05;
      max-width:100%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .header-room-subtitle{
      font-family:var(--mono);
      font-size:0.74rem;
      letter-spacing:0.04em;
      text-transform:uppercase;
      color:var(--muted);
      line-height:1.2;
      max-width:100%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .header-room-subtitle.typing{
      color:var(--blue);
    }

    .header-right{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      min-width:0;
    }

    .back-btn{
      display:inline-flex;
      align-items:center;
      gap:0.5rem;
      padding:0 1rem;
      min-height:42px;
      border-radius:999px;
      border:1px solid rgba(97,215,207,0.4);
      background:var(--blue-soft);
      color:var(--blue);
      font-family:var(--mono);
      font-size:0.74rem;
      letter-spacing:0.06em;
      text-transform:uppercase;
      cursor:pointer;
      white-space:nowrap;
      transition:background .16s ease, border-color .16s ease, color .16s ease;
    }

    .back-btn:hover{
      background:rgba(97,215,207,0.18);
      border-color:rgba(97,215,207,0.65);
      color:#9af0ea;
    }

    .app-grid{
      min-height:0;
      display:grid;
      grid-template-columns:var(--sidebar-w) minmax(0,1fr);
      overflow:hidden;
    }

    .sidebar,
    .mobile-sidebar{
      background:rgba(22,22,22,0.96);
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .sidebar{
      border-right:1px solid var(--border);
    }

    @supports (backdrop-filter: blur(10px)){
      .sidebar,
      .mobile-sidebar{
        backdrop-filter:blur(10px);
      }
    }

    .sidebar-top{
      padding:1rem;
      border-bottom:1px solid var(--border);
      flex-shrink:0;
    }

    .sidebar-title-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:0.75rem;
      margin-bottom:0.85rem;
    }

    .sidebar-title,
    .presence-summary,
    .sidebar-section-label{
      font-family:var(--mono);
      text-transform:uppercase;
      letter-spacing:0.06em;
    }

    .sidebar-title{
      font-size:0.76rem;
      color:var(--fg-2);
    }

    .presence-summary{
      font-size:0.7rem;
      color:var(--soft);
      white-space:nowrap;
    }

    .sidebar-search,
    .modal-input{
      width:100%;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--fg);
      border-radius:14px;
      padding:0.8rem 0.95rem;
      outline:none;
      transition:border-color .16s ease, background .16s ease;
    }

    .sidebar-search{
      font-family:var(--mono);
      font-size:0.82rem;
    }

    .sidebar-search::placeholder,
    .modal-input::placeholder{
      color:var(--soft);
    }

    .sidebar-search:focus,
    .modal-input:focus{
      border-color:rgba(97,215,207,0.55);
      background:var(--surface-2);
    }

    .sidebar-body{
      min-height:0;
      overflow:auto;
      padding:0.8rem;
    }

    .sidebar-body::-webkit-scrollbar,
    .message-list::-webkit-scrollbar{
      width:8px;
      height:8px;
    }

    .sidebar-body::-webkit-scrollbar-thumb,
    .message-list::-webkit-scrollbar-thumb{
      background:#3a3a3a;
      border-radius:999px;
    }

    .sidebar-body::-webkit-scrollbar-track,
    .message-list::-webkit-scrollbar-track{
      background:transparent;
    }

    .sidebar-section-label{
      font-size:0.69rem;
      color:var(--soft);
      padding:0 0.25rem;
      margin:0.2rem 0 0.75rem;
    }

    .user-list{
      display:flex;
      flex-direction:column;
      gap:0.36rem;
    }

    .user-item{
      width:100%;
      display:flex;
      align-items:center;
      gap:0.8rem;
      text-align:left;
      padding:0.78rem 0.82rem;
      border-radius:16px;
      border:1px solid transparent;
      background:transparent;
      cursor:pointer;
      color:inherit;
      transition:background .15s ease, border-color .15s ease;
    }

    .user-item:hover{
      background:rgba(255,255,255,0.04);
      border-color:rgba(255,255,255,0.06);
    }

    .user-item.active{
      background:var(--blue-soft);
      border-color:rgba(97,215,207,0.28);
    }

    .user-avatar-wrap{
      position:relative;
      width:40px;
      height:40px;
      flex-shrink:0;
    }

    .user-avatar,
    .message-avatar{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      border:1px solid var(--border-soft);
      background:linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      color:var(--fg);
      user-select:none;
    }

    .user-avatar{
      font-family:var(--hand);
      font-size:1.1rem;
    }

    .presence-dot{
      position:absolute;
      right:-1px;
      bottom:-1px;
      width:11px;
      height:11px;
      border-radius:50%;
      border:2px solid rgba(22,22,22,0.96);
      background:#4a4a4a;
    }

    .presence-dot.online{
      background:var(--green);
    }

    .sidebar-user-main{
      min-width:0;
      flex:1;
    }

    .sidebar-user-top{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:0.5rem;
      margin-bottom:0.18rem;
    }

    .sidebar-user-name{
      font-family:var(--mono);
      font-size:0.8rem;
      color:var(--fg);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .sidebar-user-time{
      font-family:var(--mono);
      font-size:0.7rem;
      color:var(--soft);
      white-space:nowrap;
      flex-shrink:0;
    }

    .sidebar-user-sub{
      display:block;
      font-family:var(--mono);
      font-size:0.72rem;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      line-height:1.25;
    }

    .sidebar-user-sub.has-unread{
      color:#eefdfc;
    }

    .sidebar-user-sub.is-typing{
      color:var(--blue);
    }

    .unread-badge{
      flex-shrink:0;
      min-width:1.25rem;
      height:1.25rem;
      padding:0 0.34rem;
      border-radius:999px;
      background:var(--red);
      color:white;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-family:var(--mono);
      font-size:0.65rem;
    }

    .chat-shell{
      min-width:0;
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    .chat-main{
      min-width:0;
      min-height:0;
      display:grid;
      grid-template-rows:minmax(0,1fr) auto;
      background:transparent;
      position:relative;
    }

    .chat-main.is-private{
      background:
        radial-gradient(ellipse at top right, rgba(198,157,255,0.05), transparent 50%),
        transparent;
    }

    .message-list{
      min-height:0;
      overflow:auto;
      padding:1rem clamp(1rem, 3vw, 2rem) 1rem;
      display:flex;
      flex-direction:column;
      gap:0.9rem;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      scroll-behavior:auto;
    }

    .day-divider{
      align-self:center;
      padding:0.3rem 0.7rem;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.06);
      background:rgba(255,255,255,0.035);
      color:var(--muted);
      font-family:var(--mono);
      font-size:0.7rem;
      letter-spacing:0.04em;
      text-transform:uppercase;
    }

    .message-row{
      width:100%;
      max-width:900px;
      display:flex;
      align-items:flex-start;
      gap:0.72rem;
      position:relative;
    }

    .message-row.own{
      align-self:flex-end;
      flex-direction:row-reverse;
    }

    .message-avatar{
      width:36px;
      height:36px;
      flex-shrink:0;
      font-family:var(--hand);
      font-size:0.95rem;
    }

    .message-stack{
      min-width:0;
      max-width:min(100%, 760px);
      display:flex;
      flex-direction:column;
      gap:0.3rem;
    }

    .message-bubble{
      position:relative;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.06);
      border-left:3px solid rgba(97,215,207,0.55);
      border-radius:16px;
      padding:0.68rem 0.9rem 0.62rem;
      box-shadow:var(--shadow-soft);
      user-select:text;
      -webkit-user-select:text;
      transition:background .14s ease, border-color .14s ease, box-shadow .14s ease;
    }

    .message-row.own .message-bubble{
      border-left-color:rgba(198,157,255,0.65);
      background:rgba(198,157,255,0.055);
    }

    .message-bubble.menu-open{
      box-shadow:0 0 0 2px rgba(97,215,207,0.2), var(--shadow-soft);
    }

    .message-row.failed .message-bubble{
      border-left-color:rgba(255,117,117,0.75);
      background:rgba(255,117,117,0.05);
    }

    .reply-stub{
      display:flex;
      align-items:flex-start;
      gap:0.5rem;
      background:rgba(255,255,255,0.03);
      border-radius:10px;
      padding:0.36rem 0.48rem;
      margin-bottom:0.45rem;
      cursor:pointer;
    }

    .reply-stub-line{
      width:3px;
      align-self:stretch;
      border-radius:999px;
      background:rgba(97,215,207,0.72);
      flex-shrink:0;
    }

    .message-row.own .reply-stub-line{
      background:rgba(198,157,255,0.8);
    }

    .reply-stub-main{
      min-width:0;
    }

    .reply-stub-name{
      font-family:var(--mono);
      font-size:0.68rem;
      color:var(--blue);
      line-height:1.15;
      text-transform:uppercase;
      letter-spacing:0.04em;
      margin-bottom:0.08rem;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .message-row.own .reply-stub-name{
      color:#dfcbff;
    }

    .reply-stub-text{
      font-size:0.84rem;
      color:var(--muted);
      line-height:1.25;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .message-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:0.75rem;
      margin-bottom:0.18rem;
    }

    .message-name{
      font-family:var(--hand);
      font-size:1rem;
      color:var(--fg);
      font-weight:600;
      line-height:1;
    }

    .message-time{
      font-family:var(--mono);
      font-size:0.72rem;
      color:var(--soft);
      white-space:nowrap;
      flex-shrink:0;
      margin-top:2px;
    }

    .message-text{
      font-size:1rem;
      line-height:1.55;
      color:var(--fg-2);
      white-space:pre-wrap;
      word-break:break-word;
      overflow-wrap:anywhere;
    }

    .message-text.deleted{
      color:var(--muted);
      font-style:italic;
    }

    .bubble-meta{
      margin-top:0.32rem;
      min-height:0.95rem;
      display:flex;
      justify-content:flex-end;
      align-items:center;
      font-family:var(--mono);
      font-size:0.67rem;
      color:var(--soft);
      line-height:1.1;
    }

    .bubble-meta.hidden-meta{
      display:none;
    }

    .bubble-meta.sending{
      color:var(--amber);
    }

    .bubble-meta.failed{
      color:var(--red);
    }

    .bubble-meta.seen{
      color:var(--blue);
    }

    .reactions{
      display:flex;
      flex-wrap:wrap;
      gap:0.32rem;
      min-height:0;
    }

    .reaction-chip{
      display:inline-flex;
      align-items:center;
      gap:0.28rem;
      min-height:28px;
      padding:0.18rem 0.52rem;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.045);
      cursor:pointer;
      font-size:0.82rem;
      line-height:1;
      transition:background .14s ease, border-color .14s ease;
    }

    .reaction-chip:hover{
      background:rgba(255,255,255,0.08);
      border-color:rgba(255,255,255,0.14);
    }

    .reaction-chip.mine{
      background:var(--blue-soft);
      border-color:rgba(97,215,207,0.28);
    }

    .reaction-chip .count{
      font-family:var(--mono);
      font-size:0.68rem;
      color:var(--muted);
    }

    .system-row{
      align-self:center;
      width:100%;
      max-width:760px;
    }

    .system-card{
      border:1px dashed rgba(255,255,255,0.08);
      border-radius:18px;
      padding:1.35rem 1rem;
      text-align:center;
      background:transparent;
      color:var(--muted);
      box-shadow:none;
    }

    .empty-icon{
      font-size:1.4rem;
      margin-bottom:0.5rem;
      opacity:0.85;
    }

    .empty-title{
      font-family:var(--mono);
      font-size:0.8rem;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:var(--fg-2);
      margin-bottom:0.45rem;
    }

    .empty-hint{
      font-size:1rem;
      line-height:1.6;
      color:var(--muted);
      max-width:40ch;
      margin:0 auto;
    }

    .typing-row{
      align-self:flex-start;
    }

    .typing-bubble{
      display:inline-flex;
      align-items:center;
      gap:0.55rem;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.06);
      border-left:3px solid rgba(97,215,207,0.45);
      background:rgba(255,255,255,0.04);
      padding:0.56rem 0.85rem;
    }

    .typing-label{
      font-family:var(--mono);
      font-size:0.74rem;
      color:var(--muted);
    }

    .typing-dots{
      display:inline-flex;
      align-items:center;
      gap:4px;
    }

    .typing-dots span{
      width:6px;
      height:6px;
      border-radius:50%;
      background:var(--blue);
      opacity:0.75;
      animation:typingPulse 1s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2){ animation-delay:.16s; }
    .typing-dots span:nth-child(3){ animation-delay:.32s; }

    @keyframes typingPulse{
      0%, 100%{ transform:translateY(0); opacity:0.35; }
      45%{ transform:translateY(-3px); opacity:1; }
    }

    .composer-wrap{
      border-top:1px solid var(--border);
      background:rgba(19,19,19,0.98);
      padding-bottom:var(--safe-bottom);
      flex-shrink:0;
    }

    @supports (backdrop-filter: blur(10px)){
      .composer-wrap{
        backdrop-filter:blur(10px);
      }
    }

    .reply-bar{
      display:none;
      align-items:center;
      gap:0.7rem;
      padding:0.56rem 0.9rem;
      border-bottom:1px solid var(--border);
      background:rgba(26,26,26,0.92);
    }

    .reply-bar.active{
      display:flex;
    }

    .reply-bar-line{
      width:3px;
      align-self:stretch;
      border-radius:999px;
      background:var(--blue);
      opacity:0.9;
      flex-shrink:0;
    }

    .reply-bar-inner{
      min-width:0;
      flex:1;
    }

<body>
  <div class="app">
    <header class="shell-header">
      <div class="header-left">
        <a href="/" class="logo">Colin Archive</a>
        <button id="mobileInboxBtn" class="mobile-inbox-btn" type="button" aria-label="Open inbox">

          <div id="composerWrap" class="composer-wrap">

  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>

  <aside id="mobileSidebar" class="mobile-sidebar" aria-hidden="true" aria-label="Mobile conversations">
    <div class="sidebar-top">
      <div class="sidebar-title-row">
        <div class="sidebar-title">Conversations</div>
        <div id="mobPresenceSummary" class="presence-summary"></div>

  <div
    id="nameModal"
    class="modal"
    aria-hidden="true"

    aria-modal="true"

  <script>
    (function(){

      const sb = window.supabase.createClient(SB_URL, SB_KEY);
      const $ = id => document.getElementById(id);

      const supportsCssEscape = !!(window.CSS && typeof window.CSS.escape === 'function');
      const cssEscape = (value) => {
        const str = String(value ?? '');
        if (supportsCssEscape) return window.CSS.escape(str);
        return str.replace(/["\\#.;,[\]()=:]/g, '\\$&');
      };

      const nowIso = () => new Date().toISOString();

      const esc = value => String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

      const normName = value => String(value || '')
        .replace(/\s+/g, ' ')
        .replace(/[\u200B-\u200D\uFEFF]/g, '')
        .trim()
        .slice(0, 30);

      const initial = name => {

      const isMobile = () => window.innerWidth <= 960;
      const isTouchLike = () => window.matchMedia('(pointer: coarse)').matches;
      const dmKey = (a,b) => [a,b].sort().join('__');

      const timeFmt = new Intl.DateTimeFormat(undefined, { hour:'2-digit', minute:'2-digit' });
      const dateFmt = new Intl.DateTimeFormat(undefined, { month:'short', day:'numeric', year:'numeric' });

      const sorterByDate = (a,b) => new Date(a.created_at).getTime() - new Date(b.created_at).getTime();

      const el = {
        modal: $('nameModal'),
        gname: $('guestName'),
        joinBtn: $('joinGuestBtn'),
        clearBtn: $('clearSessionBtn'),

        replyText: $('replyBarText'),
        replyClose: $('replyBarClose')
      };

      const state = {
        inited: false,
        sideOpen: false,
        stickBottom: true,
        searchTerm: '',
        lastSendAt: 0,
        lastTypingAt: 0,
        modalOpen: false,
        lastHeaderKey: '',
        lastRenderedTypingId: '',
        longPressTimer: null,
        longPressTarget: null,

        composingTouchMenu: false,

        convo: {

        },
