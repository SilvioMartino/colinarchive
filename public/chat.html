    const COOLDOWN_MS = 900;
    const MAX_TA_HEIGHT = 140;
    const NEAR_BOTTOM = 88;
    const TYPING_EXPIRE = 3000;
    const TYPING_THROTTLE = 700;
    const PRESENCE_EXPIRE = 35000;
    const PRESENCE_BEAT = 12000;
    const REACTIONS = ['👍','❤️','😂','😮','😢','🔥'];

    // ── Utils ──────────────────────────────────────────────────────────────
    const sb = window.supabase.createClient(SB_URL, SB_KEY);
    const $ = id => document.getElementById(id);
    const nowIso = () => new Date().toISOString();
    const esc = v => String(v ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
    const normName = v => String(v || '')
      .replace(/\s+/g, ' ')
      .replace(/[\u200B-\u200D\uFEFF]/g, '')
      .trim()
      .slice(0, 30);
    const initial = n => {
      const c = normName(n);
      return c ? c[0].toUpperCase() : '?';
    };
    const isMobile = () => window.innerWidth <= 920;
    const dmKey = (a,b) => [a,b].sort().join('__');
    const timeFmt = new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'});
    const dateFmt = new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'});
    const sorterByDate = (a,b) => new Date(a.created_at) - new Date(b.created_at);

    // ── DOM ────────────────────────────────────────────────────────────────
    const el = {
      modal: $('nameModal'),
      gname: $('guestName'),
      joinBtn: $('joinGuestBtn'),
      clearBtn: $('clearSessionBtn'),
      nameErr: $('nameError'),

      userList: $('userList'),
      mobList: $('mobileUserList'),
      sideSearch: $('sidebarSearch'),
      mobSearch: $('mobileSidebarSearch'),
      inboxBtn: $('mobileInboxBtn'),
      mobSide: $('mobileSidebar'),

      title: $('chatTitle'),
      sub: $('chatSubtitle'),
      backBtn: $('backToPublicBtn'),

      msgList: $('messageList'),
      input: $('messageInput'),
      sendBtn: $('sendBtn'),
      status: $('composerStatus'),
      counter: $('charCounter'),
      chatMain: $('chatMain'),
      deskPres: $('deskPresenceSummary'),
      mobPres: $('mobPresenceSummary'),

      replyBar: $('replyBar'),
      replyName: $('replyBarName'),
      replyText: $('replyBarText'),
      replyClose: $('replyBarClose'),
      composerWrap: $('composerWrap')
    };

    // ── State ──────────────────────────────────────────────────────────────
    const state = {
      inited: false,
      activityOn: false,
      sideOpen: false,
      stickBottom: true,
      searchTerm: '',
      lastSendAt: 0,
      lastTypingAt: 0,
      viewportBottomInset: 0,

      convo: {
        type: 'public',
        recipientId: null
      },

      user: {
        id: getOrCreateId(),
        name: normName(localStorage.getItem(STORAGE_KEYS.uname) || '')
      },

      pubOrder: [],
      pubMap: new Map(),

      privOrders: new Map(),      // uid -> [messageId,...]
      privMaps: new Map(),        // uid -> Map(messageId, msg)

      contacts: new Map(),        // uid -> contact

      messageIndex: new Map(),    // messageId -> { convoKey, message }
      rowEls: new Map(),          // messageId -> row element
      dividerEls: new Map(),      // "convoKey|YYYY-MM-DD" -> divider element
      reactions: new Map(),       // msgId -> Map(emoji, Set(userIds))

      activePopover: null,        // {mid, el}
      replyTo: null,              // {id, senderName, body}
      presMap: new Map(),         // uid -> presence row

      subs: {
        pub: null,
        privIns: null,
        privUpd: null,
        pres: null,
        typing: null,
        react: null
      },

      timers: {
        presBeat: null,
        presDecay: null
      }
    };

    // ── Initialization helpers ────────────────────────────────────────────
    function getOrCreateId(){
      let id = localStorage.getItem(STORAGE_KEYS.uid);
      if (id && /^[a-zA-Z0-9_-]{10,}$/.test(id)) return id;
      id = 'guest_' + (crypto.randomUUID
        ? crypto.randomUUID().replace(/-/g,'')
        : Math.random().toString(36).slice(2) + Date.now());
      localStorage.setItem(STORAGE_KEYS.uid, id);
      return id;
    }

    function validateName(v){
      const n = normName(v);
      if (!n || n.length < 2) return { ok:false, msg:'Use at least 2 characters.' };
      if (!/[A-Za-zÀ-ÿ0-9]/.test(n)) return { ok:false, msg:'Use normal letters or numbers.' };
      return { ok:true, name:n };
    }

    function initHistory(){
      history.replaceState({chat:'public'}, '', location.href);
    }

    window.addEventListener('popstate', e => {
      const hs = e.state;
      if (!hs) return;
      if (hs.chat === 'private' && hs.userId) {
        applyConvo('private', hs.userId, hs.name || '', false);
        return;
      }
      applyConvo('public', null, null, false);
    });

    function relTime(iso){
      if (!iso) return '';
      const s = Math.floor((Date.now() - new Date(iso)) / 1000);
      if (s < 45) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      const d = Math.floor(s / 86400);
      if (d === 1) return 'yesterday';
      if (d < 7) return d + 'd ago';
      return dateFmt.format(new Date(iso));
    }

    function msgTime(iso){
      if (!iso) return '';
      return timeFmt.format(new Date(iso)) + ' · ' + relTime(iso);
    }

    function sideTime(iso){
      return iso ? relTime(iso) : '';
    }

    function dayKey(iso){
      const d = new Date(iso);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${dd}`;
    }

    function sameDay(a,b){
      if (!a || !b) return false;
      return dayKey(a) === dayKey(b);
    }

    function convoKeyOf(type, recipientId){
      return type === 'public' ? 'public' : `dm:${recipientId}`;
    }

    function currentConvoKey(){
      return convoKeyOf(state.convo.type, state.convo.recipientId);
    }

    // ── Scroll & keyboard stability ───────────────────────────────────────
    function isNearBottom(){
      return (el.msgList.scrollHeight - el.msgList.scrollTop - el.msgList.clientHeight) < NEAR_BOTTOM;
    }

    function scrollBottom(force = false, smooth = false){
      if (!force && !state.stickBottom) return;
      const top = el.msgList.scrollHeight;
      el.msgList.scrollTo({
        top,
        behavior: smooth ? 'smooth' : 'auto'
      });
    }

    function scrollToMessage(mid){
      const row = state.rowEls.get(mid);
      if (!row) return;
      row.scrollIntoView({ behavior:'smooth', block:'center' });
      row.classList.remove('jump-highlight');
      void row.offsetWidth;
      row.classList.add('jump-highlight');
      setTimeout(() => row.classList.remove('jump-highlight'), 1200);
    }

    function setupVisualViewport(){
      if (!window.visualViewport) return;

      const updateViewportInset = () => {
        if (!isMobile()) {
          document.documentElement.style.setProperty('--composer-offset', '0px');
          state.viewportBottomInset = 0;
          return;
        }

        const vv = window.visualViewport;
        const windowHeight = window.innerHeight;
        const keyboardInset = Math.max(0, Math.round(windowHeight - vv.height - vv.offsetTop));
        state.viewportBottomInset = keyboardInset;
        document.documentElement.style.setProperty('--composer-offset', `${keyboardInset}px`);
      };

      window.visualViewport.addEventListener('resize', updateViewportInset, { passive:true });
      window.visualViewport.addEventListener('scroll', updateViewportInset, { passive:true });
      window.addEventListener('resize', updateViewportInset, { passive:true });
      updateViewportInset();
    }

    // ── UI state helpers ──────────────────────────────────────────────────
    function openSidebar(){
      state.sideOpen = true;
      el.mobSide.classList.add('active');
      el.mobSide.setAttribute('aria-hidden', 'false');
    }

    function closeSidebar(){
      state.sideOpen = false;
      el.mobSide.classList.remove('active');
      el.mobSide.setAttribute('aria-hidden', 'true');
    }

    function setStatus(msg = '', type = ''){
      el.status.textContent = msg;
      el.status.className = 'composer-status' + (type ? ' ' + type : '');
    }

    function showModal(prefill = ''){
      el.nameErr.textContent = '';
      el.gname.value = prefill || state.user.name || '';
      el.modal.classList.add('active');
      el.modal.setAttribute('aria-hidden', 'false');
      setTimeout(() => el.gname.focus(), 20);
    }

    function hideModal(){
      el.modal.classList.remove('active');
      el.modal.setAttribute('aria-hidden', 'true');
    }

    function setReply(msg){
      if (!msg) {
        state.replyTo = null;
        el.replyBar.classList.remove('active');
        return;
      }
      state.replyTo = {
        id: msg.id,
        senderName: normName(msg.sender_name || msg.name || 'Unknown'),
        body: msg.is_deleted ? 'Message deleted' : (msg.body || '')
      };
      el.replyName.textContent = '↩ ' + state.replyTo.senderName;
      el.replyText.textContent = state.replyTo.body.slice(0, 140);
      el.replyBar.classList.add('active');
      el.input.focus();
    }

    // ── Contact model ─────────────────────────────────────────────────────
    function ensureContact(userId, name){
      if (!userId || userId === state.user.id) return null;

      if (!state.contacts.has(userId)) {
        state.contacts.set(userId, {
          userId,
          name: normName(name) || 'Unknown',
          lastMessageAt: null,
          lastPreview: '',
          unreadCount: 0,
          online: false,
          lastSeenAt: null,
          typing: false,
          typingTimer: null
        });
      } else if (name && !state.contacts.get(userId).name) {
        state.contacts.get(userId).name = normName(name) || 'Unknown';
      }

      return state.contacts.get(userId);
    }

    function currentContact(){
      return state.convo.type === 'private'
        ? state.contacts.get(state.convo.recipientId)
        : null;
    }

    function updateContactFromMessage(msg){
      if (msg._convoType !== 'private') return;

      const otherId = msg.sender_id === state.user.id ? msg.recipient_id : msg.sender_id;
      const otherName = normName(
        msg.sender_id === state.user.id ? msg.recipient_name : msg.sender_name
      ) || 'Unknown';

      const contact = ensureContact(otherId, otherName);
      if (!contact) return;

      contact.lastMessageAt = msg.created_at;
      contact.lastPreview = msg.is_deleted ? 'Message deleted' : (msg.body || '');
    }

    // ── Presence / typing ────────────────────────────────────────────────
    function isOnline(uid){
      const e = state.presMap.get(uid);
      return !!e?.last_seen_at && (Date.now() - new Date(e.last_seen_at).getTime()) < PRESENCE_EXPIRE;
    }

    function refreshPresence(){
      state.contacts.forEach(c => {
        c.online = isOnline(c.userId);
        const e = state.presMap.get(c.userId);
        if (e?.last_seen_at) c.lastSeenAt = e.last_seen_at;
      });
      renderContacts();
      updateHeader();
    }

    async function pingPresence(){
      if (!state.user.name) return;
      await sb
        .from('chat_presence')
        .upsert(
          {
            user_id: state.user.id,
            user_name: state.user.name,
            last_seen_at: nowIso()
          },
          { onConflict:'user_id' }
        )
        .catch(() => {});
    }

    async function publishTyping(){
      if (state.convo.type !== 'private' || !state.convo.recipientId || !state.user.name) return;
      if (!state.subs.typing) return;
      if (Date.now() - state.lastTypingAt < TYPING_THROTTLE) return;

      state.lastTypingAt = Date.now();
      await state.subs.typing.send({
        type:'broadcast',
        event:'typing',
        payload:{
          user_id: state.user.id,
          user_name: state.user.name,
          room_key: dmKey(state.user.id, state.convo.recipientId),
          last_typed_at: nowIso()
        }
      }).catch(() => {});
    }

    function handleTypingEvent(row){
      if (!row || row.user_id === state.user.id) return;
      if (row.room_key !== dmKey(state.user.id, row.user_id)) return;

      const c = ensureContact(row.user_id, row.user_name);
      if (!c) return;

      if (c.typingTimer) clearTimeout(c.typingTimer);
      c.typing = true;
      c.typingTimer = setTimeout(() => {
        c.typing = false;
        c.typingTimer = null;
        renderContacts();
        updateHeader();
        renderTypingRow();
      }, TYPING_EXPIRE);

      renderContacts();
      updateHeader();
      renderTypingRow();
    }

    // ── Conversation store ───────────────────────────────────────────────
    function getPubMessages(){
      return state.pubOrder.map(id => state.pubMap.get(id)).filter(Boolean);
    }

    function getPrivMap(uid){
      if (!state.privMaps.has(uid)) state.privMaps.set(uid, new Map());
      return state.privMaps.get(uid);
    }

    function getPrivOrder(uid){
      if (!state.privOrders.has(uid)) state.privOrders.set(uid, []);
      return state.privOrders.get(uid);
    }

    function getPrivMessages(uid){
      const map = getPrivMap(uid);
      const order = getPrivOrder(uid);
      return order.map(id => map.get(id)).filter(Boolean);
    }

    function currentMessages(){
      return state.convo.type === 'public'
        ? getPubMessages()
        : getPrivMessages(state.convo.recipientId);
    }

    function storeMessage(convoType, recipientId, msg){
      const cKey = convoKeyOf(convoType, recipientId);
      const id = msg.id;
      msg._convoType = convoType;
      msg._recipientId = recipientId;

      if (convoType === 'public') {
        if (!state.pubMap.has(id)) {
          state.pubMap.set(id, msg);
          state.pubOrder.push(id);
          state.pubOrder.sort((a,b) => sorterByDate(state.pubMap.get(a), state.pubMap.get(b)));
        } else {
          Object.assign(state.pubMap.get(id), msg);
        }
      } else {
        const map = getPrivMap(recipientId);
        const order = getPrivOrder(recipientId);

        if (!map.has(id)) {
          map.set(id, msg);
          order.push(id);
          order.sort((a,b) => sorterByDate(map.get(a), map.get(b)));
        } else {
          Object.assign(map.get(id), msg);
        }
      }

      state.messageIndex.set(id, { convoKey:cKey, message:getMessageById(id, convoType, recipientId) });
      updateContactFromMessage(getMessageById(id, convoType, recipientId));
      return getMessageById(id, convoType, recipientId);
    }

    function deleteMessageFromStore(convoType, recipientId, id){
      state.rowEls.delete(id);
      state.messageIndex.delete(id);
      state.reactions.delete(id);

      if (convoType === 'public') {
        state.pubMap.delete(id);
        state.pubOrder = state.pubOrder.filter(x => x !== id);
        return;
      }

      const map = getPrivMap(recipientId);
      const order = getPrivOrder(recipientId);
      map.delete(id);
      state.privOrders.set(recipientId, order.filter(x => x !== id));
    }

    function getMessageById(id, convoType, recipientId){
      if (convoType === 'public') return state.pubMap.get(id) || null;
      return getPrivMap(recipientId).get(id) || null;
    }

    function findMessageAnywhere(id){
      return state.messageIndex.get(id)?.message || null;
    }

    function getCurrentMessageById(id){
      if (state.convo.type === 'public') return state.pubMap.get(id) || null;
      return getPrivMap(state.convo.recipientId).get(id) || null;
    }

    function replaceMessageId(convoType, recipientId, oldId, newMsg){
      const map = convoType === 'public' ? state.pubMap : getPrivMap(recipientId);
      const order = convoType === 'public' ? state.pubOrder : getPrivOrder(recipientId);

      const oldMsg = map.get(oldId);
      if (!oldMsg) return newMsg;

      const idx = order.indexOf(oldId);
      if (idx === -1) return newMsg;

      map.delete(oldId);
      state.messageIndex.delete(oldId);
      state.rowEls.delete(oldId);

      newMsg._convoType = convoType;
      newMsg._recipientId = recipientId;
      map.set(newMsg.id, newMsg);
      order[idx] = newMsg.id;
      state.messageIndex.set(newMsg.id, {
        convoKey: convoKeyOf(convoType, recipientId),
        message: newMsg
      });

      return newMsg;
    }

    // ── Reaction store ────────────────────────────────────────────────────
    function ensureReactionBucket(mid){
      if (!state.reactions.has(mid)) state.reactions.set(mid, new Map());
      return state.reactions.get(mid);
    }

    function applyReactionInsert(mid, emoji, userId){
      const bucket = ensureReactionBucket(mid);
      if (!bucket.has(emoji)) bucket.set(emoji, new Set());
      bucket.get(emoji).add(userId);
    }

    function applyReactionDelete(mid, emoji, userId){
      const bucket = state.reactions.get(mid);
      if (!bucket || !bucket.has(emoji)) return;
      bucket.get(emoji).delete(userId);
      if (bucket.get(emoji).size === 0) bucket.delete(emoji);
      if (bucket.size === 0) state.reactions.delete(mid);
    }

    function reactionHtml(mid){
      const bucket = state.reactions.get(mid);
      if (!bucket || bucket.size === 0) return '';

      return [...bucket.entries()]
        .filter(([, set]) => set.size > 0)
        .map(([emoji, users]) => {
          const mine = users.has(state.user.id);
          return `
            <button class="reaction-chip${mine ? ' mine' : ''}" type="button"
              data-reaction-chip="1"
              data-mid="${esc(mid)}"
              data-emoji="${esc(emoji)}">
              <span>${esc(emoji)}</span>
              <span class="count">${users.size}</span>
            </button>
          `;
        })
        .join('');
    }

    // ── Render helpers ────────────────────────────────────────────────────
    function messageStatusInfo(msg){
      if (msg._convoType !== 'private' || msg.sender_id !== state.user.id) return null;
      if (msg._failed) return { label:'Failed', cls:'failed' };
      if (msg._optimistic) return { label:'Sending', cls:'sending' };
      if (msg.seen_at) return { label:'Seen', cls:'seen' };
      return { label:'Delivered', cls:'' };
    }

    function resolveReplyTarget(msg){
      if (!msg.reply_to_id) return null;
      return findMessageAnywhere(msg.reply_to_id);
    }

    function replyStubHtml(msg){
      if (!msg.reply_to_id) return '';
      const original = resolveReplyTarget(msg);
      const senderName = original
        ? normName(original.sender_name || original.name || 'Unknown')
        : '…';
      const text = original
        ? (original.is_deleted ? 'Message deleted' : (original.body || ''))
        : 'Original message not found';

      return `
        <div class="reply-stub" data-scroll-to="${esc(msg.reply_to_id)}" role="button" tabindex="0">
          <div class="reply-stub-line"></div>
          <div class="reply-stub-main">
            <div class="reply-stub-name">${esc(senderName)}</div>
            <div class="reply-stub-text">${esc(text.slice(0, 120))}</div>
          </div>
        </div>
      `;
    }

    function bubbleMetaHtml(msg){
      const st = messageStatusInfo(msg);
      if (!st) return '<div class="bubble-meta hidden-meta"></div>';
      return `
        <div class="bubble-meta ${esc(st.cls)}">
          <span>${esc(st.label)}</span>
          <span class="status-dot"></span>
        </div>
      `;
    }

    function buildMessageRow(msg){
      const own = msg.sender_id === state.user.id;
      const row = document.createElement('div');
      row.className = `message-row${own ? ' own' : ''}${msg._optimistic ? ' pending' : ''}${msg._failed ? ' failed' : ''}`;
      row.dataset.mid = msg.id;
      row.dataset.own = own ? '1' : '0';

      const name = normName(msg.sender_name || msg.name || 'Unknown');

      row.innerHTML = `
        <div class="message-avatar">${esc(initial(name))}</div>
        <div class="message-stack">
          <div class="message-bubble"
            data-bubble-mid="${esc(msg.id)}"
            data-uid="${esc(msg.sender_id || '')}"
            data-name="${esc(name)}">
            ${replyStubHtml(msg)}
            <div class="message-header">
              <span class="message-name">${esc(name)}</span>
              <div class="message-time">${esc(msgTime(msg.created_at))}</div>
            </div>
            <div class="message-body-wrap">
              ${
                msg.is_deleted
                  ? '<div class="message-text deleted">This message was deleted.</div>'
                  : `<div class="message-text">${esc(msg.body || '')}</div>`
              }
            </div>
            ${bubbleMetaHtml(msg)}
          </div>
          <div class="reactions" data-reactions="${esc(msg.id)}">${reactionHtml(msg.id)}</div>
        </div>
      `;

      state.rowEls.set(msg.id, row);
      return row;
    }

    function patchRow(msg){
      const row = state.rowEls.get(msg.id);
      if (!row) return;

      const own = msg.sender_id === state.user.id;
      row.classList.toggle('own', own);
      row.classList.toggle('pending', !!msg._optimistic);
      row.classList.toggle('failed', !!msg._failed);
      row.dataset.own = own ? '1' : '0';

      const bubble = row.querySelector('.message-bubble');
      const name = normName(msg.sender_name || msg.name || 'Unknown');

      bubble.dataset.bubbleMid = msg.id;
      bubble.dataset.uid = msg.sender_id || '';
      bubble.dataset.name = name;

      const avatar = row.querySelector('.message-avatar');
      if (avatar) avatar.textContent = initial(name);

      const nameEl = row.querySelector('.message-name');
      if (nameEl) nameEl.textContent = name;

      const timeEl = row.querySelector('.message-time');
      if (timeEl) timeEl.textContent = msgTime(msg.created_at);

      const oldReply = bubble.querySelector('.reply-stub');
      const newReplyHtml = replyStubHtml(msg);
      if (newReplyHtml && !oldReply) {
        bubble.insertAdjacentHTML('afterbegin', newReplyHtml);
      } else if (!newReplyHtml && oldReply) {
        oldReply.remove();
      } else if (newReplyHtml && oldReply) {
        const tmp = document.createElement('div');
        tmp.innerHTML = newReplyHtml.trim();
        oldReply.replaceWith(tmp.firstElementChild);
      }

      const bodyWrap = row.querySelector('.message-body-wrap');
      if (bodyWrap) {
        bodyWrap.innerHTML = msg.is_deleted
          ? '<div class="message-text deleted">This message was deleted.</div>'
          : `<div class="message-text">${esc(msg.body || '')}</div>`;
      }

      const metaEl = row.querySelector('.bubble-meta');
      if (metaEl) {
        const tmp = document.createElement('div');
        tmp.innerHTML = bubbleMetaHtml(msg).trim();
        metaEl.replaceWith(tmp.firstElementChild);
      }

      patchReactionRow(msg.id);
    }

    function patchReactionRow(mid){
      const container = el.msgList.querySelector(`[data-reactions="${CSS.escape(mid)}"]`);
      if (!container) return;
      container.innerHTML = reactionHtml(mid);
    }

    function rebuildCurrentConversation(){
      closePopover();

      el.msgList.innerHTML = '';
      state.rowEls.clear();
      state.dividerEls.clear();

      const msgs = currentMessages();
      if (!msgs.length) {
        renderEmptyState();
        renderTypingRow();
        scrollBottom(true, false);
        return;
      }

      const frag = document.createDocumentFragment();
      const cKey = currentConvoKey();
      let prev = null;

      msgs.forEach(msg => {
        if (!prev || !sameDay(prev.created_at, msg.created_at)) {
          const dKey = `${cKey}|${dayKey(msg.created_at)}`;
          const divider = document.createElement('div');
          divider.className = 'day-divider';
          divider.textContent = dateFmt.format(new Date(msg.created_at));
          state.dividerEls.set(dKey, divider);
          frag.appendChild(divider);
        }
        const row = buildMessageRow(msg);
        frag.appendChild(row);
        prev = msg;
      });

      el.msgList.appendChild(frag);
      renderTypingRow();
      scrollBottom(true, false);
    }

    function renderEmptyState(){
      el.msgList.innerHTML = state.convo.type === 'private'
        ? `
          <div class="system-row">
            <div class="system-card">
              <div class="empty-icon">💬</div>
              <div class="empty-title">No messages yet</div>
              <div class="empty-hint">Start the private conversation. Only the two of you can see this.</div>
            </div>
          </div>
        `
        : `
          <div class="system-row">
            <div class="system-card">
              <div class="empty-icon">🌍</div>
              <div class="empty-title">Public room is quiet</div>
              <div class="empty-hint">Say something — or tap a message to react, reply, or start a private conversation.</div>
            </div>
          </div>
        `;
    }

    function renderTypingRow(){
      const old = $('typingRow');
      if (old) old.remove();

      if (state.convo.type !== 'private') return;
      const c = currentContact();
      if (!c?.typing) return;

      const row = document.createElement('div');
      row.className = 'typing-row';
      row.id = 'typingRow';
      row.innerHTML = `
        <div class="typing-bubble">
          <span class="typing-label">${esc(c.name)}</span>
          <span class="typing-dots"><span></span><span></span><span></span></span>
        </div>
      `;
      el.msgList.appendChild(row);
      scrollBottom(false, true);
    }

    function maybeInsertRowForCurrentMessage(msg){
      if (msg._convoType !== state.convo.type) return false;
      if (msg._convoType === 'private' && msg._recipientId !== state.convo.recipientId) return false;

      const msgs = currentMessages();
      const idx = msgs.findIndex(m => m.id === msg.id);
      if (idx === -1) return false;

      const empty = el.msgList.querySelector('.system-row');
      if (empty) empty.remove();

      const beforeMsg = idx > 0 ? msgs[idx - 1] : null;
      const afterMsg = idx < msgs.length - 1 ? msgs[idx + 1] : null;
      const cKey = currentConvoKey();
      const dKey = `${cKey}|${dayKey(msg.created_at)}`;

      let existingDivider = state.dividerEls.get(dKey);

      if (!beforeMsg || !sameDay(beforeMsg.created_at, msg.created_at)) {
        if (!existingDivider) {
          const divider = document.createElement('div');
          divider.className = 'day-divider';
          divider.textContent = dateFmt.format(new Date(msg.created_at));
          state.dividerEls.set(dKey, divider);
          existingDivider = divider;
        }
      }

      const row = buildMessageRow(msg);
      const beforeRow = afterMsg ? state.rowEls.get(afterMsg.id) : null;

      if (beforeRow) {
        if (existingDivider && !existingDivider.isConnected) {
          el.msgList.insertBefore(existingDivider, beforeRow);
        }
        el.msgList.insertBefore(row, beforeRow);
      } else {
        if (existingDivider && !existingDivider.isConnected) {
          el.msgList.appendChild(existingDivider);
        }
        const typingRow = $('typingRow');
        if (typingRow) el.msgList.insertBefore(row, typingRow);
        else el.msgList.appendChild(row);
      }

      if (afterMsg && !sameDay(afterMsg.created_at, msg.created_at)) {
        const afterDayKey = `${cKey}|${dayKey(afterMsg.created_at)}`;
        let afterDivider = state.dividerEls.get(afterDayKey);
        if (!afterDivider || !afterDivider.isConnected) {
          afterDivider = document.createElement('div');
          afterDivider.className = 'day-divider';
          afterDivider.textContent = dateFmt.format(new Date(afterMsg.created_at));
          state.dividerEls.set(afterDayKey, afterDivider);
          const nextRow = state.rowEls.get(afterMsg.id);
          if (nextRow) el.msgList.insertBefore(afterDivider, nextRow);
        }
      }

      return true;
    }

    function removeRow(mid){
      const row = state.rowEls.get(mid);
      if (!row) return;
      closePopover();

      const prev = row.previousElementSibling;
      const next = row.nextElementSibling;

      row.remove();
      state.rowEls.delete(mid);

      if (
        prev &&
        prev.classList.contains('day-divider') &&
        (!next || next.classList.contains('day-divider') || next.id === 'typingRow')
      ) {
        prev.remove();
      }

      if (!el.msgList.querySelector('.message-row')) {
        renderEmptyState();
      }
    }

    function renderContacts(){
      const term = state.searchTerm.toLowerCase();

      const list = [...state.contacts.values()]
        .filter(c => c.userId !== state.user.id)
        .filter(c => !term || c.name.toLowerCase().includes(term))
        .sort((a,b) => {
          const at = a.lastMessageAt ? new Date(a.lastMessageAt).getTime() : 0;
          const bt = b.lastMessageAt ? new Date(b.lastMessageAt).getTime() : 0;
          return bt - at;
        });

      const html = list.length ? list.map(c => {
        const active = state.convo.type === 'private' && state.convo.recipientId === c.userId;
        const badge = c.unreadCount > 0
          ? `<span class="unread-badge">${c.unreadCount > 99 ? '99+' : c.unreadCount}</span>`
          : '';

        const lastMsg = getPrivMessages(c.userId).slice(-1)[0];
        const mine = !!lastMsg && lastMsg.sender_id === state.user.id && !c.typing;
        const preview = c.typing ? 'typing...' : (c.lastPreview || '');
        const full = mine ? 'You: ' + preview : preview;

        return `
          <button class="user-item${active ? ' active' : ''}" type="button"
            data-user-item="1"
            data-uid="${esc(c.userId)}"
            data-name="${esc(c.name)}">
            <div class="user-avatar-wrap">
              <div class="user-avatar">${esc(initial(c.name))}</div>
              <span class="presence-dot${c.online ? ' online' : ''}"></span>
            </div>
            <div class="sidebar-user-main">
              <div class="sidebar-user-top">
                <span class="sidebar-user-name">${esc(c.name)}</span>
                <span class="sidebar-user-time">${esc(c.online ? 'online' : sideTime(c.lastMessageAt || c.lastSeenAt))}</span>
              </div>
              <span class="sidebar-user-sub${c.unreadCount > 0 ? ' has-unread' : ''}${c.typing ? ' is-typing' : ''}">
                ${esc(full.slice(0, 48))}
              </span>
            </div>
            ${badge}
          </button>
        `;
      }).join('') : `
        <div class="system-card" style="border-radius:12px;font-size:0.65rem">
          No private conversations yet.<br>Tap any message to start one.
        </div>
      `;

      el.userList.innerHTML = html;
      el.mobList.innerHTML = html;

      el.inboxBtn.classList.toggle(
        'has-unread',
        [...state.contacts.values()].some(c => c.unreadCount > 0)
      );

      const onlineCount = [...state.contacts.values()].filter(c => c.online).length;
      const label = onlineCount ? `${onlineCount} online` : '';
      el.deskPres.textContent = label;
      el.mobPres.textContent = label;
    }

    function updateHeader(){
      const priv = state.convo.type === 'private';
      el.backBtn.classList.toggle('hidden', !priv);
      el.chatMain.classList.toggle('is-private', priv);

      if (!priv) {
        el.title.textContent = 'Public room';
        el.sub.textContent = 'Everyone can read this room';
        el.sub.classList.remove('typing');
        return;
      }

      const c = currentContact();
      el.title.textContent = c?.name || 'Private conversation';

      if (c?.typing) {
        el.sub.textContent = `${c.name} is typing...`;
        el.sub.classList.add('typing');
        return;
      }

      el.sub.classList.remove('typing');
      el.sub.textContent = c?.online
        ? 'online now'
        : c?.lastSeenAt
          ? `last seen ${relTime(c.lastSeenAt)}`
          : 'private conversation';
    }

    // ── Popover ───────────────────────────────────────────────────────────
    function closePopover(){
      if (!state.activePopover) return;
      state.activePopover.el.remove();
      state.activePopover = null;
    }

    function buildPopoverActions(msg){
      const own = msg.sender_id === state.user.id;
      const isPrivate = msg._convoType === 'private';
      const items = [];

      items.push({
        action: 'reply',
        icon: '↩',
        label: 'Reply',
        hint: ''
      });

      if (!own && !isPrivate) {
        items.push({
          action: 'dm',
          icon: '💬',
          label: 'Message privately',
          hint: ''
        });
      }

      if (own && !msg.is_deleted && !msg._optimistic) {
        items.push({
          action: 'delete',
          icon: '🗑',
          label: 'Delete',
          hint: '',
          danger: true
        });
      }

      if (msg._failed) {
        items.push({
          action: 'retry',
          icon: '⟳',
          label: 'Retry send',
          hint: ''
        });
      }

      return items;
    }

    function openPopoverForMessage(msg, anchorEl){
      closePopover();

      const pop = document.createElement('div');
      pop.className = 'message-popover';
      pop.dataset.mid = msg.id;

      const actions = buildPopoverActions(msg);

      pop.innerHTML = `
        <div class="popover-reactions">
          ${REACTIONS.map(emoji => `
            <button class="popover-emoji" type="button"
              data-popover-react="${esc(emoji)}"
              aria-label="React with ${esc(emoji)}">${esc(emoji)}</button>
          `).join('')}
        </div>
        <div class="popover-actions">
          ${actions.map(item => `
            <button class="popover-btn${item.danger ? ' danger' : ''}" type="button"
              data-popover-action="${esc(item.action)}"
              data-mid="${esc(msg.id)}">
              <span class="popover-btn-main">
                <span class="popover-btn-icon">${esc(item.icon)}</span>
                <span class="popover-btn-label">${esc(item.label)}</span>
              </span>
              <span class="popover-btn-hint">${esc(item.hint || '')}</span>
            </button>
          `).join('')}
        </div>
      `;

      document.body.appendChild(pop);

      const rect = anchorEl.getBoundingClientRect();
      const popRect = pop.getBoundingClientRect();

      let left = rect.left;
      let top = rect.bottom + 8;

      if (left + popRect.width > window.innerWidth - 10) {
        left = window.innerWidth - popRect.width - 10;
      }
      if (left < 10) left = 10;

      if (top + popRect.height > window.innerHeight - 10) {
        top = rect.top - popRect.height - 8;
      }
      if (top < 10) top = 10;

      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;

      state.activePopover = { mid: msg.id, el: pop };
    }

    // ── Loading data ──────────────────────────────────────────────────────
    async function loadReactionsForIds(msgIds){
      if (!msgIds.length) return;
      const { data, error } = await sb.from('message_reactions').select('*').in('message_id', msgIds);
      if (error) {
        console.error(error);
        return;
      }

      msgIds.forEach(id => state.reactions.delete(id));

      (data || []).forEach(row => {
        applyReactionInsert(row.message_id, row.emoji, row.user_id);
      });
    }

    function normalizePublicRow(r){
      return {
        ...r,
        id: String(r.id),
        sender_id: r.user_id || r.sender_id || '',
        sender_name: normName(r.name || r.sender_name || 'Unknown'),
        _optimistic: false,
        _failed: false
      };
    }

    function normalizePrivateRow(r){
      return {
        ...r,
        id: String(r.id),
        sender_name: normName(r.sender_name || 'Unknown'),
        recipient_name: normName(r.recipient_name || 'Unknown'),
        _optimistic: false,
        _failed: false
      };
    }

    async function loadPublic(){
      const { data, error } = await sb
        .from('messages')
        .select('*')
        .eq('room', PUB_ROOM)
        .order('created_at', { ascending:true })
        .limit(200);

      if (error) {
        console.error(error);
        return;
      }

      state.pubMap.clear();
      state.pubOrder = [];

      (data || []).forEach(row => {
        const msg = normalizePublicRow(row);
        storeMessage('public', null, msg);
      });

      await loadReactionsForIds(state.pubOrder);
    }

    async function loadPrivate(){
      const { data, error } = await sb
        .from('private_messages')
        .select('*')
        .or(`sender_id.eq.${state.user.id},recipient_id.eq.${state.user.id}`)
        .order('created_at', { ascending:true })
        .limit(500);

      if (error) {
        console.error(error);
        return;
      }

      state.privMaps.clear();
      state.privOrders.clear();
      state.contacts.clear();

      (data || []).forEach(row => {
        const msg = normalizePrivateRow(row);
        const otherId = msg.sender_id === state.user.id ? msg.recipient_id : msg.sender_id;
        storeMessage('private', otherId, msg);
      });

      const ids = (data || []).map(x => String(x.id));
      await loadReactionsForIds(ids);
    }

    // ── Realtime subscriptions ────────────────────────────────────────────
    function subscribePublic(){
      if (state.subs.pub) sb.removeChannel(state.subs.pub);

      state.subs.pub = sb.channel(`pub:${PUB_ROOM}`)
        .on('postgres_changes', {
          event:'INSERT',
          schema:'public',
          table:'messages',
          filter:`room=eq.${PUB_ROOM}`
        }, payload => {
          const row = normalizePublicRow(payload.new);
          const existing = state.pubMap.get(row.id);
          if (existing) return;

          const wasNear = isNearBottom();
          const msg = storeMessage('public', null, row);
          maybeInsertRowForCurrentMessage(msg);

          if (state.convo.type === 'public') {
            renderTypingRow();
            if (wasNear || msg.sender_id === state.user.id) scrollBottom(true, true);
          }
        })
        .on('postgres_changes', {
          event:'UPDATE',
          schema:'public',
          table:'messages'
        }, payload => {
          const row = normalizePublicRow(payload.new);
          if (!state.pubMap.has(row.id)) {
            const msg = storeMessage('public', null, row);
            maybeInsertRowForCurrentMessage(msg);
            return;
          }

          const existing = state.pubMap.get(row.id);
          Object.assign(existing, row);
          patchRow(existing);
        })
        .on('postgres_changes', {
          event:'DELETE',
          schema:'public',
          table:'messages'
        }, payload => {
          const id = String(payload.old?.id || '');
          if (!id || !state.pubMap.has(id)) return;
          deleteMessageFromStore('public', null, id);
          if (state.convo.type === 'public') removeRow(id);
        })
        .subscribe();
    }

    function mergeIncomingPrivate(row){
      const msg = normalizePrivateRow(row);
      const otherId = msg.sender_id === state.user.id ? msg.recipient_id : msg.sender_id;
      const map = getPrivMap(otherId);
      const order = getPrivOrder(otherId);

      let finalMsg = null;

      if (msg.client_id) {
        const optimisticId = [...order].find(mid => {
          const x = map.get(mid);
          return x && x.client_id === msg.client_id;
        });

        if (optimisticId && map.has(optimisticId)) {
          finalMsg = replaceMessageId('private', otherId, optimisticId, msg);
        }
      }

      if (!finalMsg) {
        finalMsg = storeMessage('private', otherId, msg);
      } else {
        updateContactFromMessage(finalMsg);
      }

      return { otherId, msg:finalMsg };
    }

    function subscribePrivate(){
      if (state.subs.privIns) sb.removeChannel(state.subs.privIns);
      if (state.subs.privUpd) sb.removeChannel(state.subs.privUpd);

      state.subs.privIns = sb.channel(`privIns:${state.user.id}`)
        .on('postgres_changes', {
          event:'INSERT',
          schema:'public',
          table:'private_messages'
        }, payload => {
          const row = payload.new;
          if (row.sender_id !== state.user.id && row.recipient_id !== state.user.id) return;

          const wasNear = isNearBottom();
          const { otherId, msg } = mergeIncomingPrivate(row);
          const contact = ensureContact(
            otherId,
            msg.sender_id === state.user.id ? msg.recipient_name : msg.sender_name
          );

          if (msg.sender_id !== state.user.id) {
            if (!(state.convo.type === 'private' && state.convo.recipientId === otherId)) {
              contact.unreadCount = (contact.unreadCount || 0) + 1;
            }
          }

          if (state.convo.type === 'private' && state.convo.recipientId === otherId) {
            maybeInsertRowForCurrentMessage(msg);
            renderTypingRow();
            if (wasNear || msg.sender_id === state.user.id) scrollBottom(true, true);
            markSeen(otherId);
          }

          renderContacts();
          updateHeader();
        })
        .subscribe();

      state.subs.privUpd = sb.channel(`privUpd:${state.user.id}`)
        .on('postgres_changes', {
          event:'UPDATE',
          schema:'public',
          table:'private_messages'
        }, payload => {
          const row = payload.new;
          if (row.sender_id !== state.user.id && row.recipient_id !== state.user.id) return;

          const msg = normalizePrivateRow(row);
          const otherId = msg.sender_id === state.user.id ? msg.recipient_id : msg.sender_id;
          const existing = getPrivMap(otherId).get(msg.id);

          if (!existing) {
            storeMessage('private', otherId, msg);
            if (state.convo.type === 'private' && state.convo.recipientId === otherId) {
              maybeInsertRowForCurrentMessage(msg);
            }
          } else {
            Object.assign(existing, msg);
            patchRow(existing);
          }

          updateContactFromMessage(getPrivMap(otherId).get(msg.id));
          renderContacts();
          updateHeader();
        })
        .subscribe();
    }

    function subscribePresence(){
      if (state.subs.pres) sb.removeChannel(state.subs.pres);

      state.subs.pres = sb.channel('chat_presence_feed')
        .on('postgres_changes', {
          event:'INSERT',
          schema:'public',
          table:'chat_presence'
        }, p => {
          state.presMap.set(p.new.user_id, p.new);
          refreshPresence();
        })
        .on('postgres_changes', {
          event:'UPDATE',
          schema:'public',
          table:'chat_presence'
        }, p => {
          state.presMap.set(p.new.user_id, p.new);
          refreshPresence();
        })
        .subscribe();
    }

    function subscribeTyping(){
      if (state.subs.typing) sb.removeChannel(state.subs.typing);

      state.subs.typing = sb.channel('typing_bus')
        .on('broadcast', { event:'typing' }, payload => handleTypingEvent(payload.payload))
        .subscribe();
    }

    function subscribeReactions(){
      if (state.subs.react) sb.removeChannel(state.subs.react);

      state.subs.react = sb.channel('chat_reactions_feed')
        .on('postgres_changes', {
          event:'INSERT',
          schema:'public',
          table:'message_reactions'
        }, payload => {
          const row = payload.new;
          applyReactionInsert(String(row.message_id), row.emoji, row.user_id);
          patchReactionRow(String(row.message_id));
        })
        .on('postgres_changes', {
          event:'DELETE',
          schema:'public',
          table:'message_reactions'
        }, payload => {
          const row = payload.old;
          applyReactionDelete(String(row.message_id), row.emoji, row.user_id);
          patchReactionRow(String(row.message_id));
        })
        .subscribe();
    }

    // ── Seen / delete / reaction actions ─────────────────────────────────
    async function markSeen(uid){
      if (!uid) return;

      const list = getPrivMessages(uid);
      const unseen = list.filter(m =>
        m.sender_id === uid &&
        !m.seen_at &&
        !m.is_deleted &&
        m.id &&
        !m._optimistic
      );

      if (!unseen.length) return;

      const seenAt = nowIso();
      const ids = unseen.map(m => m.id);

      const { error } = await sb
        .from('private_messages')
        .update({ seen_at: seenAt })
        .in('id', ids);

      if (error) {
        console.error(error);
        return;
      }

      unseen.forEach(m => {
        m.seen_at = seenAt;
        patchRow(m);
      });

      const c = state.contacts.get(uid);
      if (c) c.unreadCount = 0;
      renderContacts();
    }

    async function toggleReaction(mid, emoji){
      if (!state.user.name) {
        showModal();
        return;
      }

      const bucket = ensureReactionBucket(mid);
      const users = bucket.get(emoji) || new Set();
      const hasMine = users.has(state.user.id);

      if (hasMine) {
        applyReactionDelete(mid, emoji, state.user.id);
        patchReactionRow(mid);
        await sb.from('message_reactions')
          .delete()
          .match({ message_id: mid, user_id: state.user.id, emoji })
          .catch(console.error);
      } else {
        applyReactionInsert(mid, emoji, state.user.id);
        patchReactionRow(mid);
        await sb.from('message_reactions')
          .upsert(
            {
              message_id: mid,
              user_id: state.user.id,
              emoji,
              user_name: state.user.name
            },
            { onConflict:'message_id,user_id,emoji' }
          )
          .catch(console.error);
      }
    }

    async function softDeletePublic(mid){
      const msg = state.pubMap.get(mid);
      if (!msg) return;

      if (!window.confirm('Delete this message?')) return;

      const optimistic = {
        ...msg,
        is_deleted: true,
        body: ''
      };
      Object.assign(msg, optimistic);
      patchRow(msg);

      const trySoft = await sb
        .from('messages')
        .update({ is_deleted:true, body:'', edited_at: nowIso() })
        .eq('id', mid);

      if (!trySoft.error) return;

      console.warn('Public soft delete failed, trying hard delete fallback:', trySoft.error);

      const hard = await sb.from('messages').delete().eq('id', mid);
      if (hard.error) {
        console.error(hard.error);
        setStatus('Could not delete.', 'error');
      }
    }

    async function softDeletePrivate(mid){
      const msg = getCurrentMessageById(mid);
      if (!msg) return;
      if (!window.confirm('Delete this message?')) return;

      const prevBody = msg.body;
      msg.is_deleted = true;
      msg.body = '';
      patchRow(msg);

      const { error } = await sb
        .from('private_messages')
        .update({ is_deleted:true, body:'', edited_at: nowIso() })
        .eq('id', mid);

      if (error) {
        console.error(error);
        msg.is_deleted = false;
        msg.body = prevBody;
        patchRow(msg);
        setStatus('Could not delete.', 'error');
        return;
      }

      const c = currentContact();
      if (c) {
        c.lastPreview = 'Message deleted';
        renderContacts();
      }
    }

    async function retryFailedMessage(mid){
      const msg = getCurrentMessageById(mid);
      if (!msg || !msg._failed || msg._convoType !== 'private') return;

      const contact = currentContact();
      if (!contact) return;

      const newClientId = 'retry_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);

      msg._failed = false;
      msg._optimistic = true;
      msg.client_id = newClientId;
      patchRow(msg);

      const { error } = await sb.from('private_messages').insert({
        sender_id: state.user.id,
        sender_name: state.user.name,
        recipient_id: contact.userId,
        recipient_name: contact.name,
        body: msg.body,
        client_id: newClientId,
        reply_to_id: msg.reply_to_id || null
      });

      if (error) {
        console.error(error);
        msg._failed = true;
        msg._optimistic = false;
        patchRow(msg);
      }
    }

    // ── Sending ───────────────────────────────────────────────────────────
    function createOptimisticPrivateMessage(body, recipientId, recipientName, replyToId){
      const tempId = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      return {
        id: tempId,
        client_id: tempId,
        sender_id: state.user.id,
        sender_name: state.user.name,
        recipient_id: recipientId,
        recipient_name: recipientName,
        body,
        created_at: nowIso(),
        seen_at: null,
        is_deleted: false,
        reply_to_id: replyToId || null,
        _optimistic: true,
        _failed: false
      };
    }

    async function sendMessage(){
      const body = el.input.value.trim();
      if (!body) return;

      if (Date.now() - state.lastSendAt < COOLDOWN_MS) {
        setStatus('Slow down a little.', 'error');
        return;
      }

      if (!state.user.name) {
        showModal();
        return;
      }

      const draft = el.input.value;
      const replyToId = state.replyTo?.id || null;

      setStatus('');
      setReply(null);

      el.input.value = '';
      resizeTA();
      updateCounter();

      state.lastSendAt = Date.now();

      if (state.convo.type === 'public') {
        const { error } = await sb.from('messages').insert({
          room: PUB_ROOM,
          body,
          name: state.user.name,
          user_id: state.user.id,
          reply_to_id: replyToId || null
        });

        if (error) {
          console.error(error);
          el.input.value = draft;
          resizeTA();
          updateCounter();
          setStatus('Failed to send.', 'error');
        }

        el.input.focus();
        return;
      }

      const contact = currentContact();
      if (!contact) {
        el.input.value = draft;
        resizeTA();
        updateCounter();
        setStatus('Missing recipient.', 'error');
        return;
      }

      const optimistic = createOptimisticPrivateMessage(
        body,
        contact.userId,
        contact.name,
        replyToId
      );

      const wasNear = isNearBottom();
      const stored = storeMessage('private', contact.userId, optimistic);
      maybeInsertRowForCurrentMessage(stored);
      renderContacts();
      if (wasNear) scrollBottom(true, true);

      const { error } = await sb.from('private_messages').insert({
        sender_id: state.user.id,
        sender_name: state.user.name,
        recipient_id: contact.userId,
        recipient_name: contact.name,
        body,
        client_id: optimistic.client_id,
        reply_to_id: replyToId || null
      });

      if (error) {
        console.error(error);
        stored._optimistic = false;
        stored._failed = true;
        patchRow(stored);
        setStatus('Failed to send.', 'error');
      }

      el.input.focus();
    }

    // ── Conversation switching ────────────────────────────────────────────
    function applyConvo(type, userId, name, pushHistory){
      closePopover();
      setReply(null);

      if (type === 'private') {
        if (!userId || userId === state.user.id) return;
        ensureContact(userId, name);
        state.convo = { type:'private', recipientId:userId };
        state.stickBottom = true;

        const c = currentContact();
        if (c) c.unreadCount = 0;

        if (pushHistory) {
          history.pushState({ chat:'private', userId, name }, '', location.href);
        }

        localStorage.setItem(STORAGE_KEYS.convo, JSON.stringify(state.convo));
        updateHeader();
        renderContacts();
        rebuildCurrentConversation();
        markSeen(userId);
      } else {
        state.convo = { type:'public', recipientId:null };
        state.stickBottom = true;

        if (pushHistory) {
          history.pushState({ chat:'public' }, '', location.href);
        }

        localStorage.removeItem(STORAGE_KEYS.convo);
        updateHeader();
        renderContacts();
        rebuildCurrentConversation();
      }

      closeSidebar();
    }

    async function restoreConversation(){
      const raw = localStorage.getItem(STORAGE_KEYS.convo);
      if (!raw) {
        applyConvo('public', null, null, false);
        return;
      }

      try {
        const saved = JSON.parse(raw);
        if (
          saved?.type === 'private' &&
          saved.recipientId &&
          saved.recipientId !== state.user.id &&
          state.contacts.has(saved.recipientId)
        ) {
          const c = state.contacts.get(saved.recipientId);
          history.pushState({ chat:'private', userId:saved.recipientId, name:c?.name || '' }, '', location.href);
          state.convo = saved;
          state.stickBottom = true;
          updateHeader();
          renderContacts();
          rebuildCurrentConversation();
          markSeen(saved.recipientId);
          return;
        }
      } catch {}

      applyConvo('public', null, null, false);
    }

    // ── Input / textarea ─────────────────────────────────────────────────
    function resizeTA(){
      el.input.style.height = 'auto';
      el.input.style.overflowY = 'hidden';
      const h = Math.min(el.input.scrollHeight, MAX_TA_HEIGHT);
      el.input.style.height = h + 'px';
      el.input.style.overflowY = el.input.scrollHeight > MAX_TA_HEIGHT ? 'auto' : 'hidden';
    }

    function updateCounter(){
      el.counter.textContent = `${el.input.value.length} / 500`;
    }

    // ── Event delegation ──────────────────────────────────────────────────
    function onMessageListClick(e){
      const reactionChip = e.target.closest('[data-reaction-chip]');
      if (reactionChip) {
        e.preventDefault();
        toggleReaction(reactionChip.dataset.mid, reactionChip.dataset.emoji);
        return;
      }

      const replyStub = e.target.closest('[data-scroll-to]');
      if (replyStub) {
        e.preventDefault();
        scrollToMessage(replyStub.dataset.scrollTo);
        return;
      }

      const bubble = e.target.closest('[data-bubble-mid]');
      if (bubble) {
        const mid = bubble.dataset.bubbleMid;
        const msg = getCurrentMessageById(mid);
        if (!msg) return;

        if (state.activePopover?.mid === mid) {
          closePopover();
          return;
        }

        openPopoverForMessage(msg, bubble);
      }
    }

    function onDocumentClick(e){
      if (
        state.activePopover &&
        !e.target.closest('.message-popover') &&
        !e.target.closest('[data-bubble-mid]')
      ) {
        closePopover();
      }

      if (
        isMobile() &&
        state.sideOpen &&
        !el.mobSide.contains(e.target) &&
        !el.inboxBtn.contains(e.target)
      ) {
        closeSidebar();
      }
    }

    async function onDocumentPopoverClick(e){
      const reactBtn = e.target.closest('[data-popover-react]');
      if (reactBtn && state.activePopover) {
        const mid = state.activePopover.mid;
        const emoji = reactBtn.dataset.popoverReact;
        closePopover();
        await toggleReaction(mid, emoji);
        return;
      }

      const actionBtn = e.target.closest('[data-popover-action]');
      if (!actionBtn || !state.activePopover) return;

      const action = actionBtn.dataset.popoverAction;
      const mid = actionBtn.dataset.mid;
      const msg = getCurrentMessageById(mid);
      closePopover();

      if (!msg) return;

      if (action === 'reply') {
        setReply(msg);
        return;
      }

      if (action === 'dm') {
        const targetId = msg.sender_id;
        const targetName = normName(msg.sender_name || 'Unknown');
        if (targetId && targetId !== state.user.id) {
          applyConvo('private', targetId, targetName, true);
        }
        return;
      }

      if (action === 'delete') {
        if (msg._convoType === 'public') await softDeletePublic(mid);
        else await softDeletePrivate(mid);
        return;
      }

      if (action === 'retry') {
        await retryFailedMessage(mid);
      }
    }

    function bindEvents(){
      if (state.inited) return;
      state.inited = true;

      el.joinBtn.addEventListener('click', async () => {
        const r = validateName(el.gname.value);
        if (!r.ok) {
          el.nameErr.textContent = r.msg;
          return;
        }

        state.user.name = r.name;
        localStorage.setItem(STORAGE_KEYS.uname, r.name);
        hideModal();
        setStatus('');
        await pingPresence();
        if (!state.activityOn) setupActivity();
      });

      el.clearBtn.addEventListener('click', () => {
        Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
        location.reload();
      });

      el.gname.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          el.joinBtn.click();
        }
      });

      el.inboxBtn.addEventListener('click', () => {
        state.sideOpen ? closeSidebar() : openSidebar();
      });

      el.backBtn.addEventListener('click', () => {
        applyConvo('public', null, null, true);
      });

      el.sendBtn.addEventListener('click', sendMessage);
      el.replyClose.addEventListener('click', () => setReply(null));

      el.input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
          return;
        }
        if (state.convo.type === 'private') publishTyping();
      });

      el.input.addEventListener('input', () => {
        resizeTA();
        updateCounter();
        if (el.status.classList.contains('error')) setStatus('');
        if (state.convo.type === 'private' && el.input.value.trim()) publishTyping();
      });

      const syncSearch = src => {
        state.searchTerm = src.value;
        el.sideSearch.value = src.value;
        el.mobSearch.value = src.value;
        renderContacts();
      };

      el.sideSearch.addEventListener('input', () => syncSearch(el.sideSearch));
      el.mobSearch.addEventListener('input', () => syncSearch(el.mobSearch));

      el.msgList.addEventListener('scroll', () => {
        state.stickBottom = isNearBottom();
        if (
          state.stickBottom &&
          state.convo.type === 'private' &&
          state.convo.recipientId
        ) {
          markSeen(state.convo.recipientId);
        }
      }, { passive:true });

      el.msgList.addEventListener('click', onMessageListClick);
      document.addEventListener('click', onDocumentClick);
      document.addEventListener('click', onDocumentPopoverClick);

      document.addEventListener('click', e => {
        const item = e.target.closest('[data-user-item]');
        if (!item) return;
        applyConvo('private', item.dataset.uid, item.dataset.name, true);
      });

      window.addEventListener('resize', () => {
        if (!isMobile()) closeSidebar();
        resizeTA();
        closePopover();
      });

      window.addEventListener('beforeunload', () => {
        Object.values(state.subs).forEach(ch => ch && sb.removeChannel(ch));
        if (state.timers.presBeat) clearInterval(state.timers.presBeat);
        if (state.timers.presDecay) clearInterval(state.timers.presDecay);
      });
    }

    function setupActivity(){
      if (state.activityOn) return;
      state.activityOn = true;

      pingPresence();
      state.timers.presBeat = setInterval(pingPresence, PRESENCE_BEAT);
      state.timers.presDecay = setInterval(refreshPresence, 10000);

      ['visibilitychange','focus','click','keydown'].forEach(evt => {
        window.addEventListener(evt, () => {
          if (!document.hidden && state.user.name) pingPresence();
        }, { passive:true });
      });
    }

    // ── Boot ──────────────────────────────────────────────────────────────
    async function init(){
      initHistory();
      bindEvents();
      setupVisualViewport();
      updateHeader();
      updateCounter();
      resizeTA();

      if (!state.user.name) showModal();

      await loadPublic();
      await loadPrivate();
      renderContacts();
      await restoreConversation();

      subscribePublic();
      subscribePrivate();
      subscribePresence();
      subscribeTyping();
      subscribeReactions();

      if (state.user.name) setupActivity();
    }

    init().catch(err => {
      console.error('Init failed:', err);
      el.msgList.innerHTML = `
        <div class="system-row">
          <div class="system-card">Chat failed to initialize.</div>
        </div>
      `;
      setStatus('Initialization failed.', 'error');
    });
  })();
  </script>
</body>
</html>
