<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat — Colin Archive</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* Your existing styles – unchanged */
:root {
  --bg: #0d0d0d;
  --paper: #1a1a1a;
  --fg: #e8e8e8;
  --muted: #b8b8b8;
  --border: #2a2a2a;
  --highlight: rgba(31,31,31,0.85);
  --red: #ff6b6b;
  --blue: #4ecdc4;
  --green: #51cf66;
  --yellow: #ffe66d;
  --purple: #c084fc;
  --serif: 'Crimson Text', 'Georgia', serif;
  --mono: 'IBM Plex Mono', 'Courier New', monospace;
  --hand: 'Caveat', cursive;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--fg);
  font-family: var(--serif);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
header {
  padding: 1rem 2rem;
  border-bottom: 1px solid var(--border);
  background: var(--paper);
  display: flex;
  align-items: center;
  gap: 1.5rem;
  flex-shrink: 0;
  z-index: 10;
}
.logo {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 500;
  text-decoration: none;
  color: var(--fg);
}
.logo::after { content: '|'; color: var(--red); animation: blink 1s step-end infinite; margin-left: 2px; }
@keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
.header-label {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0.5;
}
.user-info {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-left: auto;
  background: var(--highlight);
  padding: 0.3rem 1rem;
  border-radius: 30px;
  border: 1px solid var(--border);
}
.user-name {
  font-family: var(--hand);
  font-size: 0.85rem;
  color: var(--blue);
  cursor: default;
}
.online-pill {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  color: var(--green);
}
.online-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.main-grid {
  display: grid;
  grid-template-columns: 280px 1fr;
  flex: 1;
  overflow: hidden;
}
.sidebar {
  background: var(--paper);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 1rem;
}
.sidebar-title {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.75rem;
  padding-bottom: 0.25rem;
  border-bottom: 1px solid var(--border);
}
.user-list {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.user-item {
  padding: 0.5rem;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  position: relative;
}
.user-item:hover {
  background: rgba(255,255,255,0.05);
}
.user-item.active {
  background: rgba(78,205,196,0.1);
  border-left: 2px solid var(--blue);
}
.user-avatar {
  width: 28px;
  height: 28px;
  background: var(--highlight);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--hand);
  font-size: 0.8rem;
  color: var(--fg);
}
.user-name {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--fg);
  flex: 1;
}
.user-status {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
}
.unread-badge {
  background: var(--red);
  color: white;
  font-size: 0.6rem;
  padding: 0.15rem 0.4rem;
  border-radius: 20px;
  margin-left: 0.5rem;
  font-family: var(--mono);
}
.chat-container {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.chat-header {
  padding: 1rem 2rem;
  border-bottom: 1px solid var(--border);
  font-family: var(--hand);
  font-size: 1.2rem;
  color: var(--blue);
  background: var(--paper);
  display: flex;
  align-items: center;
  gap: 1rem;
}
.chat-header i { margin-right: 0.5rem; }
.back-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 0.8rem;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  transition: color 0.2s;
}
.back-btn:hover { color: var(--blue); }
.message-list {
  flex: 1;
  overflow-y: auto;
  padding: 2rem 3rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.message-list::-webkit-scrollbar { width: 3px; }
.message-list::-webkit-scrollbar-track { background: transparent; }
.message-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.message {
  display: flex;
  gap: 0.8rem;
  align-items: flex-start;
}
.message-avatar {
  width: 36px;
  height: 36px;
  background: var(--highlight);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--hand);
  font-size: 1rem;
  color: var(--fg);
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.message-content {
  flex: 1;
  background: rgba(255,255,255,0.03);
  border-radius: 12px;
  padding: 0.6rem 1rem;
  border-left: 2px solid var(--blue);
  transition: border-color 0.2s;
}
.message.own .message-content {
  border-left-color: var(--purple);
}
.message-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 0.2rem;
}
.message-name {
  font-family: var(--hand);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--fg);
  cursor: pointer;
  transition: color 0.2s;
}
.message-name:hover {
  color: var(--blue);
  text-decoration: underline;
}
.message-time {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--muted);
  opacity: 0.6;
}
.message-text {
  font-size: 0.95rem;
  line-height: 1.5;
  color: var(--muted);
  word-break: break-word;
}
.message.system {
  justify-content: center;
}
.message.system .message-content {
  background: transparent;
  border-left: none;
  text-align: center;
  padding: 0.5rem;
}
.message.system .message-text {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--muted);
  opacity: 0.5;
  letter-spacing: 0.05em;
}
.input-area {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  padding: 1rem 2rem;
  background: var(--paper);
  display: flex;
  gap: 0.8rem;
  align-items: flex-end;
}
.message-input {
  flex: 1;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border);
  color: var(--fg);
  font-family: var(--serif);
  font-size: 1rem;
  padding: 0.6rem 0;
  resize: none;
  outline: none;
  transition: border-color 0.2s;
  line-height: 1.5;
  max-height: 100px;
}
.message-input:focus { border-bottom-color: var(--blue); }
.message-input::placeholder { color: var(--muted); opacity: 0.35; font-style: italic; }
.send-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 0.4rem 1rem;
  font-family: var(--mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
  flex-shrink: 0;
}
.send-btn:hover { border-color: var(--blue); color: var(--blue); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.modal.active { display: flex; }
.modal-content {
  background: var(--paper);
  border: 1px solid var(--border);
  padding: 2rem;
  max-width: 400px;
  width: 90%;
  border-radius: 12px;
  text-align: center;
}
.modal-content h3 {
  font-family: var(--mono);
  margin-bottom: 1rem;
  color: var(--blue);
}
.modal-content input {
  width: 100%;
  padding: 0.75rem;
  margin-bottom: 1rem;
  background: var(--highlight);
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: var(--serif);
  font-size: 1rem;
}
.modal-content button {
  padding: 0.5rem 1rem;
  background: var(--blue);
  border: none;
  color: #000;
  font-family: var(--mono);
  font-weight: bold;
  cursor: pointer;
  margin: 0.5rem;
}
.modal-content button.secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
}
.modal-content button:hover { opacity: 0.9; }
.modal .error {
  color: var(--red);
  font-size: 0.8rem;
  margin-top: 0.5rem;
}
@media (max-width: 700px) {
  .main-grid { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  header { padding: 0.8rem 1rem; }
  .message-list { padding: 1rem; }
  .input-area { padding: 0.8rem 1rem; }
}
</style>
</head>
<body>

<header>
  <a href="/" class="logo">Colin Archive</a>
  <span class="header-label">Chat</span>
  <div class="user-info" id="userInfo">
    <span class="user-name" id="displayName"></span>
  </div>
  <div class="online-pill">
    <span class="online-dot"></span>
    <span id="onlineNum">—</span>
  </div>
</header>

<div class="modal" id="nameModal">
  <div class="modal-content">
    <h3>Join the conversation</h3>
    <input type="text" id="guestName" placeholder="Your name" maxlength="30" autocomplete="off">
    <div>
      <button id="joinGuestBtn">Join as guest</button>
      <button id="signinBtn" class="secondary">Sign in (coming soon)</button>
    </div>
    <div id="nameError" class="error"></div>
  </div>
</div>

<div class="main-grid">
  <aside class="sidebar">
    <div class="sidebar-title">Private conversations</div>
    <div class="user-list" id="userList">
      <div style="padding:0.5rem; color:var(--muted);">Loading...</div>
    </div>
  </aside>
  <div class="chat-container">
    <div class="chat-header">
      <i class="fas fa-comments"></i> <span id="chatTitle">Public room</span>
      <button id="backToPublicBtn" class="back-btn" style="display: none;">← Back to public</button>
    </div>
    <div class="message-list" id="messageList">
      <div class="message system"><div class="message-content"><div class="message-text">Loading messages…</div></div></div>
    </div>
    <div class="input-area">
      <textarea id="messageInput" class="message-input" placeholder="Type a message…" rows="1" maxlength="500"></textarea>
      <button id="sendBtn" class="send-btn">Send</button>
    </div>
  </div>
</div>

<script>
(function() {
  const supabase = window.supabase.createClient(
    "https://lbpkgvmxxcubzbzwoswd.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicGtndm14eGN1Ynpiendvc3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNzM2OTQsImV4cCI6MjA4Njg0OTY5NH0.BaP0JY9v74qJPu9qRYoL1Mn3NWM3I-VB51dczOvxnrI"
  );

  const room = 'general';
  const messageList = document.getElementById('messageList');
  const msgInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const onlineNum = document.getElementById('onlineNum');
  const displayNameSpan = document.getElementById('displayName');
  const userListDiv = document.getElementById('userList');
  const chatTitleSpan = document.getElementById('chatTitle');
  const backToPublicBtn = document.getElementById('backToPublicBtn');

  // ---------- Identity ----------
  let currentUserName = localStorage.getItem('chatUserName');
  const nameModal = document.getElementById('nameModal');
  const guestNameInput = document.getElementById('guestName');
  const joinGuestBtn = document.getElementById('joinGuestBtn');
  const signinBtn = document.getElementById('signinBtn');
  const nameError = document.getElementById('nameError');

  function setUserName(name) {
    currentUserName = name.trim();
    localStorage.setItem('chatUserName', currentUserName);
    displayNameSpan.textContent = currentUserName;
    nameModal.classList.remove('active');
    initChatAfterAuth();
  }

  function showNameModal() {
    nameModal.classList.add('active');
    guestNameInput.focus();
  }

  joinGuestBtn.addEventListener('click', () => {
    const name = guestNameInput.value.trim();
    if (!name) {
      nameError.textContent = 'Please enter a name';
      return;
    }
    setUserName(name);
  });

  signinBtn.addEventListener('click', () => {
    alert('Sign in with email will be available soon. For now, use guest mode.');
  });

  if (currentUserName) {
    displayNameSpan.textContent = currentUserName;
    nameModal.classList.remove('active');
  } else {
    showNameModal();
  }

  // Helper functions
  function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
  function formatTime(iso) {
    const d = new Date(iso), now = new Date(), diff = now - d, s = diff / 1000;
    if (s < 60) return 'just now';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    const day = Math.floor(h / 24);
    if (day === 1) return 'yesterday';
    if (day < 7) return day + ' days ago';
    return d.toLocaleDateString();
  }

  let stickToBottom = true;
  const messageListEl = messageList;
  messageListEl.addEventListener('scroll', () => {
    const threshold = 60;
    stickToBottom = messageListEl.scrollHeight - messageListEl.scrollTop - messageListEl.clientHeight < threshold;
  });
  function scrollBottom(force = false) {
    if (force || stickToBottom) messageListEl.scrollTop = messageListEl.scrollHeight;
  }

  // State: current conversation
  let currentConversation = { type: 'public', recipient: null };

  // Render messages from an array (public or private)
  function renderMessages(messages, isPrivate = false) {
    if (!messages.length) {
      messageListEl.innerHTML = '<div class="message system"><div class="message-content"><div class="message-text">No messages yet. Start the conversation.</div></div></div>';
      return;
    }
    const html = messages.map(msg => {
      const name = msg.sender || msg.name;
      const ownClass = (name === currentUserName) ? 'own' : '';
      const initial = name.charAt(0).toUpperCase();
      const body = msg.body || msg.text;
      const time = formatTime(msg.created_at);
      return `
        <div class="message ${ownClass}">
          <div class="message-avatar">${esc(initial)}</div>
          <div class="message-content">
            <div class="message-header">
              <span class="message-name" data-name="${esc(name)}">${esc(name)}</span>
              <span class="message-time">${time}</span>
            </div>
            <div class="message-text">${esc(body)}</div>
          </div>
        </div>
      `;
    }).join('');
    messageListEl.innerHTML = html;
    attachNameClickHandlers();
    scrollBottom(true);
  }

  // Public messages
  let publicMessages = [];
  async function loadPublicMessages() {
    const { data, error } = await supabase
      .from('messages')
      .select('*')
      .eq('room', room)
      .order('created_at', { ascending: true })
      .limit(100);
    if (error) { console.error(error); return; }
    publicMessages = data || [];
    if (currentConversation.type === 'public') {
      renderMessages(publicMessages);
    }
  }

  // Subscribe to public room
  let publicSubscription = null;
  function subscribePublic() {
    if (publicSubscription) publicSubscription.unsubscribe();
    publicSubscription = supabase
      .channel(`public:${room}`)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room=eq.${room}` }, payload => {
        publicMessages.push(payload.new);
        if (currentConversation.type === 'public') {
          renderMessages(publicMessages);
        }
      })
      .subscribe();
  }

  // ---------- PRIVATE MESSAGING – new sidebar based on private conversations ----------
  let privateMessagesCache = {};
  let privateSubscription = null;
  let contacts = new Map(); // key: other username, value: { lastMessageTime, unreadCount }

  async function loadPrivateMessages(recipient = null) {
    const { data, error } = await supabase
      .from('private_messages')
      .select('*')
      .or(`sender.eq.${currentUserName},recipient.eq.${currentUserName}`)
      .order('created_at', { ascending: true })
      .limit(200);
    if (error) { console.error(error); return; }
    const grouped = {};
    data.forEach(msg => {
      const other = msg.sender === currentUserName ? msg.recipient : msg.sender;
      if (!grouped[other]) grouped[other] = [];
      grouped[other].push(msg);
      // Update contacts with last message time
      const msgTime = new Date(msg.created_at);
      if (!contacts.has(other) || msgTime > contacts.get(other).lastMessageTime) {
        contacts.set(other, {
          lastMessageTime: msgTime,
          unreadCount: (contacts.get(other)?.unreadCount || 0)
        });
      }
    });
    privateMessagesCache = grouped;
    // After loading, if we are in a private chat, reset its unread count
    if (currentConversation.type === 'private' && currentConversation.recipient) {
      if (contacts.has(currentConversation.recipient)) {
        contacts.get(currentConversation.recipient).unreadCount = 0;
      }
      const messages = privateMessagesCache[currentConversation.recipient] || [];
      renderMessages(messages, true);
    }
    renderContactList(); // rebuild sidebar
  }

  function subscribePrivate() {
    if (privateSubscription) privateSubscription.unsubscribe();
    const channelName = `private:${currentUserName}`;
    privateSubscription = supabase
      .channel(channelName)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'private_messages' }, payload => {
        const newMsg = payload.new;
        if (newMsg.sender === currentUserName || newMsg.recipient === currentUserName) {
          const other = newMsg.sender === currentUserName ? newMsg.recipient : newMsg.sender;
          if (!privateMessagesCache[other]) privateMessagesCache[other] = [];
          privateMessagesCache[other].push(newMsg);
          // Update contacts
          const msgTime = new Date(newMsg.created_at);
          if (!contacts.has(other) || msgTime > contacts.get(other).lastMessageTime) {
            contacts.set(other, {
              lastMessageTime: msgTime,
              unreadCount: (contacts.get(other)?.unreadCount || 0)
            });
          }
          // If the message is from someone else and we're not in that chat, increment unread
          if (newMsg.sender !== currentUserName && !(currentConversation.type === 'private' && currentConversation.recipient === other)) {
            const contact = contacts.get(other);
            if (contact) contact.unreadCount = (contact.unreadCount || 0) + 1;
          }
          // If we are in that chat, render immediately
          if (currentConversation.type === 'private' && currentConversation.recipient === other) {
            renderMessages(privateMessagesCache[other], true);
          }
          renderContactList(); // update sidebar badges
        }
      })
      .subscribe();
  }

  // Build sidebar from contacts, sorted by most recent message
  function renderContactList() {
    const sorted = Array.from(contacts.entries())
      .sort((a, b) => b[1].lastMessageTime - a[1].lastMessageTime)
      .map(([name, data]) => ({ name, unreadCount: data.unreadCount }));
    if (sorted.length === 0) {
      userListDiv.innerHTML = '<div style="padding:0.5rem; color:var(--muted);">No private conversations yet.<br>Click a name in the public chat to start one.</div>';
      return;
    }
    const html = sorted.map(contact => {
      const unreadBadge = contact.unreadCount > 0 ? `<span class="unread-badge">${contact.unreadCount}</span>` : '';
      return `
        <div class="user-item" data-name="${esc(contact.name)}">
          <div class="user-avatar">${contact.name.charAt(0).toUpperCase()}</div>
          <span class="user-name">${esc(contact.name)}</span>
          <span class="user-status"></span>
          ${unreadBadge}
        </div>
      `;
    }).join('');
    userListDiv.innerHTML = html;
    attachSidebarHandlers();
    // Highlight active contact if in private chat
    if (currentConversation.type === 'private') {
      document.querySelectorAll('.user-item').forEach(el => {
        if (el.dataset.name === currentConversation.recipient) el.classList.add('active');
        else el.classList.remove('active');
      });
    } else {
      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
    }
  }

  // Start a private chat – also ensures contact exists
  async function startPrivateChat(recipient) {
    if (recipient === currentUserName) return;
    // Ensure contact exists with at least a dummy entry (will be updated when messages load)
    if (!contacts.has(recipient)) {
      contacts.set(recipient, { lastMessageTime: new Date(), unreadCount: 0 });
    }
    // Reset unread for this contact
    contacts.get(recipient).unreadCount = 0;
    renderContactList();

    currentConversation = { type: 'private', recipient };
    chatTitleSpan.innerHTML = `<i class="fas fa-user"></i> ${esc(recipient)}`;
    backToPublicBtn.style.display = 'inline-block';
    await loadPrivateMessages(recipient);
    const messages = privateMessagesCache[recipient] || [];
    renderMessages(messages, true);
    // Highlight in sidebar
    document.querySelectorAll('.user-item').forEach(el => {
      if (el.dataset.name === recipient) el.classList.add('active');
      else el.classList.remove('active');
    });
    localStorage.setItem('chatConversation', JSON.stringify(currentConversation));
  }

  function backToPublic() {
    currentConversation = { type: 'public', recipient: null };
    chatTitleSpan.innerHTML = '<i class="fas fa-comments"></i> Public room';
    backToPublicBtn.style.display = 'none';
    renderMessages(publicMessages);
    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
    localStorage.removeItem('chatConversation');
  }

  // Click handlers for names (both in messages and sidebar)
  function attachNameClickHandlers() {
    document.querySelectorAll('.message-name').forEach(el => {
      el.removeEventListener('click', handleMessageNameClick);
      el.addEventListener('click', handleMessageNameClick);
    });
  }
  function handleMessageNameClick(e) {
    e.stopPropagation();
    const name = e.currentTarget.getAttribute('data-name');
    if (name && name !== currentUserName) {
      startPrivateChat(name);
    }
  }
  function attachSidebarHandlers() {
    document.querySelectorAll('.user-item').forEach(el => {
      el.removeEventListener('click', handleSidebarClick);
      el.addEventListener('click', handleSidebarClick);
    });
  }
  function handleSidebarClick(e) {
    const recipient = this.dataset.name;
    if (recipient !== currentUserName) startPrivateChat(recipient);
  }

  // Send message
  async function send() {
    const body = msgInput.value.trim();
    if (!body) return;
    sendBtn.disabled = true;
    msgInput.value = '';
    msgInput.style.height = 'auto';
    let error;
    if (currentConversation.type === 'public') {
      const { error: e } = await supabase.from('messages').insert({ name: currentUserName, body, room });
      error = e;
    } else {
      const recipient = currentConversation.recipient;
      const { error: e } = await supabase.from('private_messages').insert({ sender: currentUserName, recipient, body });
      error = e;
    }
    if (error) console.error('Send failed:', error);
    sendBtn.disabled = false;
    msgInput.focus();
  }

  // Presence (unchanged)
  let presenceChannel = null;
  function initPresence() {
    if (presenceChannel) presenceChannel.unsubscribe();
    const presenceKey = Math.random().toString(36).slice(2);
    presenceChannel = supabase.channel('presence:chat-global', { config: { presence: { key: presenceKey } } });
    presenceChannel
      .on('presence', { event: 'sync' }, () => {
        const count = Object.keys(presenceChannel.presenceState()).length;
        onlineNum.textContent = count + (count === 1 ? ' online' : ' online');
      })
      .subscribe(async s => {
        if (s === 'SUBSCRIBED') await presenceChannel.track({ at: Date.now() });
      });
  }

  // Initialize after name is set
  async function initChatAfterAuth() {
    await loadPublicMessages();
    subscribePublic();
    await loadPrivateMessages(); // this also builds contacts
    subscribePrivate();

    initPresence();

    sendBtn.addEventListener('click', send);
    msgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    msgInput.addEventListener('input', () => {
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
    });
    backToPublicBtn.addEventListener('click', backToPublic);

    // Restore previous private conversation if any
    const saved = localStorage.getItem('chatConversation');
    if (saved) {
      try {
        const conv = JSON.parse(saved);
        if (conv.type === 'private' && conv.recipient && conv.recipient !== currentUserName) {
          // Ensure contact exists (it will be created when loading)
          if (!contacts.has(conv.recipient)) {
            contacts.set(conv.recipient, { lastMessageTime: new Date(), unreadCount: 0 });
          }
          currentConversation = conv;
          await loadPrivateMessages(conv.recipient);
          const messages = privateMessagesCache[conv.recipient] || [];
          renderMessages(messages, true);
          chatTitleSpan.innerHTML = `<i class="fas fa-user"></i> ${esc(conv.recipient)}`;
          backToPublicBtn.style.display = 'inline-block';
          renderContactList(); // ensure sidebar shows it
          document.querySelectorAll('.user-item').forEach(el => {
            if (el.dataset.name === conv.recipient) el.classList.add('active');
          });
          return;
        }
      } catch(e) {}
    }
    // Default to public
    currentConversation = { type: 'public', recipient: null };
    renderMessages(publicMessages);
    renderContactList(); // show any contacts that might exist
  }

  if (currentUserName) {
    initChatAfterAuth();
  }
})();
</script>
</body>
</html>
