<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chat | Colin Archive</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --paper: #171717;
      --surface: rgba(255,255,255,0.035);
      --surface-2: rgba(255,255,255,0.055);
      --fg: #ececec;
      --muted: #aaaaaa;
      --soft: #7f7f7f;
      --border: #2b2b2b;
      --red: #ff6b6b;
      --blue: #4ecdc4;
      --green: #51cf66;
      --amber: #ffc857;
      --violet: #c084fc;
      --shadow: 0 18px 50px rgba(0,0,0,0.25);
      --serif: 'Crimson Text', Georgia, serif;
      --mono: 'IBM Plex Mono', 'Courier New', monospace;
      --hand: 'Caveat', cursive;
      --header-h: 78px;
      --sidebar-w: 300px;
      --ease-out: cubic-bezier(.22,1,.36,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--paper); }
    body {
      color: var(--fg);
      font-family: var(--serif);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(78,205,196,0.045), transparent 28%),
        linear-gradient(to bottom, #151515, #111111);
    }
    button, input, textarea { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }

    .shell-header {
      min-height: var(--header-h);
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      background: rgba(23,23,23,0.94);
      backdrop-filter: blur(10px);
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);
      align-items: center;
      gap: 0.9rem;
      flex-shrink: 0;
      z-index: 20;
    }
    .header-left { display: flex; align-items: center; gap: 0.6rem; justify-self: start; }
    .logo {
      font-family: var(--mono);
      font-size: 0.76rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .logo::after { content: '|'; color: var(--red); margin-left: 2px; animation: blink 1s step-end infinite; }
    @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border: 1px solid rgba(78,205,196,0.45);
      background: rgba(78,205,196,0.14);
      color: var(--blue);
      border-radius: 999px;
      padding: 0.58rem 0.95rem;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color 0.18s, color 0.18s, background 0.18s, transform 0.18s;
    }
    .back-btn:hover { border-color: rgba(78,205,196,0.78); color: #88eee5; background: rgba(78,205,196,0.2); transform: translateY(-1px); }

    .header-room {
      min-width: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      justify-self: center;
    }
    .header-room-title {
      font-family: var(--hand);
      font-size: 1.16rem;
      color: var(--blue);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .header-room-subtitle {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      transition: color 0.18s;
    }
    .header-room-subtitle.typing { color: var(--blue); }
    .header-right { display:flex; justify-content:flex-end; justify-self:end; }

    .app-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0,1fr);
      overflow: hidden;
      height: calc(100dvh - var(--header-h));
    }

    .sidebar {
      min-height: 0;
      border-right: 1px solid var(--border);
      background: rgba(20,20,20,0.9);
      display: flex;
      flex-direction: column;
    }
    .sidebar-top { padding: 1rem 1rem 0.8rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .sidebar-title-row { display:flex; align-items:center; justify-content:space-between; gap:0.6rem; margin-bottom:0.75rem; }
    .sidebar-title, .presence-summary {
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .sidebar-title { font-size: 0.68rem; color: var(--muted); }
    .presence-summary { font-size: 0.6rem; color: var(--soft); }
    .sidebar-search {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      padding: 0.7rem 0.85rem;
      border-radius: 999px;
      outline: none;
      font-family: var(--mono);
      font-size: 0.75rem;
      transition: border-color 0.18s, background 0.18s;
    }
    .sidebar-search:focus { border-color: rgba(78,205,196,0.6); background: var(--surface-2); }
    .sidebar-search::placeholder { color: var(--soft); }
    .sidebar-body { min-height:0; overflow-y:auto; padding:0.8rem; }
    .sidebar-body::-webkit-scrollbar, .message-list::-webkit-scrollbar { width:4px; }
    .sidebar-body::-webkit-scrollbar-thumb, .message-list::-webkit-scrollbar-thumb { background:#343434; border-radius:999px; }
    .sidebar-section-label {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--soft);
      margin: 0.35rem 0 0.6rem;
      padding: 0 0.35rem;
    }

    .user-list { display:flex; flex-direction:column; gap:0.3rem; }
    .user-item {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 14px;
      padding: 0.7rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      cursor: pointer;
      text-align: left;
      color: inherit;
      transition: background 0.16s, border-color 0.16s, transform 0.16s;
    }
    .user-item:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .user-item.active { background: rgba(78,205,196,0.09); border-color: rgba(78,205,196,0.3); }
    .user-avatar-wrap { position:relative; width:36px; height:36px; flex-shrink:0; }
    .user-avatar, .message-avatar {
      border-radius: 50%;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--hand);
      color: var(--fg);
    }
    .user-avatar { width:36px; height:36px; font-size:1.05rem; }
    .presence-dot {
      position:absolute; right:-1px; bottom:-1px;
      width:10px; height:10px; border-radius:50%;
      background:#3a3a3a; border:2px solid rgba(20,20,20,0.98);
      transition:background 0.2s;
    }
    .presence-dot.online { background: var(--green); }
    .sidebar-user-main { min-width:0; flex:1; }
    .sidebar-user-top { display:flex; align-items:baseline; justify-content:space-between; gap:0.4rem; margin-bottom:0.18rem; }
    .sidebar-user-name, .sidebar-user-time, .sidebar-user-sub {
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-user-name { font-size:0.74rem; color:var(--fg); }
    .sidebar-user-time { font-size:0.58rem; color:var(--soft); flex-shrink:0; }
    .sidebar-user-sub { display:block; font-size:0.62rem; color:var(--soft); }
    .sidebar-user-sub.has-unread { color: #d7f8f5; }
    .sidebar-user-sub.is-typing { color: var(--blue); }
    .unread-badge {
      background: var(--red);
      color: #fff;
      font-size: 0.58rem;
      min-width: 1.15rem;
      height: 1.15rem;
      padding: 0 0.3rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      flex-shrink: 0;
    }

    .chat-shell { min-width:0; min-height:0; display:flex; flex-direction:column; }
    .chat-main {
      min-height:0;
      display:flex;
      flex-direction:column;
      flex:1;
      height:100%;
      transition: background 0.25s;
    }
    .chat-main.is-private { background: radial-gradient(ellipse at top right, rgba(192,132,252,0.055) 0%, transparent 55%), rgba(0,0,0,0.12); }

    .message-list {
      flex:1;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      padding:1rem clamp(0.9rem,3vw,2rem) 0.9rem;
      display:flex;
      flex-direction:column;
      gap:0.82rem;
      scroll-behavior:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
    }
    .message-list::after { content:''; display:block; min-height:1px; }
    .day-divider {
      align-self:center;
      font-family:var(--mono);
      font-size:0.6rem;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:var(--soft);
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.04);
      border-radius:999px;
      padding:0.26rem 0.65rem;
      margin:0.1rem 0 0.2rem;
    }

    .message-row {
      display:flex;
      gap:0.75rem;
      align-items:flex-start;
      max-width:880px;
      width:100%;
      animation: msgIn 180ms var(--ease-out) both;
    }
    .message-row.own { align-self:flex-end; flex-direction:row-reverse; }
    .message-row.is-pending .message-bubble { opacity:0.68; }
    .message-row.is-failed .message-bubble { border-left-color: rgba(255,107,107,0.8) !important; }
    @keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    .message-avatar { width:36px; height:36px; font-size:0.95rem; flex-shrink:0; }
    .message-stack { min-width:0; max-width:min(100%,720px); display:flex; flex-direction:column; gap:0.28rem; }
    .message-bubble {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.045);
      border-left: 2px solid rgba(78,205,196,0.55);
      border-radius: 14px;
      padding: 0.65rem 0.88rem 0.7rem;
      box-shadow: var(--shadow);
      contain: layout paint;
      cursor: pointer;
      transition: border-color 0.16s, background 0.16s, transform 0.16s;
    }
    .message-bubble:hover { transform: translateY(-1px); }
    .message-row.own .message-bubble { border-left-color: rgba(192,132,252,0.65); background: rgba(192,132,252,0.045); }
    .message-header { display:flex; justify-content:space-between; align-items:flex-start; gap:0.75rem; margin-bottom:0.22rem; }
    .message-name {
      border:none;
      background:none;
      color:var(--fg);
      font-family:var(--hand);
      font-size:0.98rem;
      font-weight:600;
      line-height:1;
      padding:0;
      pointer-events:none;
    }
    .message-time { font-family:var(--mono); font-size:0.6rem; color:var(--soft); white-space:nowrap; flex-shrink:0; }
    .message-text { font-size:0.98rem; line-height:1.55; color:#d2d2d2; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere; }
    .message-text.deleted { color:var(--soft); font-style:italic; }

    .message-status {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--soft);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0 0.1rem;
      min-height: 0.9rem;
    }
    .message-row.own .message-status { justify-content:flex-end; }
    .message-status.st-sending { color: var(--amber); }
    .message-status.st-delivered { color: var(--soft); }
    .message-status.st-seen { color: var(--blue); }
    .message-status.st-failed { color: var(--red); }

    .message-actions {
      display:flex;
      gap:0.3rem;
      flex-wrap:wrap;
      padding:0 0.1rem;
      max-height:0;
      opacity:0;
      overflow:hidden;
      pointer-events:none;
      transition:max-height 0.18s ease, opacity 0.15s ease;
    }
    .message-row.row-active .message-actions {
      max-height:56px;
      opacity:1;
      pointer-events:auto;
    }
    .action-btn {
      display:inline-flex;
      align-items:center;
      gap:0.35rem;
      border:1px solid rgba(255,255,255,0.07);
      background:rgba(255,255,255,0.04);
      color:var(--muted);
      border-radius:999px;
      padding:0.32rem 0.72rem;
      font-family:var(--mono);
      font-size:0.62rem;
      letter-spacing:0.06em;
      text-transform:uppercase;
      cursor:pointer;
      transition:background 0.14s, border-color 0.14s, color 0.14s, transform 0.14s;
      white-space:nowrap;
    }
    .action-btn:hover { background:rgba(255,255,255,0.07); border-color:rgba(255,255,255,0.12); color:var(--fg); transform:translateY(-1px); }
    .action-btn.danger:hover { background:rgba(255,107,107,0.09); border-color:rgba(255,107,107,0.25); color:#ffd4d4; }
    .action-btn.primary { border-color:rgba(78,205,196,0.3); color:var(--blue); background:rgba(78,205,196,0.06); }
    .action-btn.primary:hover { background:rgba(78,205,196,0.12); border-color:rgba(78,205,196,0.5); color:#88eee5; }

    .system-row { align-self:center; max-width:720px; width:100%; }
    .system-card {
      background:transparent; border:1px dashed rgba(255,255,255,0.07); border-radius:18px;
      text-align:center; padding:1.4rem 1rem; color:var(--soft); font-family:var(--mono); font-size:0.68rem; letter-spacing:0.05em;
    }
    .empty-icon { font-size:1.3rem; margin-bottom:0.55rem; opacity:0.7; }
    .empty-title { font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:0.5rem; }
    .empty-hint { font-family:var(--serif); font-size:0.95rem; color:var(--soft); line-height:1.6; max-width:38ch; margin:0 auto; }

    .typing-row { align-self:flex-start; }
    .typing-bubble {
      display:inline-flex; align-items:center; gap:0.5rem;
      background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.05);
      border-left:2px solid rgba(78,205,196,0.4); border-radius:14px; padding:0.55rem 0.88rem;
      animation: msgIn 160ms var(--ease-out) both;
    }
    .typing-label { font-family:var(--mono); font-size:0.62rem; color:var(--soft); }
    .typing-dots { display:inline-flex; gap:3px; align-items:center; }
    .typing-dots span {
      display:block; width:5px; height:5px; border-radius:50%; background:var(--blue);
      animation: dotBounce 1.05s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay:0.16s; }
    .typing-dots span:nth-child(3) { animation-delay:0.32s; }
    @keyframes dotBounce { 0%,60%,100% { transform:translateY(0); opacity:0.4; } 30% { transform:translateY(-4px); opacity:1; } }

    .composer-wrap {
      flex-shrink:0; width:100%; padding:0.8rem 0.9rem 0.9rem;
      border-top:1px solid var(--border); background:rgba(19,19,19,0.95); backdrop-filter:blur(10px);
    }
    .composer-status { min-height:0; padding:0 0.15rem 0.42rem; font-family:var(--mono); font-size:0.64rem; letter-spacing:0.04em; color:var(--soft); }
    .composer-status:empty { display:none; }
    .composer-status.error { color:var(--red); }
    .composer-status.success { color:var(--green); }
    .composer { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:0.65rem; align-items:end; }
    .message-input {
      width:100%; min-height:54px; max-height:140px; resize:none; overflow-y:hidden; overflow-x:hidden; scrollbar-width:none;
      border:1px solid var(--border); border-radius:16px; background:rgba(255,255,255,0.03); color:var(--fg); padding:0.9rem 1rem;
      outline:none; line-height:1.5; -webkit-appearance:none; appearance:none;
      transition:border-color 0.18s,background 0.18s,box-shadow 0.18s;
    }
    .message-input::-webkit-scrollbar { width:0; height:0; }
    .message-input:focus { border-color:rgba(78,205,196,0.5); background:rgba(255,255,255,0.04); box-shadow:0 0 0 3px rgba(78,205,196,0.07); }
    .message-input::placeholder { color:var(--soft); font-style:italic; }
    .send-btn {
      min-width:110px; height:54px; border:1px solid var(--border); background:rgba(78,205,196,0.05); color:var(--blue); border-radius:999px; cursor:pointer;
      font-family:var(--mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.12em; display:inline-flex; align-items:center; justify-content:center; gap:0.45rem; padding:0 1.1rem; flex-shrink:0;
      transition:border-color 0.18s,color 0.18s,background 0.18s,transform 0.18s;
    }
    .send-btn:hover:not(:disabled) { border-color:rgba(78,205,196,0.6); background:rgba(78,205,196,0.1); transform:translateY(-1px); }
    .send-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
    .helper-line { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:0.5rem 0.2rem 0; color:var(--soft); font-family:var(--mono); font-size:0.62rem; }

    .mobile-inbox-btn {
      display:none; width:40px; height:40px; border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--muted); border-radius:50%; cursor:pointer;
      align-items:center; justify-content:center; flex-shrink:0; position:relative; transition:border-color 0.18s,color 0.18s,background 0.18s;
    }
    .mobile-inbox-btn:hover { border-color:rgba(78,205,196,0.5); color:var(--blue); background:rgba(78,205,196,0.05); }
    .mobile-inbox-dot { position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--red); box-shadow:0 0 0 2px rgba(23,23,23,0.95); display:none; }
    .mobile-inbox-btn.has-unread .mobile-inbox-dot { display:block; }
    .mobile-sidebar {
      display:none; position:fixed; top:var(--header-h); left:0; bottom:0; width:min(88vw,340px); background:rgba(23,23,23,0.98); border-right:1px solid var(--border);
      z-index:50; transform:translateX(-100%); transition:transform 0.22s ease; flex-direction:column; backdrop-filter:blur(10px);
    }
    .mobile-sidebar.active { transform:translateX(0); }
    .mobile-sidebar .sidebar-top { padding-top:0.95rem; background:transparent; }
    .mobile-sidebar .sidebar-body { flex:1; }

    .modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.78); z-index:100; padding:1rem; }
    .modal.active { display:flex; }
    .modal-content { width:min(420px,100%); background:linear-gradient(to bottom,#1a1a1a,#151515); border:1px solid var(--border); border-radius:18px; padding:1.4rem; box-shadow:var(--shadow); }
    .modal-title { color:var(--blue); font-family:var(--mono); font-size:0.84rem; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:0.55rem; }
    .modal-copy { color:var(--muted); line-height:1.45; margin-bottom:1rem; font-size:1rem; }
    .modal-input { width:100%; border:1px solid var(--border); background:var(--surface); color:var(--fg); border-radius:12px; padding:0.85rem 0.95rem; margin-bottom:0.85rem; outline:none; }
    .modal-input:focus { border-color:rgba(78,205,196,0.55); }
    .modal-actions { display:flex; flex-wrap:wrap; gap:0.65rem; }
    .modal-btn { border-radius:999px; padding:0.72rem 1rem; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; font-family:var(--mono); font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; }
    .modal-btn.primary { background:rgba(78,205,196,0.1); color:var(--blue); border-color:rgba(78,205,196,0.35); }
    .modal-error { min-height:1rem; color:var(--red); font-family:var(--mono); font-size:0.68rem; margin-top:0.8rem; }

    @media (max-width:920px) {
      html,body { height:100%; }
      body { min-height:100dvh; }
      .app-grid { grid-template-columns:1fr; min-height:0; height:calc(100dvh - var(--header-h)); }
      .chat-shell,.chat-main { min-height:0; }
      .sidebar { display:none; }
      .logo { display:none; }
      .mobile-inbox-btn { display:inline-flex; }
      .mobile-sidebar { display:flex; }
      .shell-header { grid-template-columns:auto 1fr auto; }
      .header-left { gap:0.45rem; }
    }
    @media (max-width:700px) {
      body { min-height:100dvh; overflow:auto; }
      .app-grid,.chat-shell,.chat-main { min-height:0; }
      .app-grid { overflow:visible; }
      .chat-main { display:flex; flex-direction:column; height:100%; }
      .message-list { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
      .composer-wrap { flex-shrink:0; position:sticky; bottom:0; z-index:5; background:rgba(19,19,19,0.98); padding-bottom:calc(0.72rem + env(safe-area-inset-bottom,0px)); }
      .message-input { font-size:16px; }
    }
    @media (max-width:640px) {
      .shell-header { padding:0.7rem 0.75rem; gap:0.55rem; }
      .back-btn { min-width:0; height:40px; padding:0 0.82rem; font-size:0.78rem; }
      .back-btn i { display:none; }
      .header-room-title { font-size:1rem; }
      .header-room-subtitle { font-size:0.56rem; max-width:170px; }
      .message-list { padding:0.85rem 0.72rem 0.8rem; gap:0.75rem; }
      .message-row { gap:0.5rem; }
      .message-avatar { width:30px; height:30px; font-size:0.85rem; }
      .message-bubble { padding:0.6rem 0.75rem 0.65rem; border-radius:12px; }
      .message-name { font-size:0.9rem; }
      .message-time { font-size:0.58rem; }
      .message-text { font-size:0.94rem; }
      .composer-wrap { padding:0.65rem 0.72rem calc(0.72rem + env(safe-area-inset-bottom,0px)); }
      .helper-line { display:none; }
      .composer { gap:0.5rem; }
      .message-input { min-height:46px; padding:0.76rem 0.88rem; border-radius:16px; font-size:16px; }
      .send-btn { width:46px; height:46px; min-width:46px; padding:0; border-radius:50%; font-size:0.9rem; }
      .send-btn .send-label { display:none; }
      .mobile-sidebar { width:min(92vw,340px); }
    }
  </style>
</head>
<body>
  <header class="shell-header">
    <div class="header-left">
      <a href="/" class="logo">Colin Archive</a>
      <button id="mobileInboxBtn" class="mobile-inbox-btn" type="button" aria-label="Open inbox">
        <i class="fas fa-bars"></i>
        <span class="mobile-inbox-dot"></span>
      </button>
    </div>
    <div class="header-room">
      <div id="chatTitle" class="header-room-title">Public room</div>
      <div id="chatSubtitle" class="header-room-subtitle">Everyone can read this room</div>
    </div>
    <div class="header-right">
      <button id="backToPublicBtn" class="back-btn hidden" type="button">
        <i class="fas fa-arrow-left"></i>
        <span class="back-label">Back</span>
      </button>
    </div>
  </header>

  <aside id="mobileSidebar" class="mobile-sidebar" aria-hidden="true">
    <div class="sidebar-top">
      <div class="sidebar-title-row">
        <div class="sidebar-title">Conversations</div>
        <div id="mobPresenceSummary" class="presence-summary"></div>
      </div>
      <input id="mobileSidebarSearch" class="sidebar-search" type="text" placeholder="Search" autocomplete="off" />
    </div>
    <div class="sidebar-body">
      <div class="sidebar-section-label">Inbox</div>
      <div id="mobileUserList" class="user-list"><div class="system-card">Loading...</div></div>
    </div>
  </aside>

  <div class="modal" id="nameModal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-title">Join the conversation</div>
      <p class="modal-copy">Pick a display name. It should be something people will actually recognise.</p>
      <input id="guestName" class="modal-input" type="text" placeholder="Your display name" maxlength="30" autocomplete="off" />
      <div class="modal-actions">
        <button id="joinGuestBtn" class="modal-btn primary">Join as guest</button>
        <button id="clearSessionBtn" class="modal-btn">Reset session</button>
      </div>
      <div id="nameError" class="modal-error"></div>
    </div>
  </div>

  <div class="app-grid">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-title-row">
          <div class="sidebar-title">Conversations</div>
          <div id="deskPresenceSummary" class="presence-summary"></div>
        </div>
        <input id="sidebarSearch" class="sidebar-search" type="text" placeholder="Search" autocomplete="off" />
      </div>
      <div class="sidebar-body">
        <div class="sidebar-section-label">Inbox</div>
        <div id="userList" class="user-list"><div class="system-card">Loading...</div></div>
      </div>
    </aside>

    <main class="chat-shell">
      <div id="chatMain" class="chat-main">
        <div id="messageList" class="message-list" aria-live="polite">
          <div class="system-row"><div class="system-card">Loading messages...</div></div>
        </div>
        <div class="composer-wrap">
          <div id="composerStatus" class="composer-status"></div>
          <div class="composer">
            <textarea id="messageInput" class="message-input" rows="1" maxlength="500" placeholder="Type a message..."></textarea>
            <button id="sendBtn" class="send-btn" type="button" aria-label="Send message">
              <i class="fas fa-paper-plane"></i>
              <span class="send-label">Send</span>
            </button>
          </div>
          <div class="helper-line">
            <span>Enter to send · Shift+Enter for new line</span>
            <span id="charCounter">0 / 500</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
  (function () {
    'use strict';

    const SUPABASE_URL = 'https://lbpkgvmxxcubzbzwoswd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicGtndm14eGN1Ynpiendvc3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNzM2OTQsImV4cCI6MjA4Njg0OTY5NH0.BaP0JY9v74qJPu9qRYoL1Mn3NWM3I-VB51dczOvxnrI';
    const PUBLIC_ROOM = 'general';
    const STORAGE = { userId:'colinChatUserId', userName:'colinChatUserName', convo:'colinChatConversation' };
    const COOLDOWN_MS = 900;
    const NEAR_BOTTOM = 88;
    const MAX_TA_H = 140;
    const TYPING_EXPIRE_MS = 3000;
    const TYPING_THROTTLE_MS = 700;
    const PRESENCE_EXPIRE_MS = 35000;
    const PRESENCE_HEARTBEAT_MS = 12000;

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = id => document.getElementById(id);
    const now = () => new Date().toISOString();
    const esc = v => String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    const normName = v => String(v || '').replace(/\s+/g, ' ').replace(/[\u200B-\u200D\uFEFF]/g, '').trim().slice(0,30);
    const initial = n => { const c = normName(n); return c ? c[0].toUpperCase() : '?'; };
    const isMobile = () => window.innerWidth <= 920;
    const dmKey = (a, b) => [a, b].sort().join('__');

    const timeFmt = new Intl.DateTimeFormat(undefined, { hour:'2-digit', minute:'2-digit' });
    const dateFmt = new Intl.DateTimeFormat(undefined, { month:'short', day:'numeric', year:'numeric' });

    const el = {
      nameModal: $('nameModal'),
      guestName: $('guestName'),
      joinBtn: $('joinGuestBtn'),
      clearBtn: $('clearSessionBtn'),
      nameErr: $('nameError'),
      userList: $('userList'),
      mobileList: $('mobileUserList'),
      sideSearch: $('sidebarSearch'),
      mobSearch: $('mobileSidebarSearch'),
      inboxBtn: $('mobileInboxBtn'),
      mobSide: $('mobileSidebar'),
      chatTitle: $('chatTitle'),
      chatSub: $('chatSubtitle'),
      backBtn: $('backToPublicBtn'),
      msgList: $('messageList'),
      msgInput: $('messageInput'),
      sendBtn: $('sendBtn'),
      status: $('composerStatus'),
      counter: $('charCounter'),
      deskPresence: $('deskPresenceSummary'),
      mobPresence: $('mobPresenceSummary'),
      chatMain: $('chatMain')
    };

    const state = {
      inited: false,
      activityStarted: false,
      convo: { type:'public', recipientId:null },
      user: { id:getOrCreateId(), name:normName(localStorage.getItem(STORAGE.userName) || '') },
      pubMsgs: [],
      privMsgs: {},
      contacts: new Map(),
      lastSendAt: 0,
      searchTerm: '',
      sideOpen: false,
      stickBottom: true,
      raf: null,
      activeRowId: null,
      lastTypingSentAt: 0,
      presenceBeat: null,
      presenceDecayBeat: null,
      presenceMap: new Map(),
      subs: { pub:null, privIns:null, privUpd:null, presence:null, typing:null }
    };

    function getOrCreateId() {
      let id = localStorage.getItem(STORAGE.userId);
      if (id && /^[a-zA-Z0-9_-]{10,}$/.test(id)) return id;
      id = 'guest_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '') : Math.random().toString(36).slice(2) + Date.now());
      localStorage.setItem(STORAGE.userId, id);
      return id;
    }

    function validateName(v) {
      const name = normName(v);
      if (!name || name.length < 2) return { ok:false, msg:'Use at least 2 characters.' };
      if (!/[A-Za-zÀ-ÿ0-9]/.test(name)) return { ok:false, msg:'Use normal letters or numbers.' };
      return { ok:true, name };
    }

    function initHistory() {
      history.replaceState({ chat:'public' }, '', location.href);
    }
    window.addEventListener('popstate', e => {
      const hs = e.state;
      if (!hs) return;
      if (hs.chat === 'private' && hs.userId) {
        applyConvo('private', hs.userId, hs.name, false);
        return;
      }
      applyConvo('public', null, null, false);
    });

    function relTime(iso) {
      if (!iso) return '';
      const s = Math.floor((Date.now() - new Date(iso)) / 1000);
      if (s < 45) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      const d = Math.floor(s / 86400);
      if (d === 1) return 'yesterday';
      if (d < 7) return d + 'd ago';
      return dateFmt.format(new Date(iso));
    }
    const msgTime = iso => iso ? timeFmt.format(new Date(iso)) + ' · ' + relTime(iso) : '';
    const sideTime = iso => iso ? relTime(iso) : '';

    function sameDay(a, b) {
      if (!a || !b) return false;
      const d1 = new Date(a), d2 = new Date(b);
      return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
    }

    function scrollBottom(force = false, smooth = false) {
      if (!force && !state.stickBottom) return;
      if (state.raf) {
        cancelAnimationFrame(state.raf);
        state.raf = null;
      }
      const target = el.msgList.scrollHeight;
      if (!smooth) {
        el.msgList.scrollTop = target;
        return;
      }
      const start = el.msgList.scrollTop;
      const delta = target - start;
      if (Math.abs(delta) < 6) {
        el.msgList.scrollTop = target;
        return;
      }
      const t0 = performance.now();
      const step = t => {
        const p = Math.min((t - t0) / 180, 1);
        el.msgList.scrollTop = start + delta * (1 - Math.pow(1 - p, 3));
        state.raf = p < 1 ? requestAnimationFrame(step) : null;
      };
      state.raf = requestAnimationFrame(step);
    }

    const openSide = () => {
      state.sideOpen = true;
      el.mobSide.classList.add('active');
      el.mobSide.setAttribute('aria-hidden', 'false');
    };
    const closeSide = () => {
      state.sideOpen = false;
      el.mobSide.classList.remove('active');
      el.mobSide.setAttribute('aria-hidden', 'true');
    };

    const setStatus = (msg = '', type = '') => {
      el.status.textContent = msg;
      el.status.className = 'composer-status' + (type ? ' ' + type : '');
    };

    function showModal(prefill = '') {
      el.nameErr.textContent = '';
      el.guestName.value = prefill || state.user.name || '';
      el.nameModal.classList.add('active');
      el.nameModal.setAttribute('aria-hidden', 'false');
      setTimeout(() => el.guestName.focus(), 20);
    }
    function hideModal() {
      el.nameModal.classList.remove('active');
      el.nameModal.setAttribute('aria-hidden', 'true');
    }

    function ensureContact(userId, name) {
      if (!userId || userId === state.user.id) return;
      if (!state.contacts.has(userId)) {
        state.contacts.set(userId, {
          userId,
          name: normName(name) || 'Unknown',
          lastMessageAt: null,
          lastPreview: '',
          unreadCount: 0,
          online: false,
          lastSeenAt: null,
          typing: false,
          typingTimer: null
        });
      } else if (name && !state.contacts.get(userId).name) {
        state.contacts.get(userId).name = normName(name);
      }
    }

    function hydrateContact(row) {
      const isMe = row.sender_id === state.user.id;
      const uid = isMe ? row.recipient_id : row.sender_id;
      const name = normName(isMe ? row.recipient_name : row.sender_name) || 'Unknown';
      const ex = state.contacts.get(uid);
      const t = row.created_at ? new Date(row.created_at).getTime() : 0;
      const et = ex?.lastMessageAt ? new Date(ex.lastMessageAt).getTime() : 0;
      if (!ex || t >= et) {
        state.contacts.set(uid, {
          userId: uid,
          name,
          lastMessageAt: row.created_at,
          lastPreview: row.is_deleted ? 'Message deleted' : (row.body || ''),
          unreadCount: ex?.unreadCount || 0,
          online: ex?.online || false,
          lastSeenAt: ex?.lastSeenAt || null,
          typing: ex?.typing || false,
          typingTimer: ex?.typingTimer || null
        });
      }
    }

    function isOnline(userId) {
      const e = state.presenceMap.get(userId);
      return !!e?.last_seen_at && (Date.now() - new Date(e.last_seen_at).getTime()) < PRESENCE_EXPIRE_MS;
    }

    function refreshPresence() {
      state.contacts.forEach(c => {
        c.online = isOnline(c.userId);
        const e = state.presenceMap.get(c.userId);
        if (e?.last_seen_at) c.lastSeenAt = e.last_seen_at;
      });
      renderContacts();
      updateHeader();
    }

    async function pingPresence() {
      if (!state.user.name) return;
      const { error } = await sb.from('chat_presence').upsert({
        user_id: state.user.id,
        user_name: state.user.name,
        last_seen_at: now()
      }, { onConflict:'user_id' });
      if (error) console.error('Presence ping failed:', error);
    }

    function currentMessages() {
      return state.convo.type === 'public' ? state.pubMsgs : (state.privMsgs[state.convo.recipientId] || []);
    }

    function currentContact() {
      return state.convo.type === 'private' ? state.contacts.get(state.convo.recipientId) : null;
    }

    async function publishTyping() {
      if (state.convo.type !== 'private' || !state.convo.recipientId || !state.user.name) return;
      if (Date.now() - state.lastTypingSentAt < TYPING_THROTTLE_MS) return;
      state.lastTypingSentAt = Date.now();
      if (!state.subs.typing) return;
      const roomKey = dmKey(state.user.id, state.convo.recipientId);
      const result = await state.subs.typing.send({
        type: 'broadcast',
        event: 'typing',
        payload: {
          user_id: state.user.id,
          user_name: state.user.name,
          room_key: roomKey,
          last_typed_at: now()
        }
      });
      if (result !== 'ok') console.error('Typing broadcast failed:', result);
    }

    function handleTypingEvent(row) {
      if (!row || row.user_id === state.user.id) return;
      const myKey = dmKey(state.user.id, row.user_id);
      if (row.room_key !== myKey) return;
      ensureContact(row.user_id, row.user_name);
      const c = state.contacts.get(row.user_id);
      if (!c) return;
      if (c.typingTimer) clearTimeout(c.typingTimer);
      c.typing = true;
      c.typingTimer = setTimeout(() => {
        c.typing = false;
        c.typingTimer = null;
        renderContacts();
        updateHeader();
        renderTyping();
      }, TYPING_EXPIRE_MS);
      renderContacts();
      updateHeader();
      renderTyping();
    }

    function msgStatusInfo(msg) {
      if (state.convo.type !== 'private') return null;
      if (msg.sender_id !== state.user.id) return null;
      if (msg._optimistic && !msg._failed) return { label:'Sending', cls:'st-sending' };
      if (msg._failed) return { label:'Failed · retry', cls:'st-failed' };
      if (msg.seen_at) return { label:'Seen', cls:'st-seen' };
      return { label:'Delivered', cls:'st-delivered' };
    }

    function canDeletePrivate(msg) {
      return state.convo.type === 'private' && !!msg && msg.sender_id === state.user.id && !msg.is_deleted && !msg._optimistic && !!msg.id;
    }

    function canDeletePublic(msg) {
      return state.convo.type === 'public' && !!msg && msg.sender_id === state.user.id && !!msg.id;
    }

    function renderTyping() {
      const old = $('typingRow');
      if (old) old.remove();
      if (state.convo.type !== 'private') return;
      const c = currentContact();
      if (!c?.typing) return;
      const html = `<div class="typing-row" id="typingRow"><div class="typing-bubble"><span class="typing-label">${esc(c.name)}</span><span class="typing-dots"><span></span><span></span><span></span></span></div></div>`;
      el.msgList.insertAdjacentHTML('beforeend', html);
      scrollBottom(false, true);
    }

    function bubbleHtml(msg) {
      const name = normName(msg.sender_name || msg.name || 'Unknown');
      const own = msg.sender_id === state.user.id || (!msg.sender_id && name === state.user.name);
      const isPriv = state.convo.type === 'private';
      const mid = msg.id || msg._tempId || '';
      const body = msg.is_deleted
        ? '<span class="message-text deleted">This message was deleted.</span>'
        : `<div class="message-text">${esc(msg.body || msg.text || '')}</div>`;
      const si = msgStatusInfo(msg);
      const statusHtml = si ? `<div class="message-status ${si.cls}">${esc(si.label)}</div>` : '<div class="message-status"></div>';

      let actionsHtml = '<div class="message-actions"></div>';
      if (own && isPriv) {
        const parts = [];
        if (msg._askDelete) {
          parts.push(`<button class="action-btn danger" data-action="confirm-delete" data-id="${esc(mid)}"><i class="fas fa-trash" style="font-size:0.7em"></i> Are you sure?</button>`);
          parts.push(`<button class="action-btn" data-action="cancel-delete" data-id="${esc(mid)}">Cancel</button>`);
        } else {
          if (canDeletePrivate(msg)) parts.push(`<button class="action-btn danger" data-action="ask-delete" data-id="${esc(mid)}"><i class="fas fa-trash" style="font-size:0.7em"></i> Delete</button>`);
          if (msg._failed) parts.push(`<button class="action-btn primary" data-action="retry" data-id="${esc(mid)}"><i class="fas fa-rotate-right" style="font-size:0.7em"></i> Retry</button>`);
        }
        actionsHtml = `<div class="message-actions">${parts.join('')}</div>`;
      } else if (own && !isPriv) {
        const parts = [];
        if (msg._askDelete) {
          parts.push(`<button class="action-btn danger" data-action="confirm-delete-public" data-id="${esc(mid)}"><i class="fas fa-trash" style="font-size:0.7em"></i> Are you sure?</button>`);
          parts.push(`<button class="action-btn" data-action="cancel-delete" data-id="${esc(mid)}">Cancel</button>`);
        } else if (canDeletePublic(msg)) {
          parts.push(`<button class="action-btn danger" data-action="ask-delete-public" data-id="${esc(mid)}"><i class="fas fa-trash" style="font-size:0.7em"></i> Delete</button>`);
        }
        actionsHtml = `<div class="message-actions">${parts.join('')}</div>`;
      } else if (!own && !isPriv) {
        actionsHtml = `<div class="message-actions"><button class="action-btn primary" data-action="dm" data-uid="${esc(msg.sender_id || '')}" data-name="${esc(name)}"><i class="fas fa-comment" style="font-size:0.7em"></i> Text ${esc(name)}</button></div>`;
      }

      const hintHtml = msg._hint ? `<div class="message-status st-delivered">${esc(msg._hint)}</div>` : '';

      const rowClasses = [
        'message-row',
        own ? 'own' : '',
        msg._optimistic && !msg._failed ? 'is-pending' : '',
        msg._failed ? 'is-failed' : '',
        state.activeRowId === mid ? 'row-active' : ''
      ].filter(Boolean).join(' ');

      return `<div class="${rowClasses}" data-mid="${esc(mid)}">
        <div class="message-avatar">${esc(initial(name))}</div>
        <div class="message-stack">
          <div class="message-bubble" data-bubble-mid="${esc(mid)}" data-uid="${esc(msg.sender_id || '')}" data-name="${esc(name)}" data-own="${own ? '1' : '0'}">
            <div class="message-header">
              <span class="message-name">${esc(name)}</span>
              <div class="message-time">${esc(msgTime(msg.created_at))}</div>
            </div>
            ${body}
          </div>
          ${actionsHtml}
          ${statusHtml}
          ${hintHtml}
        </div>
      </div>`;
    }

    function renderMessages(msgs, preserveBottomDistance = null) {
      const m = Array.isArray(msgs) ? msgs : [];
      if (!m.length) {
        el.msgList.innerHTML = state.convo.type === 'private'
          ? `<div class="system-row"><div class="system-card"><div class="empty-icon">💬</div><div class="empty-title">No messages yet</div><div class="empty-hint">Start the private conversation. Only the two of you can see this.</div></div></div>`
          : `<div class="system-row"><div class="system-card"><div class="empty-icon">🌍</div><div class="empty-title">Public room is quiet</div><div class="empty-hint">Say something, or click any message to open actions and start a private conversation.</div></div></div>`;
        renderTyping();
        bindMsgHandlers();
        scrollBottom(true, false);
        return;
      }

      const oldBottomDistance = preserveBottomDistance ?? (el.msgList.scrollHeight - el.msgList.scrollTop);

      el.msgList.innerHTML = m.map((msg, i) => {
        const divider = (!i || !sameDay(m[i - 1].created_at, msg.created_at))
          ? `<div class="day-divider">${esc(dateFmt.format(new Date(msg.created_at)))}</div>` : '';
        return divider + bubbleHtml(msg);
      }).join('');

      renderTyping();
      bindMsgHandlers();

      if (preserveBottomDistance !== null) {
        el.msgList.scrollTop = Math.max(0, el.msgList.scrollHeight - oldBottomDistance);
        return;
      }

      scrollBottom(true, false);
    }

    function renderContacts() {
      const term = state.searchTerm.toLowerCase();
      const list = [...state.contacts.values()]
        .filter(c => c.userId !== state.user.id && (!term || c.name.toLowerCase().includes(term)))
        .sort((a, b) => (b.lastMessageAt ? new Date(b.lastMessageAt) : 0) - (a.lastMessageAt ? new Date(a.lastMessageAt) : 0));

      const html = list.length ? list.map(c => {
        const active = state.convo.type === 'private' && state.convo.recipientId === c.userId;
        const badge = c.unreadCount > 0 ? `<span class="unread-badge">${c.unreadCount > 99 ? '99+' : c.unreadCount}</span>` : '';
        const lastMsg = (state.privMsgs[c.userId] || []).slice(-1)[0];
        const isMine = !!lastMsg && lastMsg.sender_id === state.user.id && !c.typing;
        const preview = c.typing ? 'typing...' : (c.lastPreview || '');
        const previewFull = isMine ? 'You: ' + preview : preview;
        const timeLabel = c.online ? 'online' : sideTime(c.lastMessageAt || c.lastSeenAt);
        return `<button class="user-item${active ? ' active' : ''}" type="button" data-uid="${esc(c.userId)}" data-name="${esc(c.name)}">
          <div class="user-avatar-wrap">
            <div class="user-avatar">${esc(initial(c.name))}</div>
            <span class="presence-dot${c.online ? ' online' : ''}"></span>
          </div>
          <div class="sidebar-user-main">
            <div class="sidebar-user-top">
              <span class="sidebar-user-name">${esc(c.name)}</span>
              <span class="sidebar-user-time">${esc(timeLabel)}</span>
            </div>
            <span class="sidebar-user-sub${c.unreadCount > 0 ? ' has-unread' : ''}${c.typing ? ' is-typing' : ''}">${esc(previewFull.slice(0, 48))}</span>
          </div>
          ${badge}
        </button>`;
      }).join('') : '<div class="system-card" style="border-radius:12px;font-size:0.65rem">No private conversations yet.<br>Click any message to start one.</div>';

      el.userList.innerHTML = html;
      el.mobileList.innerHTML = html;
      bindSideHandlers();
      el.inboxBtn.classList.toggle('has-unread', [...state.contacts.values()].some(c => c.unreadCount > 0));
      const onlineCount = [...state.contacts.values()].filter(c => c.online).length;
      const label = onlineCount ? onlineCount + ' online' : '';
      el.deskPresence.textContent = label;
      el.mobPresence.textContent = label;
    }

    function updateHeader() {
      const priv = state.convo.type === 'private';
      el.backBtn.classList.toggle('hidden', !priv);
      el.chatMain.classList.toggle('is-private', priv);
      if (!priv) {
        el.chatTitle.textContent = 'Public room';
        el.chatSub.textContent = 'Everyone can read this room';
        el.chatSub.classList.remove('typing');
        return;
      }
      const c = currentContact();
      el.chatTitle.textContent = c?.name || 'Private conversation';
      if (c?.typing) {
        el.chatSub.textContent = c.name + ' is typing...';
        el.chatSub.classList.add('typing');
        return;
      }
      el.chatSub.classList.remove('typing');
      if (c?.online) {
        el.chatSub.textContent = 'online now';
      } else if (c?.lastSeenAt) {
        el.chatSub.textContent = 'last seen ' + relTime(c.lastSeenAt);
      } else {
        el.chatSub.textContent = 'private conversation';
      }
    }

    async function loadPublic() {
      const { data, error } = await sb.from('messages').select('*').eq('room', PUBLIC_ROOM).order('created_at', { ascending:true }).limit(100);
      if (error) {
        console.error(error);
        if (state.convo.type === 'public') el.msgList.innerHTML = '<div class="system-row"><div class="system-card">Could not load messages.</div></div>';
        return;
      }
      state.pubMsgs = (data || []).map(r => ({ ...r, sender_id:r.user_id || r.sender_id || '', sender_name:normName(r.name || r.sender_name || 'Unknown') }));
      if (state.convo.type === 'public') renderMessages(state.pubMsgs);
    }

    async function loadPrivate() {
      const { data, error } = await sb.from('private_messages').select('*')
        .or(`sender_id.eq.${state.user.id},recipient_id.eq.${state.user.id}`)
        .order('created_at', { ascending:true })
        .limit(400);
      if (error) {
        console.error(error);
        return;
      }
      state.privMsgs = {};
      state.contacts.clear();
      (data || []).forEach(row => {
        const other = row.sender_id === state.user.id ? row.recipient_id : row.sender_id;
        if (!other) return;
        (state.privMsgs[other] = state.privMsgs[other] || []).push(row);
        hydrateContact(row);
      });
      if (state.convo.type === 'private' && state.convo.recipientId) {
        const c = currentContact();
        if (c) c.unreadCount = 0;
        renderMessages(currentMessages());
      }
      renderContacts();
      updateHeader();
    }

    function subscribePub() {
      if (state.subs.pub) sb.removeChannel(state.subs.pub);
      state.subs.pub = sb.channel(`pub:${PUBLIC_ROOM}`)
        .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages', filter:`room=eq.${PUBLIC_ROOM}` }, payload => {
          const row = { ...payload.new, sender_id:payload.new.user_id || payload.new.sender_id || '', sender_name:normName(payload.new.name || payload.new.sender_name || 'Unknown') };
          state.pubMsgs.push(row);
          if (state.convo.type === 'public') {
            const msgs = state.pubMsgs;
            const prev = msgs[msgs.length - 2];
            let html = (!prev || !sameDay(prev.created_at, row.created_at)) ? `<div class="day-divider">${esc(dateFmt.format(new Date(row.created_at)))}</div>` : '';
            html += bubbleHtml(row);
            const typingNode = $('typingRow');
            if (typingNode) typingNode.remove();
            el.msgList.insertAdjacentHTML('beforeend', html);
            renderTyping();
            bindMsgHandlers();
            scrollBottom(false, true);
          }
        })
        .on('postgres_changes', { event:'DELETE', schema:'public', table:'messages', filter:`room=eq.${PUBLIC_ROOM}` }, payload => {
          const id = payload.old?.id;
          if (!id) return;
          state.pubMsgs = state.pubMsgs.filter(m => m.id !== id);
          if (state.convo.type === 'public') renderMessages(state.pubMsgs);
        })
        .subscribe();
    }

    function upsertPrivRow(row) {
      const other = row.sender_id === state.user.id ? row.recipient_id : row.sender_id;
      if (!other) return;
      ensureContact(other, row.sender_id === state.user.id ? row.recipient_name : row.sender_name);
      const list = state.privMsgs[other] = state.privMsgs[other] || [];
      let idx = list.findIndex(m => m.id && m.id === row.id);
      if (idx < 0 && row.client_id) idx = list.findIndex(m => m._tempId === row.client_id || m.client_id === row.client_id);
      if (idx >= 0) {
        list[idx] = { ...row, _optimistic:false, _failed:false };
      } else {
        list.push({ ...row, _optimistic:false, _failed:false });
        list.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      }
      hydrateContact(row);
    }

    function subscribePriv() {
      if (state.subs.privIns) sb.removeChannel(state.subs.privIns);
      if (state.subs.privUpd) sb.removeChannel(state.subs.privUpd);

      state.subs.privIns = sb.channel(`privIns:${state.user.id}`)
        .on('postgres_changes', { event:'INSERT', schema:'public', table:'private_messages' }, payload => {
          const row = payload.new;
          if (row.sender_id !== state.user.id && row.recipient_id !== state.user.id) return;
          const other = row.sender_id === state.user.id ? row.recipient_id : row.sender_id;
          upsertPrivRow(row);
          const c = state.contacts.get(other);
          if (c) {
            c.lastMessageAt = row.created_at;
            c.lastPreview = row.is_deleted ? 'Message deleted' : (row.body || '');
          }
          if (row.sender_id !== state.user.id && !(state.convo.type === 'private' && state.convo.recipientId === other)) {
            if (c) c.unreadCount = (c.unreadCount || 0) + 1;
          }
          if (state.convo.type === 'private' && state.convo.recipientId === other) {
            renderMessages(state.privMsgs[other] || []);
            markSeen(other);
          }
          renderContacts();
          updateHeader();
        })
        .subscribe();

      state.subs.privUpd = sb.channel(`privUpd:${state.user.id}`)
        .on('postgres_changes', { event:'UPDATE', schema:'public', table:'private_messages' }, payload => {
          const row = payload.new;
          if (row.sender_id !== state.user.id && row.recipient_id !== state.user.id) return;
          upsertPrivRow(row);
          const other = row.sender_id === state.user.id ? row.recipient_id : row.sender_id;
          const c = state.contacts.get(other);
          if (c) c.lastPreview = row.is_deleted ? 'Message deleted' : (row.body || '');
          if (state.convo.type === 'private' && state.convo.recipientId === other) renderMessages(state.privMsgs[other] || []);
          renderContacts();
          updateHeader();
        })
        .subscribe();
    }

    function subscribePresence() {
      if (state.subs.presence) sb.removeChannel(state.subs.presence);
      state.subs.presence = sb.channel('chat_presence_feed')
        .on('postgres_changes', { event:'INSERT', schema:'public', table:'chat_presence' }, payload => { state.presenceMap.set(payload.new.user_id, payload.new); refreshPresence(); })
        .on('postgres_changes', { event:'UPDATE', schema:'public', table:'chat_presence' }, payload => { state.presenceMap.set(payload.new.user_id, payload.new); refreshPresence(); })
        .subscribe();
    }

    function subscribeTyping() {
      if (state.subs.typing) sb.removeChannel(state.subs.typing);
      state.subs.typing = sb.channel('typing_bus')
        .on('broadcast', { event:'typing' }, payload => handleTypingEvent(payload.payload))
        .subscribe();
    }

    async function markSeen(otherUserId) {
      if (!otherUserId) return;
      const list = state.privMsgs[otherUserId] || [];
      const unseen = list.filter(m => m.sender_id === otherUserId && !m.seen_at && !m.is_deleted && m.id);
      if (!unseen.length) return;
      const seenAt = now();
      const { error } = await sb.from('private_messages').update({ seen_at: seenAt }).in('id', unseen.map(m => m.id));
      if (error) {
        console.error(error);
        return;
      }
      unseen.forEach(m => { m.seen_at = seenAt; });
      const c = state.contacts.get(otherUserId);
      if (c) c.unreadCount = 0;
      renderContacts();
      if (state.convo.type === 'private' && state.convo.recipientId === otherUserId) renderMessages(list);
    }

    async function send() {
      const body = el.msgInput.value.trim();
      if (!body) return;
      if (Date.now() - state.lastSendAt < COOLDOWN_MS) {
        setStatus('Slow down a little.', 'error');
        return;
      }
      if (!state.user.name) {
        showModal();
        return;
      }

      setStatus('');
      el.sendBtn.disabled = true;
      const draft = el.msgInput.value;
      el.msgInput.value = '';
      resizeTA();
      updateCounter();

      let err = null;

      if (state.convo.type === 'public') {
        const r = await sb.from('messages').insert({ room:PUBLIC_ROOM, body, name:state.user.name, user_id:state.user.id });
        err = r.error;
      } else {
        const c = currentContact();
        if (!c) {
          err = new Error('Missing recipient.');
        } else {
          const tempId = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          const optimistic = {
            id: tempId,
            _tempId: tempId,
            client_id: tempId,
            _optimistic: true,
            _failed: false,
            sender_id: state.user.id,
            sender_name: state.user.name,
            recipient_id: c.userId,
            recipient_name: c.name,
            body,
            created_at: now(),
            seen_at: null,
            is_deleted: false,
            _askDelete: false,
            _hint: ''
          };
          (state.privMsgs[c.userId] = state.privMsgs[c.userId] || []).push(optimistic);
          c.lastMessageAt = optimistic.created_at;
          c.lastPreview = body;
          renderContacts();
          renderMessages(state.privMsgs[c.userId]);

          const r = await sb.from('private_messages').insert({
            sender_id: state.user.id,
            sender_name: state.user.name,
            recipient_id: c.userId,
            recipient_name: c.name,
            body,
            client_id: tempId
          });
          err = r.error;
          if (err) {
            const failed = (state.privMsgs[c.userId] || []).find(m => m._tempId === tempId);
            if (failed) {
              failed._failed = true;
              failed._optimistic = false;
            }
            renderMessages(state.privMsgs[c.userId]);
          }
        }
      }

      el.sendBtn.disabled = false;
      if (err) {
        console.error(err);
        if (state.convo.type === 'public') {
          el.msgInput.value = draft;
          resizeTA();
          updateCounter();
        }
        setStatus('Failed to send.', 'error');
        return;
      }
      state.lastSendAt = Date.now();
      el.msgInput.focus();
    }

    async function deleteMsg(id) {
      const list = currentMessages();
      const msg = list.find(m => (m.id || m._tempId) === id);
      if (!msg) return;
      const preserve = el.msgList.scrollHeight - el.msgList.scrollTop;
      const stamp = now();
      const { error } = await sb.from('private_messages').update({ is_deleted:true, body:'', edited_at:stamp }).eq('id', msg.id);
      if (error) {
        console.error(error);
        setStatus('Could not delete.', 'error');
        return;
      }
      msg.is_deleted = true;
      msg.body = '';
      msg._askDelete = false;
      const c = currentContact();
      if (c) c.lastPreview = 'Message deleted';
      state.activeRowId = null;
      renderContacts();
      renderMessages(list, preserve);
    }

    async function deletePublicMsg(id) {
      const preserve = el.msgList.scrollHeight - el.msgList.scrollTop;
      const { error } = await sb.from('messages').delete().eq('id', id);
      if (error) {
        console.error(error);
        setStatus('Could not delete public message.', 'error');
        return;
      }
      state.pubMsgs = state.pubMsgs.filter(m => m.id !== id);
      state.activeRowId = null;
      renderMessages(state.pubMsgs, preserve);
    }

    async function retryMsg(id) {
      const list = currentMessages();
      const msg = list.find(m => (m._tempId || m.id) === id);
      if (!msg || !msg._failed) return;
      const c = currentContact();
      if (!c) return;
      msg._failed = false;
      msg._optimistic = true;
      const newClientId = 'retry_' + Date.now();
      msg._tempId = newClientId;
      msg.client_id = newClientId;
      state.activeRowId = null;
      renderMessages(list);
      const { error } = await sb.from('private_messages').insert({
        sender_id: state.user.id,
        sender_name: state.user.name,
        recipient_id: c.userId,
        recipient_name: c.name,
        body: msg.body,
        client_id: newClientId
      });
      if (error) {
        console.error(error);
        msg._failed = true;
        msg._optimistic = false;
        renderMessages(list);
      }
    }

    function resizeTA() {
      el.msgInput.style.height = 'auto';
      el.msgInput.style.overflowY = 'hidden';
      const h = Math.min(el.msgInput.scrollHeight, MAX_TA_H);
      el.msgInput.style.height = h + 'px';
      el.msgInput.style.overflowY = el.msgInput.scrollHeight > MAX_TA_H ? 'auto' : 'hidden';
    }
    const updateCounter = () => { el.counter.textContent = el.msgInput.value.length + ' / 500'; };

    function bindSideHandlers() {
      document.querySelectorAll('#userList .user-item, #mobileUserList .user-item').forEach(btn => {
        btn.onclick = () => applyConvo('private', btn.dataset.uid, btn.dataset.name, true);
      });
    }

    function closeActionRow() {
      if (!state.activeRowId) return;
      const row = el.msgList.querySelector(`[data-mid="${CSS.escape(state.activeRowId)}"]`);
      if (row) row.classList.remove('row-active');
      state.activeRowId = null;
    }

    function showPrivateHint(mid) {
      const msg = currentMessages().find(m => (m.id || m._tempId) === mid);
      if (!msg) return;
      msg._hint = 'Already in this private chat';
      renderMessages(currentMessages());
      setTimeout(() => {
        msg._hint = '';
        renderMessages(currentMessages());
      }, 1400);
    }

    function bindMsgHandlers() {
      el.msgList.querySelectorAll('[data-bubble-mid]').forEach(bubble => {
        bubble.onclick = () => {
          const mid = bubble.dataset.bubbleMid;
          const own = bubble.dataset.own === '1';
          const uid = bubble.dataset.uid;
          const row = el.msgList.querySelector(`[data-mid="${CSS.escape(mid)}"]`);
          const wasActive = state.activeRowId === mid;

          closeActionRow();
          if (!wasActive && row) {
            state.activeRowId = mid;
            row.classList.add('row-active');
          }

          if (!own && state.convo.type === 'private' && uid === state.convo.recipientId) {
            showPrivateHint(mid);
          }
        };
      });

      el.msgList.querySelectorAll('[data-action]').forEach(btn => {
        btn.onclick = async e => {
          e.stopPropagation();
          const action = btn.dataset.action;
          const id = btn.dataset.id;

          if (action === 'ask-delete') {
            const msg = currentMessages().find(m => (m.id || m._tempId) === id);
            if (msg) {
              msg._askDelete = true;
              renderMessages(currentMessages());
            }
            return;
          }

          if (action === 'ask-delete-public') {
            const msg = currentMessages().find(m => (m.id || m._tempId) === id);
            if (msg) {
              msg._askDelete = true;
              renderMessages(currentMessages());
            }
            return;
          }

          if (action === 'cancel-delete') {
            const msg = currentMessages().find(m => (m.id || m._tempId) === id);
            if (msg) {
              msg._askDelete = false;
              renderMessages(currentMessages());
            }
            return;
          }

          if (action === 'confirm-delete') {
            await deleteMsg(id);
            return;
          }

          if (action === 'confirm-delete-public') {
            await deletePublicMsg(id);
            return;
          }

          if (action === 'retry') {
            await retryMsg(id);
            return;
          }

          if (action === 'dm') {
            applyConvo('private', btn.dataset.uid, btn.dataset.name, true);
          }
        };
      });
    }

    function applyConvo(type, userId, name, pushHistory) {
      state.activeRowId = null;
      if (type === 'private') {
        if (!userId || userId === state.user.id) return;
        ensureContact(userId, name);
        state.convo = { type:'private', recipientId:userId };
        state.stickBottom = true;
        const c = currentContact();
        if (c) c.unreadCount = 0;
        if (pushHistory) history.pushState({ chat:'private', userId, name }, '', location.href);
        localStorage.setItem(STORAGE.convo, JSON.stringify(state.convo));
        markSeen(userId);
      } else {
        if (pushHistory && state.convo.type === 'private') history.pushState({ chat:'public' }, '', location.href);
        state.convo = { type:'public', recipientId:null };
        state.stickBottom = true;
        localStorage.removeItem(STORAGE.convo);
      }
      updateHeader();
      renderContacts();
      renderMessages(type === 'private' ? (state.privMsgs[userId] || []) : state.pubMsgs);
      closeSide();
    }

    function bindEvents() {
      if (state.inited) return;
      state.inited = true;

      el.joinBtn.addEventListener('click', async () => {
        const r = validateName(el.guestName.value);
        if (!r.ok) {
          el.nameErr.textContent = r.msg;
          return;
        }
        state.user.name = r.name;
        localStorage.setItem(STORAGE.userName, r.name);
        hideModal();
        setStatus('');
        await pingPresence();
        if (!state.activityStarted) setupActivity();
      });

      el.clearBtn.addEventListener('click', () => {
        [STORAGE.userName, STORAGE.userId, STORAGE.convo].forEach(k => localStorage.removeItem(k));
        location.reload();
      });

      el.guestName.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          el.joinBtn.click();
        }
      });

      el.inboxBtn.addEventListener('click', () => state.sideOpen ? closeSide() : openSide());
      el.backBtn.addEventListener('click', () => applyConvo('public', null, null, true));
      el.sendBtn.addEventListener('click', send);

      el.msgInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
          return;
        }
        if (state.convo.type === 'private') publishTyping();
      });

      el.msgInput.addEventListener('input', () => {
        resizeTA();
        updateCounter();
        if (el.status.classList.contains('error')) setStatus('');
        if (state.convo.type === 'private' && el.msgInput.value.trim()) publishTyping();
      });

      const syncSearch = src => {
        state.searchTerm = src.value;
        el.sideSearch.value = src.value;
        el.mobSearch.value = src.value;
        renderContacts();
      };
      el.sideSearch.addEventListener('input', () => syncSearch(el.sideSearch));
      el.mobSearch.addEventListener('input', () => syncSearch(el.mobSearch));

      el.msgList.addEventListener('scroll', () => {
        state.stickBottom = (el.msgList.scrollHeight - el.msgList.scrollTop - el.msgList.clientHeight) < NEAR_BOTTOM;
        if (state.stickBottom && state.convo.type === 'private' && state.convo.recipientId) markSeen(state.convo.recipientId);
      }, { passive:true });

      document.addEventListener('click', e => {
        if (state.activeRowId && !e.target.closest('.message-row')) closeActionRow();
        if (isMobile() && state.sideOpen && !el.mobSide.contains(e.target) && !el.inboxBtn.contains(e.target)) closeSide();
      });

      window.addEventListener('resize', () => { if (!isMobile()) closeSide(); resizeTA(); });
      window.addEventListener('beforeunload', () => {
        if (state.raf) cancelAnimationFrame(state.raf);
        if (state.presenceBeat) clearInterval(state.presenceBeat);
        if (state.presenceDecayBeat) clearInterval(state.presenceDecayBeat);
        Object.values(state.subs).forEach(c => c && sb.removeChannel(c));
      });
    }

    async function restoreConvo() {
      const raw = localStorage.getItem(STORAGE.convo);
      if (!raw) {
        applyConvo('public', null, null, false);
        return;
      }
      try {
        const saved = JSON.parse(raw);
        if (saved?.type === 'private' && saved.recipientId && saved.recipientId !== state.user.id && state.contacts.has(saved.recipientId)) {
          const c = state.contacts.get(saved.recipientId);
          if (c) c.unreadCount = 0;
          history.pushState({ chat:'private', userId:saved.recipientId, name:c?.name || '' }, '', location.href);
          state.convo = saved;
          state.stickBottom = true;
          updateHeader();
          renderContacts();
          renderMessages(state.privMsgs[saved.recipientId] || []);
          markSeen(saved.recipientId);
          return;
        }
      } catch {}
      applyConvo('public', null, null, false);
    }

    function setupActivity() {
      if (state.activityStarted) return;
      state.activityStarted = true;
      pingPresence();
      state.presenceBeat = setInterval(pingPresence, PRESENCE_HEARTBEAT_MS);
      state.presenceDecayBeat = setInterval(refreshPresence, 10000);
      ['visibilitychange','focus','click','keydown'].forEach(evt => {
        window.addEventListener(evt, () => {
          if (!document.hidden && state.user.name) pingPresence();
        }, { passive:true });
      });
    }

    async function init() {
      initHistory();
      bindEvents();
      updateHeader();
      updateCounter();
      resizeTA();
      if (!state.user.name) showModal();
      await loadPublic();
      await loadPrivate();
      await restoreConvo();
      subscribePub();
      subscribePriv();
      subscribePresence();
      subscribeTyping();
      if (state.user.name) setupActivity();
    }

    init().catch(err => {
      console.error('Init failed:', err);
      el.msgList.innerHTML = '<div class="system-row"><div class="system-card">Chat failed to initialize.</div></div>';
      setStatus('Initialization failed.', 'error');
    });
  })();
  </script>
</body>
</html>
