<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post — Colin Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" id="metaDesc" content="A quiet archive of essays, code, and notes – unfiltered and unpolished." />
  <meta property="og:title" id="ogTitle" content="Colin Archive" />
  <meta property="og:description" id="ogDesc" content="A quiet archive of essays, code, and notes – unfiltered and unpolished." />
  <meta property="og:type" content="article" />
  <meta property="og:url" id="ogUrl" content="" />
  <meta property="og:image" id="ogImage" content="https://yourdomain.com/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twTitle" content="Colin Archive">
  <meta name="twitter:description" id="twDesc" content="">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0d0d0d;
      --paper: #1a1a1a;
      --fg: #e8e8e8;
      --muted: #c0c0c0;
      --border: #2a2a2a;
      --red: #ff6b6b;
      --dark-red: #b3002d;
      --blue: #4ecdc4;
      --green: #51cf66;
      --yellow: #ffe66d;
      --type-color: var(--blue);
      --serif: 'Crimson Text', 'Georgia', serif;
      --mono: 'IBM Plex Mono', 'Courier New', monospace;
      --hand: 'Caveat', cursive;
      --essay-serif: 'Libre Baskerville', 'Georgia', serif;
      --page-width: 680px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111111;
      color: var(--fg);
      font-family: var(--serif);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* NAV */
    nav {
      background: var(--paper);
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 3rem;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      transition: border-bottom-color 0.2s, box-shadow 0.2s;
    }
    nav.nav-type-essay { border-bottom: 2px solid var(--blue);   box-shadow: 0 0 6px rgba(78,205,196,0.3); }
    nav.nav-type-code  { border-bottom: 2px solid var(--green);  box-shadow: 0 0 6px rgba(81,207,102,0.3); }
    nav.nav-type-notes { border-bottom: 2px solid var(--yellow); box-shadow: 0 0 6px rgba(255,230,109,0.3); }

    .logo {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
      text-decoration: none;
      color: var(--fg);
    }
    .logo::after { content: '|'; color: var(--red); animation: blink 1s step-end infinite; margin-left: 2px; }
    @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

    .post-type-label { margin-left: 1.5rem; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .post-type-label.essay { font-family: var(--essay-serif); color: var(--blue); }
    .post-type-label.code  { font-family: var(--mono);        color: var(--green); }
    .post-type-label.notes { font-family: var(--hand);        color: var(--yellow); }

    .share-wrap { position: relative; margin-left: auto; }
    .share-btn {
      display: flex; align-items: center; gap: 0.35rem; padding: 0;
      background: transparent; border: none; color: var(--muted);
      font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em;
      text-transform: uppercase; cursor: pointer; line-height: 1; transition: color 0.2s;
    }
    .share-btn:hover { color: var(--type-color); }
    .share-btn:focus-visible { outline: 2px solid var(--type-color); outline-offset: 2px; }
    .share-btn i { font-size: 0.7rem; }

    .share-dropdown {
      position: absolute; top: calc(100% + 10px); right: 0;
      background: #1c1c1c; border: 1px solid var(--border); border-radius: 8px;
      padding: 0.4rem; display: none; flex-direction: column; gap: 0.2rem;
      min-width: 160px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 200;
    }
    .share-dropdown.open { display: flex; animation: dropIn 0.15s ease; }
    @keyframes dropIn { from { opacity:0; transform:translateY(-6px) } to { opacity:1; transform:none } }

    .share-option {
      display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.75rem;
      border-radius: 5px; font-family: var(--mono); font-size: 0.68rem;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
      cursor: pointer; background: transparent; border: none; width: 100%;
      text-align: left; transition: background 0.15s, color 0.15s; text-decoration: none;
    }
    .share-option:hover { background: rgba(255,255,255,0.05); color: var(--type-color); }
    .share-option:focus-visible { outline: 2px solid var(--type-color); outline-offset: 2px; }
    .share-option i { width: 14px; text-align: center; font-size: 0.8rem; }
    .share-option.copy-success { color: var(--green); }

    /* LAYOUT */
    .wrapper { width: 100%; padding: 50px 1rem 80px; display: flex; justify-content: center; }

    .page {
      background: var(--paper);
      width: var(--page-width);
      min-width: 320px;
      max-width: calc(100vw - 2rem);
      padding: 4rem 4.5rem;
      box-shadow: 0 2px 30px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.03);
      border-radius: 2px;
      position: relative;
    }

    .drag-handle {
      position: absolute; top: 0; right: -6px; width: 20px; height: 100%;
      cursor: ew-resize; z-index: 10; display: flex; align-items: center; justify-content: center;
      touch-action: none; /* prevent scrolling while dragging */
    }
    .drag-handle::after {
      content: ''; display: block; width: 3px; height: 40px; border-radius: 3px;
      background: var(--border); transition: background 0.2s, height 0.2s;
    }
    .drag-handle:hover::after, .drag-handle.dragging::after { background: var(--type-color); height: 60px; }

    .width-indicator {
      position: fixed; background: #1c1c1c; border: 1px solid var(--border);
      color: var(--muted); font-family: var(--mono); font-size: 0.65rem;
      letter-spacing: 0.08em; padding: 0.3rem 0.6rem; border-radius: 4px;
      pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 9999; white-space: nowrap;
    }
    .width-indicator.visible { opacity: 1; }

    .back-link { margin-bottom: 2.5rem; }
    .back-link a {
      display: inline-block; padding: 0.6rem 1.5rem; border: 1px solid var(--border);
      border-radius: 4px; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); text-decoration: none;
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
    }
    .back-link a:hover { border-color: var(--blue); color: var(--blue); transform: translateX(-2px); }

    .post-container { width: 100%; }

    .title { font-family: var(--serif); font-size: 2.5rem; font-weight: 600; margin-bottom: 0.75rem; line-height: 1.3; }
    .type-essay .title { font-family: var(--essay-serif); font-weight: 700; }
    .type-code  .title { font-family: var(--mono); letter-spacing: -0.02em; }
    .type-notes .title { font-family: var(--hand); font-size: 2rem; }

    .meta { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2rem; }

    .tags { margin-bottom: 2rem; }
    .tag {
      display: inline-block; border: 1px solid var(--border); padding: 0.3rem 0.8rem; margin: 0.2rem;
      font-family: var(--mono); font-size: 0.65rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.05em; border-radius: 4px; transition: border-color 0.2s, color 0.2s;
    }
    .tag:hover { border-color: var(--blue); color: var(--blue); }

    .excerpt { font-size: 1.3rem; color: #bdbdbd; margin-bottom: 2.2rem; font-style: italic; border-left: 3px solid var(--blue); padding-left: 1rem; }
    .content { font-size: 1.18rem; line-height: 1.85; white-space: pre-wrap; color: var(--fg); display: block; }

    /* TERMINAL */
    .type-code .terminal {
      position: relative; background: #0c0c0c; border: 1px solid #2a2a2a; border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,255,0,0.05);
      font-family: var(--mono); font-size: 0.95rem; line-height: 1.6; color: #b0f0b0; overflow: hidden;
    }
    .terminal-header { background: #1a1a1a; padding: 0.5rem 1rem; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; gap: 0.5rem; }
    .terminal-dot { width: 12px; height: 12px; border-radius: 50%; background: #ff5f56; }
    .terminal-dot:nth-child(2) { background: #ffbd2e; }
    .terminal-dot:nth-child(3) { background: #27c93f; }
    .terminal-title { font-size: 0.65rem; color: #888; margin-left: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .terminal-body { display: flex; position: relative; }
    .line-numbers { padding: 1rem 0 1rem 1rem; text-align: right; color: #4a7a4a; user-select: none; border-right: 1px solid #2a2a2a; background: #0a0a0a; font-family: var(--mono); font-size: 0.95rem; line-height: 1.6; white-space: nowrap; }
    .line-numbers div { padding-right: 1rem; }
    .code-lines { flex: 1; padding: 1rem; overflow-x: auto; background: #0a0a0a; }
    .code-line { display: block; white-space: pre; font-family: var(--mono); font-size: 0.95rem; line-height: 1.6; color: #b0f0b0; }
    .copy-btn {
      position: absolute; top: 0.75rem; right: 0.75rem; background: #1f1f1f; border: 1px solid #3a3a3a;
      border-radius: 4px; color: #b0f0b0; font-family: var(--mono); font-size: 0.7rem;
      padding: 0.3rem 0.7rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem;
      transition: background 0.2s, border-color 0.2s, color 0.2s; z-index: 20;
    }
    .copy-btn:hover { background: #2a2a2a; border-color: #b0f0b0; color: #d0f0d0; }
    .copy-btn.copied { background: #2a5a2a; border-color: #b0f0b0; color: #fff; }
    .copy-btn i { font-size: 0.8rem; }

    /* LOCKED */
    .locked-message {
      text-align: center; padding: 2rem; border: 1px dashed var(--red); border-radius: 8px; margin-top: 2rem;
      background: repeating-linear-gradient(45deg, rgba(179,0,45,0.1) 0px, rgba(179,0,45,0.1) 10px, transparent 10px, transparent 20px);
      position: relative;
    }
    .locked-message h3 { font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.1em; color: var(--red); margin-bottom: 1rem; text-transform: uppercase; }
    .locked-message p { color: var(--muted); margin-bottom: 1.5rem; }
    .btn { display: inline-block; padding: 0.7rem 1.4rem; background: transparent; border: 1px solid var(--red); border-radius: 4px; color: var(--red); font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; text-decoration: none; text-transform: uppercase; transition: background 0.2s, color 0.2s; }
    .btn:hover { background: var(--red); color: var(--bg); }
    .locked-icon { position: absolute; top: 1rem; right: 1rem; font-size: 2rem; color: rgba(255,255,255,0.6); text-shadow: 0 2px 5px rgba(0,0,0,0.5); pointer-events: none; }

    .loading { text-align: center; font-family: var(--mono); color: var(--muted); padding: 3rem; font-size: 1rem; }
    body.is-resizing { user-select: none; cursor: ew-resize; }

    /* ── COMMENTS — margin note aesthetic ── */
    .comments-wrap {
      margin-top: 5rem;
      position: relative;
    }

    .comments-divider {
      position: relative;
      text-align: center;
      margin-bottom: 3rem;
    }
    .comments-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0; right: 0;
      height: 1px;
      background: var(--border);
    }
    .comments-divider-label {
      position: relative;
      display: inline-block;
      background: var(--paper);
      padding: 0 1rem;
      font-family: var(--hand);
      font-size: 1.1rem;
      color: var(--muted);
      opacity: 0.55;
      letter-spacing: 0.02em;
    }

    /* Form */
    .comment-form-section { margin-bottom: 3.5rem; }

    .comment-form-title {
      font-family: var(--hand);
      font-size: 1.3rem;
      color: var(--fg);
      opacity: 0.5;
      margin-bottom: 1.25rem;
      letter-spacing: 0.01em;
    }

    .reply-indicator {
      display: none;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-family: var(--hand);
      font-size: 0.9rem;
      color: var(--muted);
    }
    .reply-indicator span { color: var(--type-color); }
    .reply-indicator .cancel-reply {
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.2rem;
      transition: color 0.2s;
    }
    .reply-indicator .cancel-reply:hover { color: var(--red); }

    .comment-form { display: flex; flex-direction: column; gap: 0; }

    .comment-form input,
    .comment-form textarea {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--fg);
      font-family: var(--serif);
      font-size: 1rem;
      padding: 0.65rem 0;
      transition: border-color 0.2s;
      resize: none;
      outline: none;
      width: 100%;
    }
    .comment-form input::placeholder,
    .comment-form textarea::placeholder {
      color: var(--muted);
      opacity: 0.35;
      font-style: italic;
      font-family: var(--serif);
    }
    .comment-form input:focus,
    .comment-form textarea:focus { border-bottom-color: var(--type-color); }
    .comment-form textarea { min-height: 100px; line-height: 1.7; margin-top: 0.5rem; }

    .comment-form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      gap: 1rem;
    }
    .comment-feedback {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--green);
      letter-spacing: 0.04em;
      min-height: 1rem;
      flex: 1;
    }
    .comment-feedback.error { color: var(--red); }

    .comment-submit {
      padding: 0;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--hand);
      font-size: 1.1rem;
      cursor: pointer;
      transition: color 0.2s;
      line-height: 1;
      flex-shrink: 0;
      letter-spacing: 0.01em;
    }
    .comment-submit:hover { color: var(--type-color); }
    .comment-submit:disabled { opacity: 0.25; cursor: not-allowed; }

    /* List */
    .comments-list-section {}

    .comments-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }
    .comments-header h3 {
      font-family: var(--hand);
      font-size: 1.15rem;
      color: var(--muted);
      font-weight: 400;
      opacity: 0.5;
      letter-spacing: 0.01em;
    }
    .comments-count {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--type-color);
      opacity: 0.7;
    }

    /* Thread styling */
    .comment-thread { margin-left: 0; }
    .comment-thread .comment-thread { margin-left: 1.5rem; border-left: 1px solid var(--border); padding-left: 1.5rem; }

    .comment-item {
      position: relative;
      padding: 1.5rem 0 1.5rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .comment-item:first-child { border-top: 1px solid var(--border); }

    .comment-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 1.5rem;
      bottom: 1.5rem;
      width: 1px;
      background: var(--type-color);
      opacity: 0.35;
      transition: opacity 0.2s;
    }
    .comment-item:hover::before { opacity: 0.7; }

    .comment-item-header {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      margin-bottom: 0.5rem;
    }
    .comment-item-name {
      font-family: var(--hand);
      font-size: 1.05rem;
      color: var(--fg);
      letter-spacing: 0.01em;
    }
    .comment-item-date {
      font-family: var(--mono);
      font-size: 0.58rem;
      color: var(--muted);
      opacity: 0.4;
    }
    .comment-item-body {
      font-family: var(--serif);
      font-size: 0.98rem;
      line-height: 1.75;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .comment-reply-btn {
      margin-top: 0.5rem;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--hand);
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }
    .comment-reply-btn:hover { color: var(--type-color); }
    .comment-reply-btn:focus-visible { outline: 2px solid var(--type-color); outline-offset: 2px; }

    .comments-empty {
      font-family: var(--hand);
      font-size: 1.1rem;
      color: var(--muted);
      opacity: 0.3;
      padding: 0.5rem 0 0.5rem 1.5rem;
      letter-spacing: 0.01em;
    }

    @media (max-width: 700px) {
      nav { padding: 1rem 1rem; }
      .post-type-label { margin-left: 1rem; font-size: 0.6rem; }
      .wrapper { padding: 0; margin: 0; }
      .page { padding: 1.5rem 0; box-shadow: none; border-radius: 0; min-height: 100vh; width: 100% !important; max-width: 100% !important; }
      .drag-handle { display: none; }
      .back-link { padding: 0 1rem; }
      .post-container { padding: 0 1rem; }
      .title { font-size: 2rem; }
      .type-notes .title { font-size: 1.8rem; }
      .back-link a { display: block; text-align: center; }
      .locked-icon { top: 0.5rem; right: 0.5rem; font-size: 1.5rem; }
      .copy-btn { top: 0.5rem; right: 0.5rem; font-size: 0.6rem; padding: 0.2rem 0.5rem; }
      .terminal-header { padding: 0.3rem 0.8rem; }
      .terminal-dot { width: 8px; height: 8px; }
      .share-dropdown { right: 0; }
      .comments-wrap { padding: 0 1rem; padding-top: 2rem; margin-top: 3rem; }
      .comment-thread .comment-thread { margin-left: 0.75rem; padding-left: 0.75rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

<nav id="mainNav">
  <a href="/" class="logo">Colin Archive</a>
  <span class="post-type-label" id="postTypeLabel"></span>
  <div class="share-wrap" id="shareWrap">
    <button class="share-btn" id="shareBtn" aria-label="Share this post" aria-haspopup="true" aria-expanded="false">
      <i class="fas fa-share-nodes"></i>
      <span>Share</span>
    </button>
    <div class="share-dropdown" id="shareDropdown" role="menu" aria-labelledby="shareBtn">
      <button class="share-option" id="copyLinkBtn" role="menuitem"><i class="fas fa-link"></i> Copy link</button>
      <a class="share-option" id="shareWhatsapp" href="#" target="_blank" rel="noopener" role="menuitem"><i class="fab fa-whatsapp"></i> WhatsApp</a>
      <a class="share-option" id="shareTwitter" href="#" target="_blank" rel="noopener" role="menuitem"><i class="fab fa-twitter"></i> Twitter / X</a>
      <a class="share-option" id="shareReddit" href="#" target="_blank" rel="noopener" role="menuitem"><i class="fab fa-reddit"></i> Reddit</a>
    </div>
  </div>
</nav>

<div class="width-indicator" id="widthIndicator"></div>

<div class="wrapper">
  <div class="page" id="page">
    <div class="drag-handle" id="dragHandle" title="Drag to resize" aria-label="Drag to resize page width" role="slider" aria-valuemin="320" aria-valuemax="2000" aria-valuenow="680"></div>

    <div class="back-link">
      <a href="/">← Back to Home</a>
    </div>

    <div class="post-container" id="postContainer">
      <div class="loading">Loading post...</div>
    </div>

    <!-- Comments live inside the page column -->
    <div class="comments-wrap" id="commentsWrap" style="display:none;">

      <!-- Divider -->
      <div class="comments-divider">
        <span class="comments-divider-label">reader notes</span>
      </div>

      <!-- Form first -->
      <div class="comment-form-section">
        <div class="comment-form-title">add your note</div>
        <div class="reply-indicator" id="replyIndicator">
          <span>Replying to <span id="replyToName"></span></span>
          <span class="cancel-reply" id="cancelReply" tabindex="0" role="button" aria-label="Cancel reply">✕</span>
        </div>
        <form class="comment-form" id="commentForm">
          <input type="hidden" id="commentParentId" value="">
          <input type="text" id="commentName" placeholder="Your name" maxlength="60" required autocomplete="off">
          <textarea id="commentBody" placeholder="Write something…" maxlength="2000" required></textarea>
          <div class="comment-form-row">
            <span class="comment-feedback" id="commentFeedback"></span>
            <button type="submit" class="comment-submit" id="commentSubmit">leave it ↓</button>
          </div>
        </form>
      </div>

      <!-- List below -->
      <div class="comments-list-section">
        <div class="comments-header">
          <h3>Comments</h3>
          <span class="comments-count" id="commentsCount"></span>
        </div>
        <div class="comment-list" id="commentList"></div>
      </div>

    </div>

  </div>
</div>

<script>
  (function() {
    // ------------------------------------------------------------
    // CONFIG & INIT
    // ------------------------------------------------------------
    const SUPABASE_URL = "https://lbpkgvmxxcubzbzwoswd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicGtndm14eGN1Ynpiendvc3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNzM2OTQsImV4cCI6MjA4Njg0OTY5NH0.BaP0JY9v74qJPu9qRYoL1Mn3NWM3I-VB51dczOvxnrI";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // DOM elements
    const nav       = document.getElementById('mainNav');
    const typeLabel = document.getElementById('postTypeLabel');
    const container = document.getElementById('postContainer');

    // ------------------------------------------------------------
    // RESIZABLE PAGE (enhanced for touch)
    // ------------------------------------------------------------
    (function() {
      const page      = document.getElementById('page');
      const handle    = document.getElementById('dragHandle');
      const indicator = document.getElementById('widthIndicator');
      const STORAGE_KEY = 'colin-archive-page-width';
      const MIN_W = 320;
      const MAX_W = () => window.innerWidth - 32;

      // Restore saved width
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const w = Math.min(parseInt(saved), MAX_W());
        page.style.width = w + 'px';
        document.documentElement.style.setProperty('--page-width', w + 'px');
        handle.setAttribute('aria-valuenow', w);
      }

      let startX, startW, rafId;

      function setWidth(newW, updateAria = true) {
        newW = Math.min(Math.max(newW, MIN_W), MAX_W());
        page.style.width = newW + 'px';
        indicator.textContent = newW + 'px';
        if (updateAria) handle.setAttribute('aria-valuenow', newW);
      }

      function onDragStart(clientX) {
        startX = clientX;
        startW = page.offsetWidth;
        document.body.classList.add('is-resizing');
        handle.classList.add('dragging');
        indicator.textContent = startW + 'px';
        indicator.style.left = (clientX + 14) + 'px';
        indicator.style.top  = (clientY - 10) + 'px';
        indicator.classList.add('visible');
      }

      function onDragMove(clientX) {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(() => {
          const newW = startW + (clientX - startX);
          setWidth(newW, false);
          indicator.style.left = (clientX + 14) + 'px';
          indicator.style.top  = (clientY - 10) + 'px';
        });
      }

      function onDragEnd() {
        if (rafId) cancelAnimationFrame(rafId);
        document.body.classList.remove('is-resizing');
        handle.classList.remove('dragging');
        indicator.classList.remove('visible');
        localStorage.setItem(STORAGE_KEY, parseInt(page.style.width));
      }

      // Mouse events
      handle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        onDragStart(e.clientX);
        const onMove = (e) => onDragMove(e.clientX);
        const onUp = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          onDragEnd();
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      });

      // Touch events
      handle.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        onDragStart(touch.clientX);
        const onMove = (e) => {
          e.preventDefault();
          onDragMove(e.touches[0].clientX);
        };
        const onUp = () => {
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onUp);
          window.removeEventListener('touchcancel', onUp);
          onDragEnd();
        };
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp, { passive: false });
        window.addEventListener('touchcancel', onUp, { passive: false });
      }, { passive: false });

      // Keyboard accessibility not needed for drag handle
    })();

    // ------------------------------------------------------------
    // SHARE DROPDOWN (with keyboard support)
    // ------------------------------------------------------------
    const shareBtn = document.getElementById('shareBtn');
    const shareDropdown = document.getElementById('shareDropdown');
    const shareWrap = document.getElementById('shareWrap');

    shareBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (navigator.share && window.innerWidth < 700) {
        navigator.share({
          title: document.title,
          url: location.href
        }).catch(() => {});
        return;
      }
      const isOpen = shareDropdown.classList.contains('open');
      shareDropdown.classList.toggle('open');
      shareBtn.setAttribute('aria-expanded', !isOpen);
    });

    // Close on outside click
    document.addEventListener('click', (e) => {
      if (!shareWrap.contains(e.target) && shareDropdown.classList.contains('open')) {
        shareDropdown.classList.remove('open');
        shareBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // Keyboard navigation inside dropdown
    shareDropdown.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        shareDropdown.classList.remove('open');
        shareBtn.setAttribute('aria-expanded', 'false');
        shareBtn.focus();
      }
    });

    // Copy link button
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    copyLinkBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        copyLinkBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        copyLinkBtn.classList.add('copy-success');
        setTimeout(() => {
          copyLinkBtn.innerHTML = '<i class="fas fa-link"></i> Copy link';
          copyLinkBtn.classList.remove('copy-success');
        }, 1800);
      } catch(err) {
        console.error(err);
      }
    });

    // ------------------------------------------------------------
    // HELPERS
    // ------------------------------------------------------------
    function getPostId() { return new URLSearchParams(location.search).get("id"); }
    function escapeHtml(s) {
      if (!s) return "";
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }
    function relTime(iso) {
      const d = new Date(iso), diff = Date.now() - d;
      const s=diff/1e3, m=s/60, h=m/60, day=h/24;
      if (s<60)  return 'just now';
      if (m<60)  return Math.floor(m)+'m ago';
      if (h<24)  return Math.floor(h)+'h ago';
      if (day<2) return 'yesterday';
      if (day<7) return Math.floor(day)+'d ago';
      return new Date(iso).toLocaleDateString();
    }

    // ------------------------------------------------------------
    // META TAGS
    // ------------------------------------------------------------
    function setMeta(post) {
      const title   = post.title   || 'Colin Archive';
      const excerpt = post.excerpt || 'A quiet archive of essays, code, and notes.';
      const image   = post.cover_url || 'https://yourdomain.com/og-image.jpg';
      document.title = `${title} — Colin Archive`;
      document.getElementById('metaDesc').content = excerpt;
      document.getElementById('ogTitle').content  = title;
      document.getElementById('ogDesc').content   = excerpt;
      document.getElementById('ogUrl').content    = location.href;
      document.getElementById('ogImage').content  = image;
      document.getElementById('twTitle').content  = title;
      document.getElementById('twDesc').content   = excerpt;
    }

    // ------------------------------------------------------------
    // RENDER POST
    // ------------------------------------------------------------
    function normalizeIndent(text) {
      const lines = text.split('\n');
      let min = Infinity;
      lines.forEach(l => { if (l.trim()) min = Math.min(min, l.match(/^(\s*)/)[0].length); });
      if (!isFinite(min)) min = 0;
      return lines.map(l => l.slice(min)).join('\n');
    }
    function calcReadTime(text) {
      return Math.max(1, Math.round((text||'').trim().split(/\s+/).length / 200));
    }

    function renderPost(post) {
      setMeta(post);

      const type     = post.type || 'essay';
      const isPaid   = post.access === 'paid';
      const metaDate = new Date(post.created_at).toLocaleDateString();
      const readTime = post.readtime || calcReadTime(post.content);
      const colorMap = { essay:'#4ecdc4', code:'#51cf66', notes:'#ffe66d' };
      const typeColor = colorMap[type] || '#4ecdc4';

      nav.className = `nav-type-${type}`;
      typeLabel.className = `post-type-label ${type}`;
      typeLabel.textContent = type==='code' ? 'code' : type==='notes' ? 'note' : 'essay';

      // Update share button color and ARIA
      document.documentElement.style.setProperty('--type-color', typeColor);

      const tags = (post.tags||"").split(",").filter(Boolean)
        .map(t=>`<span class="tag">${escapeHtml(t.trim())}</span>`).join("");

      let contentText = post.content || '';
      if (type === 'code') contentText = normalizeIndent(contentText);
      const esc = escapeHtml(contentText);

      let contentHtml;
      if (isPaid) {
        contentHtml = `
          <div style="position:relative;">
            <i class="fas fa-lock locked-icon"></i>
            <h1 class="title">${escapeHtml(post.title)}</h1>
            <div class="meta">${metaDate} • ${readTime} min read</div>
            ${tags ? `<div class="tags">${tags}</div>` : ""}
            <div class="locked-message">
              <h3>🔒 PAID ENTRY</h3>
              <p>This post requires access.</p>
              <a class="btn" href="#">Unlock</a>
            </div>
          </div>`;
      } else if (type === 'code') {
        const lines = esc.split('\n');
        contentHtml = `
          <h1 class="title">${escapeHtml(post.title)}</h1>
          <div class="meta">${metaDate} • ${readTime} min read</div>
          ${tags ? `<div class="tags">${tags}</div>` : ""}
          <div class="terminal">
            <div class="terminal-header">
              <span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span>
              <span class="terminal-title">Terminal</span>
            </div>
            <div class="terminal-body">
              <div class="line-numbers">${lines.map((_,i)=>`<div>${i+1}</div>`).join('')}</div>
              <div class="code-lines">${lines.map(l=>`<span class="code-line">${l||' '}</span>`).join('')}</div>
            </div>
            <button class="copy-btn" id="copyCodeBtn"><i class="far fa-copy"></i> Copy</button>
          </div>`;
      } else {
        contentHtml = `
          <h1 class="title">${escapeHtml(post.title)}</h1>
          <div class="meta">${metaDate} • ${readTime} min read</div>
          ${tags ? `<div class="tags">${tags}</div>` : ""}
          <div class="content">${esc}</div>`;
      }

      container.innerHTML = `<div class="type-${type}">${contentHtml}</div>`;

      // Code copy button
      if (type==='code' && !isPaid) {
        const btn = document.getElementById('copyCodeBtn');
        if (btn) btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(contentText);
            btn.classList.add('copied'); btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '<i class="far fa-copy"></i> Copy'; }, 2000);
          } catch(e) { console.error(e); }
        });
      }

      // Show comments only for non-locked posts
      if (!isPaid) initComments(post.id);
    }

    // ------------------------------------------------------------
    // COMMENTS with replies (enhanced error messages)
    // ------------------------------------------------------------
    let currentPostId = null;
    let replyParentId = null;
    let replyToName = '';

    const replyIndicator = document.getElementById('replyIndicator');
    const replyToNameSpan = document.getElementById('replyToName');
    const cancelReplyBtn = document.getElementById('cancelReply');
    const commentParentId = document.getElementById('commentParentId');

    function setReply(parentId, name) {
      replyParentId = parentId;
      replyToName = name;
      commentParentId.value = parentId;
      replyToNameSpan.textContent = name;
      replyIndicator.style.display = 'flex';
      document.getElementById('commentBody').focus();
    }

    cancelReplyBtn.addEventListener('click', () => cancelReply());
    cancelReplyBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        cancelReply();
      }
    });

    function cancelReply() {
      replyParentId = null;
      replyToName = '';
      commentParentId.value = '';
      replyIndicator.style.display = 'none';
    }

    // Build comment tree
    function buildCommentTree(comments, parentId = null) {
      return comments
        .filter(c => c.parent_id === parentId)
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
        .map(c => ({
          ...c,
          replies: buildCommentTree(comments, c.id)
        }));
    }

    function renderCommentTree(comments) {
      if (!comments.length) return '';
      return comments.map(c => {
        const date = relTime(c.created_at);
        const name = escapeHtml(c.name);
        const body = escapeHtml(c.content);
        const replyBtn = `<button class="comment-reply-btn" data-parent-id="${c.id}" data-parent-name="${c.name}"><i class="fas fa-reply"></i> reply</button>`;
        const repliesHtml = c.replies.length ? `<div class="comment-thread">${renderCommentTree(c.replies)}</div>` : '';
        return `
          <div class="comment-item" data-comment-id="${c.id}">
            <div class="comment-item-header">
              <span class="comment-item-name">${name}</span>
              <span class="comment-item-date">${date}</span>
            </div>
            <div class="comment-item-body">${body}</div>
            ${replyBtn}
            ${repliesHtml}
          </div>
        `;
      }).join('');
    }

    async function loadComments(postId) {
      const list    = document.getElementById('commentList');
      const countEl = document.getElementById('commentsCount');

      const { data, error } = await db
        .from('comments')
        .select('id, name, content, created_at, parent_id')
        .eq('post_id', postId)
        .eq('approved', true)
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Error loading comments:', error);
        list.innerHTML = '<div class="comments-empty">Could not load comments.</div>';
        if (countEl) countEl.textContent = '';
        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML = '<div class="comments-empty">No comments yet.</div>';
        if (countEl) countEl.textContent = '';
        return;
      }

      const tree = buildCommentTree(data);
      if (countEl) countEl.textContent = `(${data.length})`;

      list.innerHTML = renderCommentTree(tree);

      // Attach reply button listeners
      list.querySelectorAll('.comment-reply-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const parentId = btn.dataset.parentId;
          const parentName = btn.dataset.parentName;
          setReply(parentId, parentName);
        });
      });
    }

    function initComments(postId) {
      currentPostId = postId;
      document.getElementById('commentsWrap').style.display = '';
      loadComments(postId);

      const form     = document.getElementById('commentForm');
      const nameEl   = document.getElementById('commentName');
      const bodyEl   = document.getElementById('commentBody');
      const feedback = document.getElementById('commentFeedback');
      const submit   = document.getElementById('commentSubmit');
      const parentIdInput = document.getElementById('commentParentId');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = nameEl.value.trim();
        const body = bodyEl.value.trim();
        const parentId = parentIdInput.value ? parseInt(parentIdInput.value) : null;

        if (!name || !body) {
          feedback.textContent = 'Name and comment are required.';
          feedback.classList.add('error');
          return;
        }

        submit.disabled = true;
        feedback.textContent = '';
        feedback.className = 'comment-feedback';

        const { error } = await db.from('comments').insert({
          post_id: postId,
          name,
          content: body,
          parent_id: parentId
        });

        if (error) {
          console.error('Comment insert error:', error);
          feedback.textContent = error.message || 'Failed to post. Try again.';
          feedback.classList.add('error');
          submit.disabled = false;
          return;
        }

        nameEl.value = '';
        bodyEl.value = '';
        parentIdInput.value = '';
        cancelReply();
        feedback.textContent = 'Posted!';
        feedback.classList.remove('error');
        submit.disabled = false;
        loadComments(postId);
      });
    }

    // ------------------------------------------------------------
    // LOAD POST
    // ------------------------------------------------------------
    async function loadPost() {
      const id = getPostId();
      if (!id) {
        container.innerHTML = "<div class='loading'>No post ID specified</div>";
        return;
      }
      const { data, error } = await db.from("posts").select("*").eq("id", id).single();
      if (error) {
        console.error(error);
        container.innerHTML = `<div class='loading'>Error loading post: ${error.message}</div>`;
        return;
      }
      if (!data) {
        container.innerHTML = "<div class='loading'>Post not found</div>";
        return;
      }
      renderPost(data);
    }

    loadPost();
  })();
</script>
