<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Comments — Colin Archive</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0d0d0d;
  --paper: #1a1a1a;
  --fg: #e8e8e8;
  --muted: #b8b8b8;
  --border: #2a2a2a;
  --highlight: rgba(31, 31, 31, 0.85);
  --red: #ff6b6b;
  --blue: #4ecdc4;
  --green: #51cf66;
  --yellow: #ffe66d;
  --serif: 'Crimson Text', 'Georgia', serif;
  --mono: 'IBM Plex Mono', 'Courier New', monospace;
  --hand: 'Caveat', cursive;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--serif);
  min-height: 100vh;
  line-height: 1.6;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 4px
  );
  pointer-events: none;
  z-index: 0;
  animation: paperSlide 20s linear infinite;
}
@keyframes paperSlide { 0%{transform:translateY(0)} 100%{transform:translateY(4px)} }

.container { width: 100%; position: relative; z-index: 2; }

/* HEADER */
header {
  padding: 2rem 3rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 2rem;
  background: var(--paper);
  position: sticky;
  top: 0;
  z-index: 100;
  flex-wrap: wrap;
}

.logo {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 500;
  text-decoration: none;
  color: var(--fg);
}
.logo::after {
  content: '|';
  color: var(--red);
  animation: blink 1s step-end infinite;
  margin-left: 2px;
}
@keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

.header-nav {
  display: flex;
  gap: 2rem;
  align-items: center;
  font-family: var(--mono);
  font-size: 0.7rem;
  flex-wrap: wrap;
}
.header-nav a,
.header-nav button {
  color: var(--muted);
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  transition: color 0.3s;
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: inherit;
  padding: 0;
  line-height: 1;
}
.header-nav a:hover,
.header-nav button:hover { color: var(--blue); }

.user-menu { display: flex; align-items: center; gap: 1rem; color: var(--blue); }
.user-email {
  font-size: 0.7rem; text-transform: none; letter-spacing: 0;
  max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.logout-btn { color: var(--red); }
.logout-btn:hover { color: #ff8a8a; }

/* LOGIN MODAL */
.modal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  align-items: center; justify-content: center; z-index: 1000;
}
.modal.active { display: flex; }
.modal-content {
  background: var(--paper); border: 1px solid var(--border);
  padding: 2rem; max-width: 350px; width: 90%;
  border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.modal-content h3 { margin-bottom: 1rem; font-family: var(--mono); color: var(--fg); }
.modal-content input {
  width: 100%; padding: 0.75rem; margin-bottom: 1rem;
  background: var(--highlight); border: 1px solid var(--border);
  color: var(--fg); font-family: var(--mono);
}
.modal-content button {
  width: 100%; padding: 0.75rem; background: var(--blue);
  border: none; color: #000; font-family: var(--mono);
  font-weight: bold; cursor: pointer; margin-bottom: 0.5rem;
}
.modal-content button:hover { opacity: 0.9; }
.modal-close { background: transparent !important; color: var(--muted) !important; border: 1px solid var(--border) !important; }
.error-message { color: var(--red); font-size: 0.8rem; margin-top: 0.5rem; font-family: var(--mono); }

/* MAIN */
.main-wrap {
  padding: 3rem;
  background: var(--paper);
  min-height: calc(100vh - 80px);
}

.page-header {
  margin-bottom: 2rem;
  padding-bottom: 1.5rem;
  border-bottom: 2px solid var(--fg);
  position: relative;
}
.page-header::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0;
  width: 30%; height: 2px;
  background: var(--red);
  animation: underlineGrow 1.5s ease forwards;
}
@keyframes underlineGrow { 0%{width:0%} 100%{width:30%} }

.page-header h1 {
  font-family: var(--serif);
  font-size: 2.5rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}
.page-subtitle { font-style: italic; color: var(--muted); font-size: 1rem; }

/* LOCKED STATE */
.locked-state {
  padding: 4rem;
  text-align: center;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.875rem;
}

/* FILTERS */
.filters {
  display: flex;
  gap: 1rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 250px;
  padding: 0.75rem 1rem;
  background: var(--highlight);
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 0.875rem;
  transition: all 0.3s;
}
.search-box::placeholder { color: var(--muted); }
.search-box:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(78,205,196,0.1); }

.filter-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.filter-tag {
  padding: 0.5rem 1rem;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s;
}
.filter-tag:hover, .filter-tag.active {
  border-color: var(--blue); color: var(--blue);
  background: rgba(78,205,196,0.05);
}
.filter-tag.active-red { border-color: var(--red); color: var(--red); background: rgba(255,107,107,0.05); }

/* STATS BAR */
.stats-bar {
  display: flex;
  gap: 1.5rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}
.stat-pill {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.stat-pill span { color: var(--fg); margin-right: 0.3rem; }

/* COMMENT LIST */
.comment-list { display: flex; flex-direction: column; gap: 0; }

.comment-row {
  display: flex;
  align-items: flex-start;
  gap: 1.5rem;
  padding: 1.4rem 0;
  border-bottom: 1px solid var(--border);
  transition: background 0.2s, padding 0.2s;
  border-radius: 4px;
}
.comment-row:last-child { border-bottom: none; }
.comment-row:hover {
  background: rgba(78,205,196,0.04);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  margin-left: -0.75rem;
  margin-right: -0.75rem;
}

.comment-main { flex: 1; min-width: 0; }

.comment-top {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  margin-bottom: 0.35rem;
  flex-wrap: wrap;
}
.comment-name {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--blue);
  letter-spacing: 0.05em;
}
.comment-date {
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--muted);
  opacity: 0.6;
}
.comment-post-link {
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--muted);
  text-decoration: none;
  border-bottom: 1px solid var(--border);
  transition: color 0.2s, border-color 0.2s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
  display: inline-block;
}
.comment-post-link:hover { color: var(--blue); border-color: var(--blue); }

.comment-body {
  font-size: 0.975rem;
  line-height: 1.65;
  color: var(--muted);
  white-space: pre-wrap;
  word-break: break-word;
}

/* Delete button — matches delete-btn style from admin */
.comment-delete-btn {
  flex-shrink: 0;
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--red);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 0.3rem 0.6rem;
  cursor: pointer;
  transition: all 0.2s;
  opacity: 0.5;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
}
.comment-delete-btn:hover {
  opacity: 1;
  border-color: var(--red);
  background: rgba(255,107,107,0.07);
}

.empty-state {
  padding: 3rem;
  text-align: center;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.875rem;
}

.loading-state {
  padding: 3rem;
  text-align: center;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.875rem;
}

@media (max-width: 1024px) {
  .main-wrap { padding: 2rem 1.5rem; }
  header { padding: 1.5rem; flex-direction: column; align-items: flex-start; }
  .header-nav { flex-direction: row; flex-wrap: wrap; gap: 1rem; }
  .filters { flex-direction: column; }
  .search-box { width: 100%; }
}
@media (max-width: 600px) {
  .comment-row { flex-direction: column; gap: 0.75rem; }
  .comment-delete-btn { align-self: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <a href="/" class="logo">Colin Archive</a>
    <nav class="header-nav" id="headerNav"></nav>
  </header>

  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h3>Log in to Archive</h3>
      <input type="email" id="loginEmail" placeholder="Email" />
      <input type="password" id="loginPassword" placeholder="Password" />
      <button id="loginSubmit">Log In</button>
      <button class="modal-close" id="closeModal">Cancel</button>
      <div class="error-message" id="loginError"></div>
    </div>
  </div>

  <div class="main-wrap">
    <div class="page-header">
      <h1>Comments</h1>
      <p class="page-subtitle">Moderate reader comments</p>
    </div>

    <div id="appContent">
      <div class="locked-state">You must be logged in to manage comments.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://lbpkgvmxxcubzbzwoswd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicGtndm14eGN1Ynpiendvc3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNzM2OTQsImV4cCI6MjA4Njg0OTY5NH0.BaP0JY9v74qJPu9qRYoL1Mn3NWM3I-VB51dczOvxnrI";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser   = null;
let allComments   = [];
let allPosts      = {};  // id -> title map
let currentFilter = 'all';
let currentSearch = '';

const headerNav  = document.getElementById('headerNav');
const loginModal = document.getElementById('loginModal');
const appContent = document.getElementById('appContent');

// ── Auth ──
function updateHeaderUI() {
  if (currentUser) {
    headerNav.innerHTML = `
      <a href="/">Archive</a>
      <div class="user-menu">
        <span class="user-email">${escapeHtml(currentUser.email)}</span>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>`;
    document.getElementById('logoutBtn').addEventListener('click', logout);
  } else {
    headerNav.innerHTML = `<button id="loginBtn">Login</button>`;
    document.getElementById('loginBtn').addEventListener('click', () => loginModal.classList.add('active'));
  }
}

async function logout() {
  await db.auth.signOut();
  currentUser = null;
  updateHeaderUI();
  appContent.innerHTML = '<div class="locked-state">You must be logged in to manage comments.</div>';
}

async function checkSession() {
  const { data: { session } } = await db.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    updateHeaderUI();
    await loadData();
  } else {
    updateHeaderUI();
  }
}

document.getElementById('loginSubmit').addEventListener('click', async () => {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errEl    = document.getElementById('loginError');
  if (!email || !password) { errEl.textContent = 'Email and password required'; return; }
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  currentUser = data.user;
  loginModal.classList.remove('active');
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  errEl.textContent = '';
  updateHeaderUI();
  await loadData();
});

document.getElementById('closeModal').addEventListener('click', () => {
  loginModal.classList.remove('active');
  document.getElementById('loginError').textContent = '';
});
loginModal.addEventListener('click', (e) => {
  if (e.target === loginModal) {
    loginModal.classList.remove('active');
    document.getElementById('loginError').textContent = '';
  }
});

// ── Data ──
async function loadData() {
  appContent.innerHTML = '<div class="loading-state">Loading comments…</div>';

  // Load posts for title lookup
  const { data: posts } = await db.from('posts').select('id, title');
  if (posts) posts.forEach(p => { allPosts[p.id] = p.title; });

  // Load all comments (admin sees all including unapproved)
  const { data: comments, error } = await db
    .from('comments')
    .select('id, post_id, name, content, created_at, approved')
    .order('created_at', { ascending: false });

  if (error) {
    appContent.innerHTML = `<div class="loading-state">Error loading comments: ${escapeHtml(error.message)}</div>`;
    return;
  }

  allComments = comments || [];
  renderUI();
}

// ── Render ──
function renderUI() {
  const filtered = getFiltered();
  const total    = allComments.length;
  const approved = allComments.filter(c => c.approved).length;

  appContent.innerHTML = `
    <div class="stats-bar">
      <div class="stat-pill"><span>${total}</span> total</div>
      <div class="stat-pill"><span>${approved}</span> approved</div>
      <div class="stat-pill"><span>${total - approved}</span> pending</div>
    </div>
    <div class="filters">
      <input type="text" class="search-box" id="searchBox" placeholder="Search comments…" value="${escapeHtml(currentSearch)}">
      <div class="filter-tags">
        <button class="filter-tag ${currentFilter==='all'?'active':''}" data-filter="all">All</button>
        <button class="filter-tag ${currentFilter==='approved'?'active':''}" data-filter="approved">Approved</button>
        <button class="filter-tag ${currentFilter==='pending'?'active-red':''}" data-filter="pending">Pending</button>
      </div>
    </div>
    <div class="comment-list" id="commentList"></div>
  `;

  // Attach filter/search events
  document.getElementById('searchBox').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderList();
  });
  document.querySelectorAll('.filter-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      renderList();
    });
  });

  renderList();
}

function renderList() {
  const list     = document.getElementById('commentList');
  const filtered = getFiltered();

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">No comments match.</div>';
    return;
  }

  list.innerHTML = filtered.map(c => {
    const postTitle = allPosts[c.post_id] || 'Unknown post';
    const date      = relTime(c.created_at);
    return `
      <div class="comment-row" data-id="${c.id}">
        <div class="comment-main">
          <div class="comment-top">
            <span class="comment-name">${escapeHtml(c.name)}</span>
            <span class="comment-date">${date}</span>
            <a class="comment-post-link" href="/post.html?id=${escapeHtml(c.post_id)}" target="_blank" rel="noopener">${escapeHtml(postTitle)}</a>
          </div>
          <div class="comment-body">${escapeHtml(c.content)}</div>
        </div>
        <button class="comment-delete-btn" onclick="deleteComment('${c.id}')">Delete</button>
      </div>
    `;
  }).join('');
}

function getFiltered() {
  let f = allComments;
  if (currentFilter === 'approved') f = f.filter(c => c.approved);
  if (currentFilter === 'pending')  f = f.filter(c => !c.approved);
  if (currentSearch) {
    const s = currentSearch.toLowerCase();
    f = f.filter(c =>
      (c.name || '').toLowerCase().includes(s) ||
      (c.content || '').toLowerCase().includes(s) ||
      (allPosts[c.post_id] || '').toLowerCase().includes(s)
    );
  }
  return f;
}

// ── Delete ──
async function deleteComment(id) {
  if (!confirm('Delete this comment forever?')) return;
  const { error } = await db.from('comments').delete().eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  allComments = allComments.filter(c => c.id !== id);
  renderUI();
}

// ── Helpers ──
function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function relTime(iso) {
  const d = new Date(iso), now = Date.now(), diff = now - d;
  const s=diff/1e3, m=s/60, h=m/60, day=h/24;
  if (s<60)  return 'just now';
  if (m<60)  return Math.floor(m)+'m ago';
  if (h<24)  return Math.floor(h)+'h ago';
  if (day<2) return 'yesterday';
  if (day<7) return Math.floor(day)+'d ago';
  return new Date(iso).toLocaleDateString();
}

// ── Boot ──
checkSession();
</script>

</body>
</html>
