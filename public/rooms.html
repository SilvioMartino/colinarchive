<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Rooms — Colin Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #121212;
  --fg:    #f1f1f1;
  --fg2:   #dbdbdb;
  --muted: #bbbbbb;
  --soft:  #9b9b9b;
  --bdr:   #313131;
  --blue:  #61d7cf;
  --vio:   #c69dff;
  --serif: 'Crimson Text', Georgia, serif;
  --mono:  'IBM Plex Mono', monospace;
  --hand:  'Caveat', cursive;
  --snap:  cubic-bezier(.22,1,.36,1);
  --heavy: cubic-bezier(.77,0,.18,1);
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { color-scheme:dark; }
body { background:var(--bg); color:var(--fg); font-family:var(--serif); overflow:hidden; height:100dvh; }

body::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:9000;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.045) 2px,rgba(0,0,0,.045) 4px);
}

/* ══ WELCOME ══ */
#welcome {
  position:fixed; inset:0; z-index:800;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.8rem;
  background:radial-gradient(ellipse at 60% 40%, rgba(97,215,207,.08), transparent 55%),
             radial-gradient(ellipse at 30% 70%, rgba(198,157,255,.05), transparent 50%),
             linear-gradient(160deg,#161616 0%,#0e0e0e 100%);
  pointer-events:none;
}
#welcome.done { animation:wFade .65s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes wFade { to { opacity:0; transform:scale(.97) translateY(-6px); visibility:hidden; } }
#welcome::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(circle, rgba(97,215,207,.08) 1px, transparent 1px);
  background-size:36px 36px;
  mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);
  opacity:0; animation:wUp .8s .05s ease forwards;
}
.w-tag { font-family:var(--mono); font-size:.52rem; letter-spacing:.38em; text-transform:uppercase; color:var(--blue); opacity:0; animation:wUp .45s .08s ease forwards; }
.w-h   { font-family:var(--hand); font-size:clamp(5.5rem,16vw,11rem); font-weight:600; line-height:.88; text-align:center; color:var(--fg); opacity:0; animation:wUp .65s .22s ease forwards; letter-spacing:-.01em; }
.w-h em { color:var(--blue); font-style:normal; }
.w-rule { width:0; height:1px; background:linear-gradient(90deg,transparent,var(--blue),transparent); box-shadow:0 0 12px rgba(97,215,207,.3); animation:wRule .9s .62s ease forwards; }
@keyframes wRule { to { width:120px; } }
.w-sub { font-family:var(--serif); font-style:italic; font-size:clamp(1rem,2vw,1.2rem); color:rgba(255,255,255,.38); opacity:0; animation:wUp .55s .78s ease forwards; letter-spacing:.01em; }
@keyframes wUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }

/* ══ NAV ══ */
#nav {
  position:fixed; top:0; left:0; right:0; z-index:200;
  height:58px; display:flex; align-items:center; justify-content:space-between;
  padding:0 1.6rem;
  background:rgba(18,18,18,.92); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bdr);
  opacity:0; animation:wUp .4s 1.55s ease forwards;
}
.nav-logo { font-family:var(--mono); font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--fg); text-decoration:none; }
.nav-logo::after { content:'|'; color:var(--blue); animation:blink 1s step-end infinite; margin-left:2px; }
@keyframes blink { 0%,50%{opacity:1}51%,100%{opacity:0} }
.nav-r { display:flex; align-items:center; gap:1.2rem; }
.nav-tag { font-family:var(--mono); font-size:.52rem; letter-spacing:.16em; text-transform:uppercase; color:var(--soft); }
.nav-back {
  display:inline-flex; align-items:center; gap:.45rem;
  padding:0 1rem; height:38px; border-radius:999px;
  border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04);
  color:var(--fg2); font-family:var(--mono); font-size:.7rem;
  letter-spacing:.07em; text-transform:uppercase; text-decoration:none;
  transition:background .15s, border-color .15s, color .15s;
}
.nav-back:hover { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.18); color:var(--fg); }
.nav-back svg { width:9px; height:9px; }

/* ══ DESKTOP ══ */
#desktop { position:fixed; inset:0; top:58px; overflow:hidden; display:none; }

#track {
  position:absolute; left:0; right:0; top:0;
  transition:transform 1.1s cubic-bezier(.65,0,.35,1);
  will-change:transform;
}

/* ── SLIDE — full bleed image, text centered over it ── */
.slide {
  height:calc(100dvh - 58px);
  position:relative; overflow:hidden;
}

/* image layer */
.sl-img {
  position:absolute; inset:0; z-index:1;
  background:var(--ph-bg, #1a1a1a);
  overflow:hidden;
}
.sl-img img {
  width:100%; height:100%; object-fit:cover; display:block;
  filter:brightness(.55) contrast(1.06);
  opacity:0; transform:scale(1.05);
  transition:opacity 1s .15s ease, transform 1.2s .15s var(--snap), filter .6s;
}
.slide.active .sl-img img { opacity:1; transform:scale(1); filter:brightness(.62) contrast(1.05); }
.slide.exiting .sl-img img { opacity:0; transform:scale(1.02); transition:opacity .4s ease; }

/* placeholder */
.sl-ph {
  width:100%; height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem;
}
.sl-ph-label { font-family:var(--mono); font-size:.52rem; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.18); }
.sl-ph-name  { font-family:var(--serif); font-style:italic; font-size:1.1rem; color:rgba(255,255,255,.12); }

/* vignette over image */
.sl-vignette {
  position:absolute; inset:0; z-index:2; pointer-events:none;
  background:
    radial-gradient(ellipse at center, rgba(0,0,0,.1) 0%, rgba(0,0,0,.65) 100%),
    linear-gradient(to bottom, rgba(18,18,18,.5) 0%, transparent 25%, transparent 70%, rgba(18,18,18,.65) 100%);
}

/* text centered over everything */
.sl-text {
  position:absolute; inset:0; z-index:3;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center; padding:0 4rem;
  gap:0;
}

.sl-num {
  font-family:var(--mono); font-size:.52rem; letter-spacing:.3em; text-transform:uppercase;
  color:var(--rc); margin-bottom:1.4rem;
  opacity:0; transform:translateY(14px);
  transition:opacity .5s .4s ease, transform .5s .4s ease;
}

.sl-rule {
  height:1px; width:0;
  background:linear-gradient(90deg, transparent, var(--rc), transparent);
  margin-bottom:1.6rem; opacity:0;
  transition:width .7s .5s var(--snap), opacity .5s .5s ease;
}
.slide.active .sl-rule  { width:clamp(80px,10vw,160px); opacity:.6; }
.slide.exiting .sl-rule { width:0; opacity:0; transition:width .3s ease, opacity .2s ease; }

.sl-name {
  font-family:var(--hand);
  font-size:clamp(5rem,10vw,11rem);
  font-weight:600; line-height:.92; color:#fff;
  text-shadow:0 2px 48px rgba(0,0,0,.7), 0 0 80px rgba(0,0,0,.4);
  margin-bottom:1.6rem;
  opacity:0; transform:translateY(30px);
  transition:opacity .65s .55s ease, transform .65s .55s ease;
}

.sl-rule-bot {
  height:1px; width:0;
  background:linear-gradient(90deg, transparent, var(--rc), transparent);
  margin-bottom:2.2rem; opacity:0;
  transition:width .7s .6s var(--snap), opacity .5s .6s ease;
}
.slide.active .sl-rule-bot  { width:clamp(80px,10vw,160px); opacity:.6; }
.slide.exiting .sl-rule-bot { width:0; opacity:0; transition:width .3s ease, opacity .2s ease; }

.sl-enter {
  display:inline-flex; align-items:center; gap:.6rem;
  padding:0 2rem; height:50px; border-radius:999px;
  border:1px solid var(--rc);
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
  color:var(--rc); font-family:var(--mono); font-size:.7rem;
  letter-spacing:.14em; text-transform:uppercase; text-decoration:none;
  position:relative; overflow:hidden;
  opacity:0; transform:translateY(12px);
  transition:opacity .55s .68s ease, transform .55s .68s ease,
             color .25s, box-shadow .25s;
}
.sl-enter::before {
  content:''; position:absolute; inset:0;
  background:var(--rc);
  transform:translateX(-101%);
  transition:transform .35s var(--snap);
  z-index:0;
}
.sl-enter:hover::before { transform:translateX(0); }
.sl-enter:hover { color:#0e0e0e; box-shadow:0 0 32px rgba(97,215,207,.22); }
.sl-enter span, .sl-enter svg { position:relative; z-index:1; }
.sl-enter svg { width:11px; height:11px; transition:transform .25s; }
.sl-enter:hover svg { transform:translateX(3px); }

/* IN / OUT */
.slide.active .sl-num,
.slide.active .sl-name,
.slide.active .sl-enter { opacity:1; transform:none; }
.slide.exiting .sl-num   { opacity:0; transform:translateY(-14px); transition:opacity .28s ease, transform .28s ease; }
.slide.exiting .sl-name  { opacity:0; transform:translateY(-24px); transition:opacity .3s .04s ease, transform .3s .04s ease; }
.slide.exiting .sl-enter { opacity:0; transition:opacity .2s ease; }

/* ── DOTS ── */
#dots {
  position:fixed; right:1.8rem; top:50%; translate:0 -50%;
  display:none; flex-direction:column; gap:.7rem; z-index:300;
  opacity:0; animation:wUp .4s 1.7s ease forwards;
}
.dot {
  width:8px; height:8px; border-radius:50%;
  background:rgba(255,255,255,.22); cursor:pointer;
  transition:background .3s, transform .3s; position:relative;
}
.dot::before { content:''; position:absolute; inset:-6px; }
.dot.active { background:var(--rc); transform:scale(1.35); }

/* ── PROGRESS ── */
#prog-bar { position:fixed; left:0; top:58px; width:2px; height:calc(100dvh - 58px); z-index:300; display:none; }
#prog-fill { width:100%; background:var(--blue); border-radius:999px; height:0%; transition:height .65s var(--heavy), background .6s; }

/* ── COUNTER ── */
#counter {
  position:fixed; bottom:2rem; right:2.2rem;
  font-family:var(--mono); font-size:.58rem; letter-spacing:.1em;
  color:rgba(255,255,255,.3); z-index:300; display:none;
  opacity:0; animation:wUp .4s 1.8s ease forwards;
}
#counter em { font-style:normal; color:var(--blue); }

/* ══ MOBILE ══ */
#mobile { position:fixed; inset:0; top:58px; overflow:hidden; display:none; }

#mob-track {
  position:absolute; left:0; right:0; top:0;
  transition:transform 1.1s cubic-bezier(.65,0,.35,1);
  will-change:transform;
}

/* Mobile: same full-bleed image, text bottom-center */
.mslide {
  height:calc(100dvh - 58px);
  position:relative; overflow:hidden;
}

.ms-img {
  position:absolute; inset:0; z-index:1;
  background:var(--ph-bg, #1a1a1a);
  overflow:hidden;
}
.ms-img img {
  width:100%; height:100%; object-fit:cover; object-position:center center; display:block;
  filter:brightness(.52) contrast(1.06);
  opacity:0; transform:scale(1.05);
  transition:opacity 1s .15s ease, transform 1.2s .15s var(--snap), filter .6s;
}
.mslide.active .ms-img img { opacity:1; transform:scale(1); filter:brightness(.6) contrast(1.05); }
.mslide.exiting .ms-img img { opacity:0; transition:opacity .35s ease; }

.ms-ph {
  width:100%; height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.8rem;
}
.ms-ph-label { font-family:var(--mono); font-size:.5rem; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.18); }
.ms-ph-name  { font-family:var(--serif); font-style:italic; font-size:1rem; color:rgba(255,255,255,.12); }

.ms-vignette {
  position:absolute; inset:0; z-index:2; pointer-events:none;
  background:
    radial-gradient(ellipse at center, rgba(0,0,0,.08) 0%, rgba(0,0,0,.6) 100%),
    linear-gradient(to bottom, rgba(18,18,18,.4) 0%, transparent 20%, transparent 55%, rgba(18,18,18,.9) 100%);
}

/* top accent */
.mslide::after {
  content:''; position:absolute; top:0; left:0; right:0; height:1px; z-index:5;
  background:linear-gradient(90deg, var(--rc) 0%, transparent 70%);
  transform:scaleX(0); transform-origin:left;
  transition:transform .6s .05s var(--snap);
}
.mslide.active::after { transform:scaleX(1); }

/* text sits center of screen on mobile */
.ms-text {
  position:absolute; inset:0; z-index:3;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center; padding:0 2rem;
  gap:0;
}

.ms-num {
  font-family:var(--mono); font-size:.52rem; letter-spacing:.28em; text-transform:uppercase;
  color:var(--rc); margin-bottom:1.1rem;
  opacity:0; transform:translateY(14px);
  transition:opacity .42s ease, transform .42s ease;
}
.ms-rule {
  height:1px; width:0;
  background:linear-gradient(90deg, transparent, var(--rc), transparent);
  margin-bottom:1.3rem; opacity:0;
  transition:width .6s .08s var(--snap), opacity .4s .08s ease;
}
.mslide.active .ms-rule  { width:80px; opacity:.6; }
.mslide.exiting .ms-rule { width:0; opacity:0; transition:width .25s ease, opacity .2s ease; }

.ms-name {
  font-family:var(--hand);
  font-size:clamp(3.5rem,13vw,5.5rem);
  font-weight:600; line-height:.92; color:#fff;
  text-shadow:0 2px 36px rgba(0,0,0,.8);
  margin-bottom:1.3rem;
  opacity:0; transform:translateY(26px);
  transition:opacity .55s .1s ease, transform .55s .1s ease;
}
.ms-rule-bot {
  height:1px; width:0;
  background:linear-gradient(90deg, transparent, var(--rc), transparent);
  margin-bottom:1.8rem; opacity:0;
  transition:width .6s .16s var(--snap), opacity .4s .16s ease;
}
.mslide.active .ms-rule-bot  { width:80px; opacity:.6; }
.mslide.exiting .ms-rule-bot { width:0; opacity:0; transition:width .25s ease, opacity .2s ease; }

.ms-enter {
  display:inline-flex; align-items:center; gap:.55rem;
  padding:0 1.6rem; height:48px; border-radius:999px;
  border:1px solid var(--rc);
  background:rgba(0,0,0,.35); backdrop-filter:blur(10px);
  color:var(--rc); font-family:var(--mono); font-size:.68rem;
  letter-spacing:.14em; text-transform:uppercase; text-decoration:none;
  position:relative; overflow:hidden;
  opacity:0; transform:translateY(10px);
  transition:opacity .5s .22s ease, transform .5s .22s ease;
}
.ms-enter::before {
  content:''; position:absolute; inset:0;
  background:var(--rc);
  transform:translateX(-101%);
  transition:transform .35s var(--snap); z-index:0;
}
.ms-enter:active::before { transform:translateX(0); }
.ms-enter span, .ms-enter svg { position:relative; z-index:1; }
.ms-enter svg { width:10px; height:10px; }

.mslide.active .ms-num,
.mslide.active .ms-name,
.mslide.active .ms-enter { opacity:1; transform:none; }
.mslide.exiting .ms-num   { opacity:0; transform:translateY(-14px); transition:opacity .26s ease, transform .26s ease; }
.mslide.exiting .ms-name  { opacity:0; transform:translateY(-20px); transition:opacity .28s .03s ease, transform .28s .03s ease; }
.mslide.exiting .ms-enter { opacity:0; transition:opacity .2s ease; }

/* mob dots */
#mob-dots {
  position:fixed; right:.9rem; top:50%; translate:0 -50%;
  display:none; flex-direction:column; gap:.6rem; z-index:300;
  opacity:0; animation:wUp .4s 1.72s ease forwards;
}
.mdot {
  width:7px; height:7px; border-radius:50%;
  background:rgba(255,255,255,.22); cursor:pointer;
  transition:background .3s, transform .3s; position:relative;
}
.mdot::before { content:''; position:absolute; inset:-6px; }
.mdot.active { background:var(--rc); transform:scale(1.35); }

#mob-prog { position:fixed; left:0; top:58px; width:2px; height:calc(100dvh - 58px); z-index:300; display:none; }
#mob-prog-fill { width:100%; background:var(--blue); border-radius:999px; height:0%; transition:height .65s var(--heavy), background .6s; }

#mob-counter {
  position:fixed; bottom:1.4rem; right:1rem;
  font-family:var(--mono); font-size:.54rem; letter-spacing:.1em;
  color:rgba(255,255,255,.3); z-index:300; display:none;
  opacity:0; animation:wUp .4s 1.8s ease forwards;
}
#mob-counter em { font-style:normal; color:var(--blue); }

@media (max-width:700px) { .nav-tag { display:none; } }
</style>
</head>
<body>

<div id="welcome">
  <div class="w-tag">02 — Chat</div>
  <div class="w-h">The <em>Rooms.</em></div>
  <div class="w-rule"></div>
  <div class="w-sub">six conversations, always open</div>
</div>

<nav id="nav">
  <a href="/" class="nav-logo">Colin Archive</a>
  <div class="nav-r">
    <span class="nav-tag">02 — The Room</span>
    <a href="/" class="nav-back">
      <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 5H1M4 2L1 5l3 3"/></svg>
      Back
    </a>
  </div>
</nav>

<div id="desktop">
  <div id="track"></div>
  <div id="dots"></div>
  <div id="prog-bar"><div id="prog-fill"></div></div>
  <div id="counter"><em id="cur-num">1</em> / <span id="tot-num">3</span></div>
</div>

<div id="mobile">
  <div id="mob-track"></div>
  <div id="mob-dots"></div>
  <div id="mob-prog"><div id="mob-prog-fill"></div></div>
  <div id="mob-counter"><em id="mob-cur">1</em> / <span id="mob-tot">3</span></div>
</div>

<script>
'use strict';

const ROOMS = [
  {
    name:'Philosophy', num:'01', color:'#61d7cf',
    href:'/chat.html?room=philosophy',
    img:{ src:'https://lbpkgvmxxcubzbzwoswd.supabase.co/storage/v1/object/public/covers/sisyphus2.png', bg:'#1a1e1f', label:'', caption:'', pos:'center center' },
  },
  {
    name:'Anime & TV', num:'02', color:'#c69dff',
    href:'/chat.html?room=anime-tv',
    img:{ src:'https://lbpkgvmxxcubzbzwoswd.supabase.co/storage/v1/object/public/covers/lucy2.png', bg:'#1c1a22', label:'', caption:'', pos:'center 20%' },
  },
  {
    name:'Books', num:'03', color:'#61d7cf',
    href:'/chat.html?room=books',
    img:{ src:'https://lbpkgvmxxcubzbzwoswd.supabase.co/storage/v1/object/public/covers/no-mouth2.png', bg:'#1a1c1a', label:'', caption:'', pos:'center center' },
  },
];

function imgContent(r, pfx) {
  if (r.img.src) return `<img src="${r.img.src}" alt="${r.name}" loading="lazy" style="object-position:${r.img.pos}"/>`;
  return `<div class="${pfx}-ph" style="background:${r.img.bg}">
    <div class="${pfx}-ph-label">${r.img.label}</div>
    <div class="${pfx}-ph-name">${r.img.caption}</div>
  </div>`;
}

const ENTER_SVG = `<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 5h8M5.5 1.5l4 3.5-4 3.5"/></svg>`;

setTimeout(() => document.getElementById('welcome').classList.add('done'), 1900);

/* ══ DESKTOP ══ */
function initDesktop() {
  const track  = document.getElementById('track');
  const dotsEl = document.getElementById('dots');
  const fill   = document.getElementById('prog-fill');
  const curNum = document.getElementById('cur-num');
  document.getElementById('tot-num').textContent = ROOMS.length;

  ROOMS.forEach((r, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.style.setProperty('--rc', r.color);
    slide.innerHTML = `
      <div class="sl-img" style="background:${r.img.bg}">${imgContent(r,'sl')}</div>
      <div class="sl-vignette"></div>
      <div class="sl-text">
        <div class="sl-num">${r.num} — Room</div>
        <div class="sl-rule"></div>
        <div class="sl-name">${r.name}</div>
        <div class="sl-rule-bot"></div>
        <a class="sl-enter" href="${r.href}"><span>Enter</span>${ENTER_SVG}</a>
      </div>`;
    track.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(dot);
  });

  const slides = [...track.querySelectorAll('.slide')];
  const dots   = [...dotsEl.querySelectorAll('.dot')];
  const slideH = () => window.innerHeight - 58;
  let cur = 0, locked = false;

  function goTo(idx) {
    if (idx < 0 || idx >= slides.length || locked) return;
    locked = true;
    const prev = cur; cur = idx;
    slides[prev].classList.remove('active');
    slides[prev].classList.add('exiting');
    setTimeout(() => slides[prev]?.classList.remove('exiting'), 500);
    slides[cur].classList.add('active');
    track.style.transform = `translateY(${-cur * slideH()}px)`;
    const pct = slides.length > 1 ? (cur / (slides.length - 1)) * 100 : 0;
    fill.style.height = pct + '%';
    fill.style.background = ROOMS[cur].color;
    dots.forEach((d, i) => { d.classList.toggle('active', i === cur); d.style.setProperty('--rc', ROOMS[cur].color); });
    curNum.textContent = cur + 1;
    try { navigator.vibrate?.(6); } catch {}
    setTimeout(() => { locked = false; }, 1100);
  }

  slides[0].classList.add('active');
  dots[0]?.classList.add('active');
  dots.forEach(d => d.style.setProperty('--rc', ROOMS[0].color));

  let wAcc = 0, wT;
  window.addEventListener('wheel', e => {
    e.preventDefault(); clearTimeout(wT); wAcc += e.deltaY;
    wT = setTimeout(() => { if (Math.abs(wAcc) > 28) goTo(wAcc > 0 ? cur+1 : cur-1); wAcc = 0; }, 40);
  }, { passive:false });

  window.addEventListener('keydown', e => {
    if (e.key==='ArrowDown'||e.key==='ArrowRight') { e.preventDefault(); goTo(cur+1); }
    if (e.key==='ArrowUp'||e.key==='ArrowLeft')    { e.preventDefault(); goTo(cur-1); }
  });

  const desk = document.getElementById('desktop');
  let tS = 0;
  desk.addEventListener('touchstart', e => { tS = e.touches[0].clientY; }, { passive:true });
  desk.addEventListener('touchend',   e => { const d = tS - e.changedTouches[0].clientY; if (Math.abs(d) > 40) goTo(d > 0 ? cur+1 : cur-1); }, { passive:true });

  window.addEventListener('resize', () => {
    track.style.transition = 'none';
    track.style.transform  = `translateY(${-cur * slideH()}px)`;
    requestAnimationFrame(() => { track.style.transition = ''; });
  });

  dotsEl.style.display = 'flex';
  document.getElementById('prog-bar').style.display = 'block';
  document.getElementById('counter').style.display  = 'block';
}

/* ══ MOBILE ══ */
function initMobile() {
  const track  = document.getElementById('mob-track');
  const dotsEl = document.getElementById('mob-dots');
  const fill   = document.getElementById('mob-prog-fill');
  const curNum = document.getElementById('mob-cur');
  document.getElementById('mob-tot').textContent = ROOMS.length;

  ROOMS.forEach((r, i) => {
    const slide = document.createElement('div');
    slide.className = 'mslide';
    slide.style.setProperty('--rc', r.color);
    slide.innerHTML = `
      <div class="ms-img" style="background:${r.img.bg}">${imgContent(r,'ms')}</div>
      <div class="ms-vignette"></div>
      <div class="ms-text">
        <div class="ms-num">${r.num} — Room</div>
        <div class="ms-rule"></div>
        <div class="ms-name">${r.name}</div>
        <div class="ms-rule-bot"></div>
        <a class="ms-enter" href="${r.href}"><span>Enter</span>${ENTER_SVG}</a>
      </div>`;
    track.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'mdot';
    dot.addEventListener('click', () => mobGoTo(i));
    dotsEl.appendChild(dot);
  });

  const slides = [...track.querySelectorAll('.mslide')];
  const dots   = [...dotsEl.querySelectorAll('.mdot')];
  const slideH = () => window.innerHeight - 58;
  let cur = 0, locked = false;

  function mobGoTo(idx) {
    if (idx < 0 || idx >= slides.length || locked) return;
    locked = true;
    const prev = cur; cur = idx;
    slides[prev].classList.remove('active');
    slides[prev].classList.add('exiting');
    setTimeout(() => slides[prev]?.classList.remove('exiting'), 450);
    slides[cur].classList.add('active');
    track.style.transform = `translateY(${-cur * slideH()}px)`;
    const pct = slides.length > 1 ? (cur / (slides.length - 1)) * 100 : 0;
    fill.style.height = pct + '%';
    fill.style.background = ROOMS[cur].color;
    dots.forEach((d, i) => { d.classList.toggle('active', i === cur); d.style.setProperty('--rc', ROOMS[cur].color); });
    curNum.textContent = cur + 1;
    try { navigator.vibrate?.(7); } catch {}
    setTimeout(() => { locked = false; }, 1100);
  }

  slides[0].classList.add('active');
  dots[0]?.classList.add('active');
  dots.forEach(d => d.style.setProperty('--rc', ROOMS[0].color));

  let tY = 0, tX = 0, moved = false;
  const mob = document.getElementById('mobile');
  mob.addEventListener('touchstart', e => { tY=e.touches[0].clientY; tX=e.touches[0].clientX; moved=false; }, { passive:true });
  mob.addEventListener('touchmove',  () => { moved=true; }, { passive:true });
  mob.addEventListener('touchend',   e => {
    if (!moved) return;
    const dy = tY - e.changedTouches[0].clientY;
    const dx = Math.abs(tX - e.changedTouches[0].clientX);
    if (dx > Math.abs(dy) * 1.2) return;
    if (Math.abs(dy) > 42) mobGoTo(dy > 0 ? cur+1 : cur-1);
  }, { passive:true });

  let wA=0, wT;
  mob.addEventListener('wheel', e => {
    e.preventDefault(); clearTimeout(wT); wA += e.deltaY;
    wT = setTimeout(() => { if (Math.abs(wA) > 28) mobGoTo(wA > 0 ? cur+1 : cur-1); wA=0; }, 40);
  }, { passive:false });

  window.addEventListener('resize', () => {
    track.style.transition = 'none';
    track.style.transform  = `translateY(${-cur * slideH()}px)`;
    requestAnimationFrame(() => { track.style.transition = ''; });
  });

  dotsEl.style.display = 'flex';
  document.getElementById('mob-prog').style.display    = 'block';
  document.getElementById('mob-counter').style.display = 'block';
}

/* ══ MOUNT ══ */
function isMobile() {
  return window.innerWidth <= 700 || (window.matchMedia('(pointer:coarse)').matches && window.innerWidth <= 900);
}
setTimeout(() => {
  if (isMobile()) {
    document.getElementById('mobile').style.display = 'block';
    initMobile();
  } else {
    document.getElementById('desktop').style.display = 'block';
    initDesktop();
  }
}, 1700);
</script>
</body>
