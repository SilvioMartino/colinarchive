<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post — Colin Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" id="metaDesc" content="A quiet archive of essays, code, and notes." />
  <meta property="og:title" id="ogTitle" content="Colin Archive" />
  <meta property="og:description" id="ogDesc" content="A quiet archive of essays, code, and notes." />
  <meta property="og:type" content="article" />
  <meta property="og:url" id="ogUrl" content="" />
  <meta property="og:image" id="ogImage" content="https://colinarchive.com/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twTitle" content="Colin Archive">
  <meta name="twitter:description" id="twDesc" content="">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #111111;
      --paper: #181818;
      --paper-2: #1e1e1e;
      --fg: #e6e6e6;
      --fg-2: #c8c8c8;
      --muted: #909090;
      --soft: #555;
      --border: #282828;
      --border-2: #333;
      --red: #ff6b6b;
      --blue: #4ecdc4;
      --green: #51cf66;
      --yellow: #ffe66d;
      --gold: #e8b84b;
      --type-color: var(--blue);
      --serif: 'Crimson Text', Georgia, serif;
      --mono: 'IBM Plex Mono', 'Courier New', monospace;
      --hand: 'Caveat', cursive;
      --essay-serif: 'Libre Baskerville', Georgia, serif;
      --page-width: 780px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--serif);
      min-height: 100vh;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ── Reading progress bar ── */
    .progress-bar {
      position: fixed; top: 58px; left: 0; z-index: 200;
      height: 2px; width: 0%;
      background: var(--type-color);
      transition: width 0.1s linear, background 0.3s ease;
      box-shadow: 0 0 8px var(--type-color);
      pointer-events: none;
    }

    /* ── Nav ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 1rem;
      padding: 0 2.5rem; height: 58px;
      background: rgba(24,24,24,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      transition: border-bottom-color 0.3s, box-shadow 0.3s;
    }
    nav.nav-type-essay { border-bottom-color: var(--blue);  box-shadow: 0 1px 0 rgba(78,205,196,0.15); }
    nav.nav-type-code   { border-bottom-color: var(--green); box-shadow: 0 1px 0 rgba(81,207,102,0.15); }
    nav.nav-type-notes  { border-bottom-color: var(--yellow);box-shadow: 0 1px 0 rgba(255,230,109,0.15); }

    .logo {
      font-family: var(--mono); font-size: 0.72rem;
      letter-spacing: 0.14em; text-transform: uppercase;
      font-weight: 500; text-decoration: none; color: var(--fg-2);
      flex-shrink: 0;
    }
    .logo::after { content: '|'; color: var(--red); animation: blink 1s step-end infinite; margin-left: 2px; }
    @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

    .nav-type-chip {
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em;
      padding: 0.22rem 0.6rem; border-radius: 4px;
      border: 1px solid transparent;
    }
    .nav-type-chip.essay { font-family: var(--essay-serif); color: var(--blue);   border-color: rgba(78,205,196,0.2);  background: rgba(78,205,196,0.05); }
    .nav-type-chip.code  { font-family: var(--mono);        color: var(--green);  border-color: rgba(81,207,102,0.2);  background: rgba(81,207,102,0.05); }
    .nav-type-chip.notes { font-family: var(--hand); font-size: 0.8rem; color: var(--yellow); border-color: rgba(255,230,109,0.2); background: rgba(255,230,109,0.05); }

    .nav-spacer { flex: 1; }

    /* Read time in nav */
    .nav-readtime {
      font-family: var(--mono); font-size: 0.6rem;
      color: var(--muted); letter-spacing: 0.06em;
      opacity: 0; transition: opacity 0.3s;
    }
    .nav-readtime.visible { opacity: 1; }

    /* Share */
    .share-wrap { position: relative; }
    .share-btn {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 0.8rem; border-radius: 6px;
      border: 1px solid var(--border-2); background: transparent;
      color: var(--muted); font-family: var(--mono);
      font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; transition: border-color 0.18s, color 0.18s, background 0.18s;
    }
    .share-btn:hover { border-color: var(--type-color); color: var(--type-color); background: rgba(255,255,255,0.03); }
    .share-btn i { font-size: 0.7rem; }
    .share-dropdown {
      position: absolute; top: calc(100% + 8px); right: 0;
      background: #1c1c1c; border: 1px solid var(--border-2);
      border-radius: 10px; padding: 0.4rem;
      display: none; flex-direction: column; gap: 0.15rem;
      min-width: 170px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      z-index: 200;
    }
    .share-dropdown.open { display: flex; animation: dropIn 0.14s var(--ease); }
    @keyframes dropIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:none} }
    .share-option {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.55rem 0.75rem; border-radius: 7px;
      font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--muted);
      cursor: pointer; background: transparent; border: none;
      width: 100%; text-align: left; text-decoration: none;
      transition: background 0.14s, color 0.14s;
    }
    .share-option:hover { background: rgba(255,255,255,0.05); color: var(--type-color); }
    .share-option i { width: 14px; text-align: center; font-size: 0.78rem; }
    .share-option.copy-success { color: var(--green); }

    /* ── Layout ── */
    .wrapper { width: 100%; padding: 3.5rem 1.5rem 6rem; display: flex; justify-content: center; }

    .page {
      background: var(--paper);
      width: var(--page-width);
      min-width: 320px; max-width: calc(100vw - 3rem);
      padding: 4rem 4.5rem 5rem;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 4px 40px rgba(0,0,0,0.5);
      border-radius: 3px;
      position: relative;
      transition: box-shadow 0.3s;
    }

    /* ── Drag handle ── */
    .drag-handle {
      position: absolute; top: 0; right: -56px;
      width: 56px; height: 100%;
      cursor: ew-resize; z-index: 10;
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 6px;
    }
    /* The border line — on the box edge */
    .drag-handle::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 1.5px; height: 100%;
      background: linear-gradient(to top,
        transparent 0%,
        var(--type-color) 30%,
        var(--type-color) 70%,
        transparent 100%
      );
      opacity: 0.1;
      transform: scaleY(0.35);
      transform-origin: center;
      transition: opacity 0.4s var(--ease), transform 0.5s var(--ease);
      pointer-events: none;
    }
    .drag-handle:hover::before,
    .drag-handle.dragging::before {
      opacity: 0.6;
      transform: scaleY(1);
    }
    /* DRAG text — vertical, outside box */
    .drag-handle::after {
      content: 'DRAG';
      position: relative; z-index: 1;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      color: rgba(255,255,255,0.12);
      user-select: none; pointer-events: none;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }
    .drag-handle:hover::after,
    .drag-handle.dragging::after {
      color: var(--type-color);
      text-shadow: 0 0 12px var(--type-color);
    }

    /* Width indicator */
    .width-indicator {
      position: fixed; z-index: 9999;
      background: #1c1c1c; border: 1px solid var(--border-2);
      color: var(--muted); font-family: var(--mono); font-size: 0.62rem;
      letter-spacing: 0.08em; padding: 0.28rem 0.55rem; border-radius: 4px;
      pointer-events: none; opacity: 0; transition: opacity 0.12s;
      white-space: nowrap;
    }
    .width-indicator.visible { opacity: 1; }

    /* First-time hint */
    .resize-hint {
      position: absolute; top: 2.5rem; right: -52px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      pointer-events: none; z-index: 20;
      animation: hintBounce 1.8s var(--ease) 1.2s both,
                 hintFade   0.5s ease 5.5s forwards;
    }
    .resize-hint-pill {
      background: rgba(22,22,22,0.96);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 0.32rem 0.68rem;
      font-family: var(--mono); font-size: 0.55rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.38); white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    @keyframes hintBounce {
      0%   { opacity:0; transform:translateX(0); }
      15%  { opacity:1; }
      40%  { transform:translateX(8px); }
      65%  { transform:translateX(-4px); }
      85%  { transform:translateX(4px); }
      100% { opacity:1; transform:translateX(0); }
    }
    @keyframes hintFade { to { opacity:0; } }

    /* ── Back link ── */
    .back-link { margin-bottom: 3rem; }
    .back-link a {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: var(--mono); font-size: 0.66rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); text-decoration: none;
      border: 1px solid var(--border); border-radius: 4px;
      padding: 0.5rem 1rem;
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
    }
    .back-link a:hover { border-color: var(--type-color); color: var(--type-color); transform: translateX(-3px); }

    /* ── Post content ── */
    .post-container { width: 100%; }

    /* Title */
    .title {
      font-family: var(--serif); font-size: 2.6rem; font-weight: 600;
      line-height: 1.2; color: var(--fg); margin-bottom: 0.6rem;
      letter-spacing: -0.01em;
    }
    .type-essay .title { font-family: var(--essay-serif); font-weight: 700; font-size: 2.5rem; }
    .type-code  .title { font-family: var(--mono); letter-spacing: -0.03em; font-size: 2rem; }
    .type-notes .title { font-family: var(--hand); font-size: 2.6rem; font-weight: 600; }

    /* Meta line */
    .meta {
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      font-family: var(--mono); font-size: 0.66rem;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 2.2rem;
    }
    .meta-sep { opacity: 0.3; }

    /* Tags */
    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 2rem; }
    .tag {
      font-family: var(--mono); font-size: 0.62rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      border: 1px solid var(--border); border-radius: 4px;
      padding: 0.25rem 0.65rem;
      transition: border-color 0.18s, color 0.18s;
    }
    .tag:hover { border-color: var(--type-color); color: var(--type-color); }

    /* Excerpt */
    .excerpt {
      font-size: 1.25rem; color: var(--fg-2); margin-bottom: 2.5rem;
      font-style: italic; line-height: 1.7;
      border-left: 2px solid var(--type-color); padding-left: 1.2rem;
      opacity: 0.75;
    }

    /* Body content */
    .content {
      font-size: 1.18rem; line-height: 1.9;
      color: var(--fg-2); white-space: pre-wrap;
      word-break: break-word; overflow-wrap: anywhere;
    }
    .type-essay .content { font-size: 1.2rem; }
    .type-notes .content { font-size: 1.12rem; color: var(--fg-2); }

    /* Divider between title area and content */
    .content-divider {
      height: 1px; background: var(--border);
      margin: 2rem 0 2.2rem; opacity: 0.6;
    }

    /* ── Commissioned callout ── */
    .commissioned-callout {
      margin-bottom: 2rem; border: 1px solid rgba(232,184,75,0.18);
      border-radius: 10px; overflow: hidden; background: rgba(232,184,75,0.025);
    }
    .commissioned-callout-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.7rem 1rem; cursor: pointer; user-select: none;
      transition: background 0.2s;
    }
    .commissioned-callout-header:hover { background: rgba(232,184,75,0.04); }
    .commissioned-callout-left { display: flex; align-items: center; gap: 0.5rem; }
    .commissioned-star { color: var(--gold); font-size: 0.6rem; opacity: 0.75; }
    .commissioned-callout-title { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); opacity: 0.75; }
    .commissioned-callout-chevron { font-size: 0.58rem; color: var(--gold); opacity: 0.45; transition: transform 0.35s var(--ease), opacity 0.2s; }
    .commissioned-callout.open .commissioned-callout-chevron { transform: rotate(180deg); opacity: 0.75; }
    .commissioned-callout-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s var(--ease); }
    .commissioned-callout.open .commissioned-callout-body { grid-template-rows: 1fr; }
    .commissioned-callout-inner { overflow: hidden; }
    .commissioned-callout-content { padding: 0 1rem 1rem; display: flex; flex-direction: column; gap: 0.65rem; border-top: 1px solid rgba(232,184,75,0.08); }
    .commissioned-field { display: flex; flex-direction: column; gap: 0.15rem; }
    .commissioned-field-label { font-family: var(--mono); font-size: 0.56rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); opacity: 0.45; padding-top: 0.7rem; }
    .commissioned-field-value { font-family: var(--serif); font-size: 0.96rem; color: var(--muted); line-height: 1.6; font-style: italic; }
    .commissioned-field-name { font-family: var(--hand); font-size: 1.1rem; color: var(--fg); opacity: 0.8; }

    /* ── Terminal (code posts) ── */
    .terminal {
      position: relative; background: #0a0a0a; border: 1px solid #252525;
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,255,0,0.03);
      font-family: var(--mono); font-size: 0.93rem; line-height: 1.65;
    }
    .terminal-header {
      background: #141414; padding: 0.55rem 1rem;
      border-bottom: 1px solid #252525;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .terminal-dot { width: 11px; height: 11px; border-radius: 50%; background: #ff5f56; }
    .terminal-dot:nth-child(2) { background: #ffbd2e; }
    .terminal-dot:nth-child(3) { background: #27c93f; }
    .terminal-title { font-size: 0.62rem; color: #555; margin-left: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .terminal-body { display: flex; position: relative; }
    .line-numbers { padding: 1rem 0 1rem 1rem; text-align: right; color: #3a5a3a; user-select: none; border-right: 1px solid #252525; background: #090909; white-space: nowrap; }
    .line-numbers div { padding-right: 0.85rem; }
    .code-lines { flex: 1; padding: 1rem; overflow-x: auto; background: #090909; }
    .code-line { display: block; white-space: pre; color: #b0f0b0; }
    .copy-btn {
      position: absolute; top: 0.6rem; right: 0.6rem;
      background: #1a1a1a; border: 1px solid #333; border-radius: 5px;
      color: #7abf7a; font-family: var(--mono); font-size: 0.65rem;
      padding: 0.28rem 0.65rem; cursor: pointer;
      display: flex; align-items: center; gap: 0.35rem;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
      z-index: 20;
    }
    .copy-btn:hover { background: #242424; border-color: #b0f0b0; color: #d0f0d0; }
    .copy-btn.copied { background: #1a3a1a; border-color: #b0f0b0; color: #fff; }

    /* ── Locked ── */
    .locked-message {
      text-align: center; padding: 2.5rem 2rem;
      border: 1px dashed rgba(255,107,107,0.35); border-radius: 10px;
      margin-top: 2rem;
      background: repeating-linear-gradient(45deg, rgba(179,0,45,0.04) 0px, rgba(179,0,45,0.04) 10px, transparent 10px, transparent 20px);
      position: relative;
    }
    .locked-message h3 { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.1em; color: var(--red); margin-bottom: 0.85rem; text-transform: uppercase; }
    .locked-message p { color: var(--muted); margin-bottom: 1.5rem; font-size: 1rem; }
    .btn { display: inline-block; padding: 0.65rem 1.4rem; background: transparent; border: 1px solid var(--red); border-radius: 5px; color: var(--red); font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.1em; text-decoration: none; text-transform: uppercase; transition: background 0.2s, color 0.2s; }
    .btn:hover { background: var(--red); color: #000; }
    .locked-icon { position: absolute; top: 1rem; right: 1rem; font-size: 1.8rem; color: rgba(255,255,255,0.3); pointer-events: none; }

    /* ── Loading skeleton ── */
    .loading-skeleton { display: flex; flex-direction: column; gap: 1rem; }
    .skel { border-radius: 4px; background: linear-gradient(90deg, var(--border) 25%, #2a2a2a 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.6s ease-in-out infinite; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    body.is-resizing { user-select: none; cursor: ew-resize; }

    /* ── COMMENTS ── */
    .comments-wrap { margin-top: 5rem; }

    .comments-divider {
      position: relative; text-align: center; margin-bottom: 3rem;
    }
    .comments-divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border); }
    .comments-divider-label {
      position: relative; display: inline-block; background: var(--paper);
      padding: 0 1.2rem;
      font-family: var(--hand); font-size: 1.15rem;
      color: var(--muted); opacity: 0.45; letter-spacing: 0.02em;
    }

    .comment-form-section {
      margin-bottom: 3.5rem;
      padding: 1.5rem 1.8rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .comment-form-title {
      font-family: var(--hand); font-size: 1.25rem;
      color: var(--fg); opacity: 0.4; margin-bottom: 1.2rem;
    }
    .reply-indicator {
      display: none; align-items: center; gap: 0.5rem; margin-bottom: 1rem;
      font-family: var(--hand); font-size: 0.92rem; color: var(--muted);
      background: rgba(255,255,255,0.03); padding: 0.5rem 1rem; border-radius: 20px;
    }
    .reply-indicator span { color: var(--type-color); }
    .cancel-reply { cursor: pointer; padding: 0.2rem 0.5rem; border-radius: 50%; transition: color 0.18s, background 0.18s; }
    .cancel-reply:hover { color: var(--red); background: rgba(255,255,255,0.05); }

    .comment-form { display: flex; flex-direction: column; }
    .comment-form input, .comment-form textarea {
      background: transparent; border: none;
      border-bottom: 1px solid var(--border);
      color: var(--fg); font-family: var(--serif); font-size: 1rem;
      padding: 0.72rem 0; transition: border-color 0.2s;
      resize: none; outline: none; width: 100%;
    }
    .comment-form input::placeholder, .comment-form textarea::placeholder { color: var(--muted); opacity: 0.38; font-style: italic; }
    .comment-form input:focus, .comment-form textarea:focus { border-bottom-color: var(--type-color); }
    .comment-form textarea { min-height: 90px; line-height: 1.7; margin-top: 0.4rem; }
    .comment-form-row { display: flex; align-items: center; justify-content: space-between; margin-top: 1.1rem; gap: 1rem; }
    .comment-feedback { font-family: var(--mono); font-size: 0.6rem; color: var(--green); letter-spacing: 0.04em; flex: 1; }
    .comment-feedback.error { color: var(--red); }
    .comment-submit {
      padding: 0.48rem 1.1rem; background: transparent;
      border: 1px solid var(--border); border-radius: 30px;
      color: var(--muted); font-family: var(--hand); font-size: 1rem;
      cursor: pointer; flex-shrink: 0;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .comment-submit:hover { border-color: var(--type-color); color: var(--type-color); background: rgba(255,255,255,0.02); }
    .comment-submit:disabled { opacity: 0.22; cursor: not-allowed; }

    .comments-header { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1.5rem; }
    .comments-header h3 { font-family: var(--hand); font-size: 1.1rem; color: var(--muted); font-weight: 400; opacity: 0.45; }
    .comments-count { font-family: var(--mono); font-size: 0.6rem; color: var(--type-color); opacity: 0.65; }

    .comment-thread .comment-thread { margin-left: 1.5rem; }
    .comment-item {

      transition: border-color 0.2s, color 0.2s;
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      nav { padding: 0 1rem; }
      .nav-readtime { display: none; }
      .wrapper { padding: 0; }
      .page { padding: 2rem 1.25rem 3.5rem; box-shadow: none; border-radius: 0; min-height: 100vh; width: 100% !important; max-width: 100% !important; }
      .drag-handle, .resize-hint { display: none; }
      .back-link { margin-bottom: 2rem; }
      .back-link a { display: block; text-align: center; }
      .title { font-size: 2rem; }
      .type-essay .title { font-size: 1.9rem; }
      .type-notes .title { font-size: 2rem; }

      .comments-wrap { margin-top: 3rem; }
      .comment-form-section { padding: 1.2rem; }

      .copy-btn { font-size: 0.6rem; padding: 0.22rem 0.5rem; }
      .terminal-dot { width: 9px; height: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<script>
const SUPABASE_URL = "https://lbpkgvmxxcubzbzwoswd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicGtndm14eGN1Ynpiendvc3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNzM2OTQsImV4cCI6MjA4Njg0OTY5NH0.BaP0JY9v74qJPu9qRYoL1Mn3NWM3I-VB51dczOvxnrI";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');

/* ── Reading progress ── */
(function() {
  const bar = $('progressBar');
  window.addEventListener('scroll', () => {
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? (window.scrollY / h * 100) : 0) + '%';
  }, { passive: true });
})();

/* ── Resizable page ── */
(function() {
  const page = $('page'), handle = $('dragHandle'), indicator = $('widthIndicator'), hint = $('resizeHint');
  const KEY = 'colin-page-width', HINT_KEY = 'colin-resize-seen';
  const MIN = 320, MAX = () => window.innerWidth - 32;

  const saved = localStorage.getItem(KEY);
  if (saved) { page.style.width = Math.min(parseInt(saved), MAX()) + 'px'; }
  if (localStorage.getItem(HINT_KEY) && hint) hint.style.display = 'none';

  let sx, sw;
  const dismiss = () => { if (hint) hint.style.display = 'none'; localStorage.setItem(HINT_KEY, '1'); };

  function onMove(e) {
    const x = e.clientX ?? e.touches?.[0]?.clientX;
    const w = Math.min(Math.max(sw + (x - sx), MIN), MAX());
    page.style.width = w + 'px';
    if (indicator) { indicator.textContent = w + 'px'; indicator.style.left = (x + 14) + 'px'; indicator.style.top = (e.clientY ?? 80) + 'px'; }
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.classList.remove('is-resizing');
    handle.classList.remove('dragging');
    if (indicator) indicator.classList.remove('visible');
    localStorage.setItem(KEY, parseInt(page.style.width));
  }

  handle.addEventListener('mousedown', e => {
    dismiss(); e.preventDefault();
    sx = e.clientX; sw = page.offsetWidth;
    document.body.classList.add('is-resizing');
    handle.classList.add('dragging');
    if (indicator) { indicator.textContent = sw + 'px'; indicator.style.left = (sx + 14) + 'px'; indicator.style.top = e.clientY + 'px'; indicator.classList.add('visible'); }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  handle.addEventListener('touchstart', e => {
    dismiss(); sx = e.touches[0].clientX; sw = page.offsetWidth; handle.classList.add('dragging');
  }, { passive: true });
  handle.addEventListener('touchmove', onMove, { passive: true });
  handle.addEventListener('touchend', () => { handle.classList.remove('dragging'); localStorage.setItem(KEY, parseInt(page.style.width)); });
})();

/* ── Helpers ── */
function relTime(iso) {
  const d = new Date(iso), diff = Date.now() - d, s = diff / 1e3, m = s / 60, h = m / 60, day = h / 24;
  if (s < 60) return 'just now';
  if (m < 60) return Math.floor(m) + 'm ago';
  if (h < 24) return Math.floor(h) + 'h ago';
  if (day < 2) return 'yesterday';
  if (day < 7) return Math.floor(day) + 'd ago';
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function calcReadTime(text) { return Math.max(1, Math.round((text || '').trim().split(/\s+/).length / 200)); }
function normalizeIndent(text) {
  const lines = text.split('\n'); let min = Infinity;
  lines.forEach(l => { if (l.trim()) min = Math.min(min, l.match(/^(\s*)/)[0].length); });
  if (!isFinite(min)) min = 0;
  return lines.map(l => l.slice(min)).join('\n');
}

/* ── Meta ── */
function setMeta(post) {
  const title = post.title || 'Colin Archive', excerpt = post.excerpt || '';
  document.title = title + ' — Colin Archive';
  ['metaDesc','ogDesc','twDesc'].forEach(id => { const el = $(id); if (el) el.content = excerpt || title; });
  ['ogTitle','twTitle'].forEach(id => { const el = $(id); if (el) el.content = title; });
  const ogUrl = $('ogUrl'); if (ogUrl) ogUrl.content = location.href;
  const ogImg = $('ogImage'); if (ogImg && post.cover_url) ogImg.content = post.cover_url;
}

/* ── Nav ── */
function setNav(type, readTime) {
  const nav = $('mainNav'), chip = $('navTypeChip'), rt = $('navReadtime');
  nav.className = 'nav-type-' + type;
  chip.className = 'nav-type-chip ' + type;
  chip.textContent = type === 'code' ? 'code' : type === 'notes' ? 'note' : 'essay';
  const colorMap = { essay: '#4ecdc4', code: '#51cf66', notes: '#ffe66d' };
  document.documentElement.style.setProperty('--type-color', colorMap[type] || '#4ecdc4');
  if (rt) { rt.textContent = readTime + ' min read'; setTimeout(() => rt.classList.add('visible'), 400); }
}

/* ── Share ── */
function initShare(post) {
  const url = location.href, title = post.title || 'Colin Archive';
  const btn = $('shareBtn'), dropdown = $('shareDropdown'), copyBtn = $('copyLinkBtn');
  if ($('shareTwitter')) $('shareTwitter').href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`;
  if ($('shareReddit')) $('shareReddit').href = `https://reddit.com/submit?url=${encodeURIComponent(url)}&title=${encodeURIComponent(title)}`;
  if ($('shareWhatsapp')) $('shareWhatsapp').href = `https://wa.me/?text=${encodeURIComponent(title + ' ' + url)}`;
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (navigator.share && window.innerWidth < 700) { navigator.share({ title, url }).catch(() => {}); return; }
    dropdown.classList.toggle('open');
  });
  document.addEventListener('click', e => { if (!$('shareWrap').contains(e.target)) dropdown.classList.remove('open'); });
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(url);
      copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!'; copyBtn.classList.add('copy-success');
      setTimeout(() => { copyBtn.innerHTML = '<i class="fas fa-link"></i> Copy link'; copyBtn.classList.remove('copy-success'); dropdown.classList.remove('open'); }, 1800);
    } catch(e) {}
  });
}

/* ── Commissioned callout ── */
function commissionedHtml(post) {
  if (!post.commissioned) return '';
  const name = esc(post.commissioner_name || ''), req = esc(post.commissioner_request || '');
  if (!name && !req) return '';
  return `<div class="commissioned-callout" id="comCallout">
    <div class="commissioned-callout-header" id="comHeader">
      <div class="commissioned-callout-left"><span class="commissioned-star">✦</span><span class="commissioned-callout-title">Commissioned</span></div>
      <span class="commissioned-callout-chevron">▼</span>
    </div>
    <div class="commissioned-callout-body"><div class="commissioned-callout-inner"><div class="commissioned-callout-content">
      ${name ? `<div class="commissioned-field"><span class="commissioned-field-label">By</span><span class="commissioned-field-name">${name}</span></div>` : ''}
      ${req  ? `<div class="commissioned-field"><span class="commissioned-field-label">Request</span><span class="commissioned-field-value">"${req}"</span></div>` : ''}
    </div></div></div>
  </div>`;
}
function bindCallout() {
  const h = $('comHeader'), c = $('comCallout');
  if (h && c) h.addEventListener('click', () => c.classList.toggle('open'));
}

/* ── Render post ── */
function renderPost(post) {
  setMeta(post);
  const type = post.type || 'essay', isPaid = post.access === 'paid';
  const readTime = post.readtime || calcReadTime(post.content);
  const metaDate = new Date(post.created_at).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
  setNav(type, readTime);
  initShare(post);

  const tags = (post.tags || '').split(',').filter(Boolean).map(t => `<span class="tag">${esc(t.trim())}</span>`).join('');
  const tagsHtml = tags ? `<div class="tags">${tags}</div>` : '';
  const callout = commissionedHtml(post);
  let contentText = post.content || '';
  if (type === 'code') contentText = normalizeIndent(contentText);
  const escaped = esc(contentText);
  let inner;

  if (isPaid) {
    inner = `<div style="position:relative">
      <i class="fas fa-lock locked-icon"></i>
      <h1 class="title">${esc(post.title)}</h1>
      <div class="meta"><span>${metaDate}</span><span class="meta-sep">·</span><span>${readTime} min read</span></div>
      ${tagsHtml}
      <div class="locked-message"><h3>🔒 Paid entry</h3><p>This post requires access.</p><a class="btn" href="#">Unlock</a></div>
    </div>`;
  } else if (type === 'code') {
    const lines = escaped.split('\n');
    inner = `<h1 class="title">${esc(post.title)}</h1>
      <div class="meta"><span>${metaDate}</span><span class="meta-sep">·</span><span>${readTime} min read</span></div>
      ${tagsHtml}
      <div class="terminal">
        <div class="terminal-header"><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-title">code</span></div>
        <div class="terminal-body">
          <div class="line-numbers">${lines.map((_,i)=>`<div>${i+1}</div>`).join('')}</div>
          <div class="code-lines">${lines.map(l=>`<span class="code-line">${l||' '}</span>`).join('')}</div>
        </div>
        <button class="copy-btn" id="copyCodeBtn"><i class="far fa-copy"></i> Copy</button>
      </div>`;
  } else {
    inner = `<h1 class="title">${esc(post.title)}</h1>
      <div class="meta"><span>${metaDate}</span><span class="meta-sep">·</span><span>${readTime} min read</span></div>
      ${callout}
      ${tagsHtml}
      <div class="content-divider"></div>
      <div class="content">${escaped}</div>`;
  }

  $('postContainer').innerHTML = `<div class="type-${type}">${inner}</div>`;
  bindCallout();

  if (type === 'code' && !isPaid) {
    const btn = $('copyCodeBtn');
    if (btn) btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(contentText);
        btn.classList.add('copied'); btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '<i class="far fa-copy"></i> Copy'; }, 2000);
      } catch(e) {}
    });
  }
  if (!isPaid) initComments(post.id);
}

/* ── Comments ── */
let replyParentId = null;
const replyIndicator = $('replyIndicator'), replyToName = $('replyToName');
const cancelReply = $('cancelReply'), commentParentId = $('commentParentId');

if (cancelReply) cancelReply.addEventListener('click', clearReply);
function clearReply() { commentParentId.value = ''; replyParentId = null; if (replyIndicator) replyIndicator.style.display = 'none'; }
function setReply(id, name) {
  commentParentId.value = id; replyParentId = id;
  if (replyToName) replyToName.textContent = name;
  if (replyIndicator) replyIndicator.style.display = 'flex';
  $('commentBody')?.focus();
}

function buildTree(comments, parentId = null) {
  return comments
    .filter(c => (c.parent_id ?? null) === parentId)
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
    .map(c => ({ ...c, replies: buildTree(comments, c.id) }));
}

function renderTree(comments, depth = 0) {
  return comments.map(c => {
    const repliesHtml = c.replies.length
      ? `<button class="show-replies-btn" data-target="replies-${c.id}" data-count="${c.replies.length}"><i class="fas fa-chevron-down"></i> ${c.replies.length} repl${c.replies.length > 1 ? 'ies' : 'y'}</button>
         <div class="replies-container" id="replies-${c.id}">${renderTree(c.replies, depth + 1)}</div>`
      : '';
    return `<div class="comment-item">
      <div class="comment-item-header">
        <span class="comment-item-name">${esc(c.name)}</span>
        <span class="comment-item-date">${relTime(c.created_at)}</span>
      </div>
      <div class="comment-item-body">${esc(c.content)}</div>
      <div class="comment-actions">
        <button class="comment-reply-btn" data-pid="${c.id}" data-pname="${esc(c.name)}"><i class="fas fa-reply"></i> reply</button>
        ${repliesHtml}
      </div>
    </div>`;
  }).join('');
}

async function loadComments(postId) {
  const list = $('commentList'), countEl = $('commentsCount');
  const { data, error } = await db.from('comments').select('id,name,content,created_at,parent_id').eq('post_id', postId).eq('approved', true).order('created_at', { ascending: true });
  if (error || !data?.length) {
    if (list) list.innerHTML = `<div class="comments-empty">${error ? 'Could not load comments.' : 'No comments yet.'}</div>`;
    if (countEl) countEl.textContent = '';
    return;
  }
  if (countEl) countEl.textContent = `(${data.length})`;
  if (list) list.innerHTML = renderTree(buildTree(data));
  list.querySelectorAll('.comment-reply-btn').forEach(btn => btn.addEventListener('click', () => setReply(btn.dataset.pid, btn.dataset.pname)));
  list.querySelectorAll('.show-replies-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      const count = parseInt(btn.dataset.count);
      if (!target) return;
      target.classList.toggle('visible');
      const open = target.classList.contains('visible');
      btn.innerHTML = open
        ? `<i class="fas fa-chevron-up"></i> hide repl${count > 1 ? 'ies' : 'y'}`
        : `<i class="fas fa-chevron-down"></i> ${count} repl${count > 1 ? 'ies' : 'y'}`;
    });
  });
}

function initComments(postId) {
  const wrap = $('commentsWrap');
  if (wrap) wrap.style.display = '';
  loadComments(postId);
  const form = $('commentForm'), nameEl = $('commentName'), bodyEl = $('commentBody');
  const feedback = $('commentFeedback'), submit = $('commentSubmit');
  if (!form) return;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const name = nameEl.value.trim(), body = bodyEl.value.trim(), parentId = commentParentId.value || null;
    if (!name || !body) return;
    submit.disabled = true; feedback.textContent = ''; feedback.className = 'comment-feedback';
    const { error } = await db.from('comments').insert({ post_id: postId, name, content: body, parent_id: parentId });
    if (error) { feedback.textContent = 'Failed. Try again.'; feedback.classList.add('error'); submit.disabled = false; return; }
    nameEl.value = ''; bodyEl.value = ''; clearReply();
    feedback.textContent = 'Posted — pending review.';
    submit.disabled = false;
    loadComments(postId);
  });
}

/* ── Load post ── */
async function loadPost() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) {
    $('postContainer').innerHTML = `<div class="error-state">
      <div class="error-code">400</div>
      <h1 class="error-title">No post specified</h1>
      <p class="error-body">There's no post ID in this URL. You probably followed a broken link.</p>
      <a href="/" class="error-back">← Back to the archive</a>
    </div>`;
    return;
  }
  const { data, error } = await db.from('posts').select('*').eq('id', id).single();
  if (error || !data) {
    $('postContainer').innerHTML = `<div class="error-state">
      <div class="error-code">404</div>
      <h1 class="error-title">Post not found</h1>
      <p class="error-body">This post doesn't exist — it may have been removed, or the link is wrong.</p>
      <a href="/" class="error-back">← Back to the archive</a>
    </div>`;
    return;
  }
  renderPost(data);
}

loadPost();

/* ── View tracking ── */
const _pid = new URLSearchParams(location.search).get('id');
if (_pid) {
  const vk = 'viewed_' + _pid;
  if (!localStorage.getItem(vk)) {
    localStorage.setItem(vk, '1');
    db.rpc('increment_post_views', { post_id: _pid }).catch(() => {});
    const ref = localStorage.getItem('ref');
    if (ref) db.from('referral_visits').insert({ ref, page: 'post:' + _pid }).catch(() => {});
  }
}
</script>
</body>
</html>
